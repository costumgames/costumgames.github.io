<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>El Farolero de las Ruinas</title>
<style>
  :root{
    --sky-top:#0b1224;
    --sky-mid:#1a1440;
    --stone-dark:#2c2542;
    --stone-mid:#453a63;
    --stone-edge:#6a5c8c;
    --lantern:#ffcf7a;
    --lantern-glow:#ffb84d;
    --hazard:#c23b5e;
    --hazard-glow:#ff6b8a;
    --ink:#f0ecff;
    --ink-dim:#a89bc4;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    height:100dvh;
    background:#05070f;
    font-family:'Georgia','Iowan Old Style',serif;
    color:var(--ink);
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
  }
  :root{
    --controls-h: calc(104px + env(safe-area-inset-bottom, 0px));
  }
  #stage{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    touch-action:none;
  }
  #frame{
    position:relative;
    flex:0 0 auto;
    width:min(100vw, calc((100dvh - var(--controls-h)) * 0.5714));
    height:min(calc(100dvh - var(--controls-h)), 175vw);
    max-width:480px;
    max-height:840px;
    box-shadow:0 0 80px rgba(0,0,0,0.6);
    background:var(--sky-top);
    overflow:hidden;
    border-radius:4px;
    touch-action:none;
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
  }
  .hud{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:16px 18px;
    pointer-events:none;
    z-index:5;
  }
  .hud-left{ display:flex; flex-direction:column; gap:2px; }
  .level-label{
    font-size:12px;
    letter-spacing:0.5px;
    color:var(--ink-dim);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .motes{
    font-size:22px;
    color:var(--lantern);
    text-shadow:0 2px 10px rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .motes .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--lantern);
    box-shadow:0 0 8px var(--lantern-glow);
    display:inline-block;
  }
  .restart-btn{
    pointer-events:all;
    background:rgba(69,58,99,0.55);
    border:1px solid rgba(255,255,255,0.12);
    color:var(--ink-dim);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:11px;
    letter-spacing:0.5px;
    padding:8px 12px;
    border-radius:20px;
    cursor:pointer;
  }
  .hud-right{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .menu-btn{
    pointer-events:all;
    background:rgba(69,58,99,0.55);
    border:1px solid rgba(255,255,255,0.12);
    color:var(--ink);
    font-size:15px;
    width:34px; height:34px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .toast{
    position:absolute;
    top:70px;
    left:50%;
    transform:translateX(-50%) translateY(-8px);
    background:rgba(30,24,50,0.92);
    border:1px solid rgba(255,207,122,0.3);
    color:var(--lantern);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:12.5px;
    letter-spacing:0.3px;
    padding:9px 16px;
    border-radius:20px;
    white-space:nowrap;
    z-index:30;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
    z-index:20;
    background:radial-gradient(ellipse at 50% 40%, rgba(30,24,55,0.55), rgba(5,7,15,0.9));
    transition:opacity 0.35s ease;
  }
  .overlay.hidden{ opacity:0; pointer-events:none; }
  .title{ font-size:28px; line-height:1.3; margin:0 0 8px 0; font-weight:400; }
  .title em{ font-style:italic; color:var(--lantern); }
  .subtitle{
    font-size:14px;
    color:var(--ink-dim);
    margin:0 0 30px 0;
    line-height:1.6;
    max-width:270px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .stat{
    font-size:14px;
    color:var(--lantern);
    margin:0 0 26px 0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .btn{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14px;
    letter-spacing:0.5px;
    color:var(--sky-top);
    background:var(--lantern);
    border:none;
    padding:13px 30px;
    border-radius:2px;
    cursor:pointer;
    box-shadow:0 0 24px rgba(255,207,122,0.35);
    transition:transform 0.15s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn.secondary{
    background:transparent;
    color:var(--ink-dim);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:none;
    margin-top:12px;
  }
  .btn.hidden{ display:none; }

  /* Controles táctiles: franja propia debajo del marco del juego,
     ocupa todo el ancho de la pantalla para separar bien movimiento (izq) y salto (der). */
  .controls{
    flex:0 0 auto;
    width:100%;
    max-width:640px;
    height:var(--controls-h);
    box-sizing:border-box;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px calc(env(safe-area-inset-bottom, 0px) * 0.5);
    z-index:50;
  }
  .dpad{
    display:flex;
    gap:10px;
    pointer-events:all;
  }
  .ctrl-btn{
    width:60px; height:60px;
    border-radius:50%;
    background:rgba(69,58,99,0.5);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
    font-size:24px;
    user-select:none;
    touch-action:none;
  }
  .ctrl-btn.active{
    background:rgba(255,207,122,0.28);
    border-color:rgba(255,207,122,0.5);
  }
  .jump-btn{
    width:72px; height:72px;
    border-radius:50%;
    background:rgba(255,207,122,0.18);
    border:1px solid rgba(255,207,122,0.4);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--lantern);
    font-size:13px;
    letter-spacing:0.5px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    pointer-events:all;
    touch-action:none;
    user-select:none;
  }
  .jump-btn.active{
    background:rgba(255,207,122,0.4);
  }
  @media (hover:hover) and (pointer:fine){
    .controls{ opacity:0.55; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="frame">
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="hud-left">
        <div class="level-label" id="levelLabel">nivel 1</div>
        <div class="motes"><span class="dot"></span><span id="moteLabel">0 / 0</span></div>
      </div>
      <div class="hud-right">
        <button class="restart-btn" id="restartBtn">reiniciar nivel</button>
        <button class="menu-btn" id="menuBtn" aria-label="menú">☰</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="overlay" id="startOverlay">
      <h1 class="title">El <em>farolero</em><br>de las ruinas</h1>
      <p class="subtitle">Cruza las ruinas flotantes, recoge <em>todas</em> las motas de luz<br>y enciende el faro al final de cada tramo.<br><br>flechas / A D para moverte · espacio para saltar</p>
      <button class="btn" id="startBtn">Comenzar</button>
      <button class="btn secondary hidden" id="loadBtnStart">Cargar partida</button>
    </div>

    <div class="overlay hidden" id="levelCompleteOverlay">
      <p class="title" id="completeTitle">Faro encendido</p>
      <p class="stat" id="completeStat">3 / 3 motas</p>
      <button class="btn" id="nextBtn">Siguiente tramo</button>
    </div>

    <div class="overlay hidden" id="menuOverlay">
      <p class="title" style="font-size:24px;">Partida</p>
      <p class="subtitle" id="menuStatus">nivel 1</p>
      <button class="btn" id="saveBtn">Guardar partida</button>
      <button class="btn secondary" id="loadBtn">Cargar partida</button>
      <button class="btn secondary" id="restartGameBtn">Volver a empezar</button>
      <button class="btn secondary" id="closeMenuBtn">Seguir jugando</button>
    </div>

  </div>

  <div class="controls">
    <div class="dpad">
      <div class="ctrl-btn" id="leftBtn">◂</div>
      <div class="ctrl-btn" id="rightBtn">▸</div>
    </div>
    <div class="jump-btn" id="jumpBtn">saltar</div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const frame = document.getElementById('frame');

  const levelLabel = document.getElementById('levelLabel');
  const moteLabel = document.getElementById('moteLabel');
  const restartBtn = document.getElementById('restartBtn');
  const menuBtn = document.getElementById('menuBtn');
  const menuOverlay = document.getElementById('menuOverlay');
  const menuStatus = document.getElementById('menuStatus');
  const saveBtn = document.getElementById('saveBtn');
  const loadBtn = document.getElementById('loadBtn');
  const loadBtnStart = document.getElementById('loadBtnStart');
  const restartGameBtn = document.getElementById('restartGameBtn');
  const closeMenuBtn = document.getElementById('closeMenuBtn');
  const toast = document.getElementById('toast');
  const startOverlay = document.getElementById('startOverlay');
  const levelCompleteOverlay = document.getElementById('levelCompleteOverlay');
  const completeTitle = document.getElementById('completeTitle');
  const completeStat = document.getElementById('completeStat');
  const startBtn = document.getElementById('startBtn');
  const nextBtn = document.getElementById('nextBtn');
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');
  const jumpBtn = document.getElementById('jumpBtn');

  // ---------- Lienzo lógico fijo, escalado por CSS ----------
  const SCREEN_W = 400, SCREEN_H = 700;
  let DPR = 1;
  function resize(){
    const rect = frame.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = SCREEN_W * DPR;
    canvas.height = SCREEN_H * DPR;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', ()=>setTimeout(resize,200));
  if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---------- Física ----------
  const GRAVITY = 1900;
  const MOVE_SPEED = 230;
  const JUMP_VY = -660;
  const MAX_FALL = 950;
  const PLAYER_W = 24, PLAYER_H = 34;

  // ---------- Generación infinita de niveles ----------
  // RNG con semilla: cada nivel N siempre genera el mismo trazado (reproducible),
  // pero la secuencia de niveles no tiene fin.
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed>>>15, 1 | seed);
      t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
      return ((t ^ t>>>14) >>> 0) / 4294967296;
    };
  }

  const GROUND_Y = 650, GROUND_H = 60;
  const SAFE_JUMP_GAP = 140; // brecha máxima saltable sin ayuda, con margen
  // Con JUMP_VY=-660 y GRAVITY=1900 la altura máxima de salto es ~114px.
  // Toda plataforma "de un solo salto" debe quedar bien por debajo de eso.
  const SAFE_JUMP_RISE = 95;
  const PARKOUR_STEP_RISE = 82; // subida por escalón en una cadena de parkour

  // Genera una pequeña cadena de plataformas ascendentes (2-3 escalones) para
  // que ciertas motas, más altas, sólo se puedan alcanzar saltando de una a otra.
  function buildParkourChain(startX, rng){
    const steps = 2 + Math.floor(rng()*2); // 2 o 3 escalones
    const chainPlatforms = [];
    let px = startX;
    let py = GROUND_Y;
    let dir = 1;
    for(let s=0; s<steps; s++){
      const rise = PARKOUR_STEP_RISE - rng()*15; // 67-82px por escalón
      const horiz = 70 + rng()*35; // 70-105px de avance
      py -= rise;
      px += dir*horiz;
      chainPlatforms.push({x:px, y:py, w:76, h:16});
      if(rng() < 0.3) dir = -dir; // zigzag ocasional, sensación de parkour
    }
    return {platforms: chainPlatforms, topX: px, topY: py};
  }

  function generateLevel(n){
    const rng = mulberry32(1000 + n*97);
    const difficulty = Math.min(n, 12); // la dificultad sube y luego se estabiliza

    const platforms = [];
    const movingPlatforms = [];
    const spikes = [];
    const motesArr = [];

    // tramo inicial, siempre seguro
    let x = 260;
    platforms.push({x:0, y:GROUND_Y, w:x, h:GROUND_H});
    const playerStart = {x:40, y:600};

    const segmentCount = 5 + Math.min(difficulty, 5);
    for(let i=0; i<segmentCount; i++){
      const gapBase = 70 + difficulty*7;
      let gapWidth = Math.min(gapBase + rng()*50, 220);
      const needsBridge = gapWidth > SAFE_JUMP_GAP;

      if(needsBridge){
        const amp = Math.max(35, (gapWidth-60)/2);
        const baseX = x + gapWidth/2 - 55;
        movingPlatforms.push({
          baseX, baseY: GROUND_Y-40, amp,
          axis:'x', speed:0.9+rng()*0.4, w:110, h:16
        });
      }
      x += gapWidth;

      const segWidth = 160 + rng()*140;
      platforms.push({x, y:GROUND_Y, w:segWidth, h:GROUND_H});

      if(i>=2 && rng() < Math.min(0.18+difficulty*0.045, 0.55)){
        const spikeW = 50 + rng()*40;
        const spikeX = x + segWidth*0.3 + rng()*segWidth*0.3;
        spikes.push({x:spikeX, y:GROUND_Y, w:spikeW, h:18});
      }

      const collectibleRoll = rng();
      if(collectibleRoll < 0.32){
        // mota simple, a ras de suelo
        motesArr.push({x:x+segWidth*0.5, y:GROUND_Y-40});
      } else if(collectibleRoll < 0.62){
        // una sola plataforma flotante, siempre alcanzable de un salto directo
        const fx = x + segWidth*0.3 + rng()*segWidth*0.4;
        const fy = GROUND_Y - 55 - rng()*SAFE_JUMP_RISE*0.4;
        platforms.push({x:fx, y:fy, w:80, h:16});
        motesArr.push({x:fx+40, y:fy-25});
      } else {
        // cadena de parkour: hay que ir de plataforma en plataforma para llegar arriba
        const startX = x + segWidth*0.22 + rng()*segWidth*0.15;
        const chain = buildParkourChain(startX, rng);
        for(const p of chain.platforms) platforms.push(p);
        motesArr.push({x:chain.topX+38, y:chain.topY-25});
      }

      x += segWidth;
    }

    const goal = {x:x-70, y:GROUND_Y-60, w:26, h:60};

    return {width: x+40, playerStart, platforms, movingPlatforms, spikes, motes: motesArr, goal};
  }

  const levelCache = {};
  function getLevel(idx){
    if(!levelCache[idx]) levelCache[idx] = generateLevel(idx);
    return levelCache[idx];
  }

  // ---------- Estado ----------
  const STATE = {READY:0, PLAYING:1, LEVEL_DONE:2};
  let state = STATE.READY;
  let levelIndex = 0;
  let totalMotesCollected = 0;

  let player, camX, motes, movingPlatforms, deathFlash, goalCooldown;
  let time = 0;
  let paused = false;

  const input = {left:false, right:false, jumpHeld:false, jumpQueued:false};

  function loadLevel(idx){
    const lvl = getLevel(idx);
    player = {
      x: lvl.playerStart.x, y: lvl.playerStart.y,
      w: PLAYER_W, h: PLAYER_H,
      vx:0, vy:0, onGround:false, facing:1
    };
    camX = 0;
    motes = lvl.motes.map(m=>({x:m.x, y:m.y, collected:false}));
    movingPlatforms = lvl.movingPlatforms.map(mp=>{
      const p = Object.assign({}, mp);
      p.x = mp.axis==='x' ? mp.baseX : mp.baseX;
      p.y = mp.axis==='y' ? mp.baseY : mp.baseY;
      p.prevX = p.x; p.prevY = p.y;
      return p;
    });
    deathFlash = 0;
    goalCooldown = 0;
    updateHud();
  }

  function collectedThisLevel(){
    return motes.filter(m=>m.collected).length;
  }

  function updateHud(){
    levelLabel.textContent = 'nivel ' + (levelIndex+1);
    moteLabel.textContent = collectedThisLevel() + ' / ' + motes.length;
  }

  // ---------- Mensajes flotantes ----------
  let toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'), 1800);
  }

  // ---------- Guardar / cargar partida ----------
  const SAVE_KEY = 'farolero-save';
  function hasSave(){
    try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
  }
  function saveGame(){
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        levelIndex, totalMotesCollected
      }));
      showToast('Partida guardada · nivel ' + (levelIndex+1));
    }catch(e){
      showToast('No se pudo guardar la partida');
    }
    refreshLoadButtons();
  }
  function loadGame(){
    let data = null;
    try{ data = JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){}
    if(!data){ showToast('No hay partida guardada'); return; }
    levelIndex = data.levelIndex || 0;
    totalMotesCollected = data.totalMotesCollected || 0;
    loadLevel(levelIndex);
    state = STATE.PLAYING;
    startOverlay.classList.add('hidden');
    levelCompleteOverlay.classList.add('hidden');
    menuOverlay.classList.add('hidden');
    paused = false;
    showToast('Partida cargada · nivel ' + (levelIndex+1));
  }
  function refreshLoadButtons(){
    const exists = hasSave();
    loadBtnStart.classList.toggle('hidden', !exists);
    loadBtn.classList.toggle('hidden', !exists);
  }

  function openMenu(){
    menuStatus.textContent = 'nivel ' + (levelIndex+1) + ' · ' + collectedThisLevel() + '/' + motes.length + ' motas';
    refreshLoadButtons();
    menuOverlay.classList.remove('hidden');
    paused = true;
  }
  function closeMenu(){
    menuOverlay.classList.add('hidden');
    paused = false;
  }

  function startGame(){
    levelIndex = 0;
    totalMotesCollected = 0;
    loadLevel(0);
    state = STATE.PLAYING;
    startOverlay.classList.add('hidden');
    levelCompleteOverlay.classList.add('hidden');
    menuOverlay.classList.add('hidden');
    paused = false;
  }

  function restartLevel(){
    loadLevel(levelIndex);
    state = STATE.PLAYING;
    levelCompleteOverlay.classList.add('hidden');
    paused = false;
  }

  function completeLevel(){
    state = STATE.LEVEL_DONE;
    totalMotesCollected += collectedThisLevel();
    completeTitle.textContent = 'Faro encendido';
    completeStat.textContent = collectedThisLevel() + ' / ' + motes.length + ' motas de este tramo';
    setTimeout(()=>levelCompleteOverlay.classList.remove('hidden'), 300);
  }

  function nextLevel(){
    levelIndex++;
    loadLevel(levelIndex);
    state = STATE.PLAYING;
    levelCompleteOverlay.classList.add('hidden');
  }

  function die(){
    if(state !== STATE.PLAYING) return;
    deathFlash = 1;
    const lvl = getLevel(levelIndex);
    player.x = lvl.playerStart.x;
    player.y = lvl.playerStart.y;
    player.vx = 0; player.vy = 0;
  }

  // ---------- Entrada ----------
  function bindHold(el, onDown, onUp){
    el.addEventListener('pointerdown', e=>{ e.preventDefault(); el.classList.add('active'); onDown(); });
    ['pointerup','pointerleave','pointercancel'].forEach(evt=>{
      el.addEventListener(evt, e=>{ e.preventDefault(); el.classList.remove('active'); onUp(); });
    });
  }
  bindHold(leftBtn, ()=>input.left=true, ()=>input.left=false);
  bindHold(rightBtn, ()=>input.right=true, ()=>input.right=false);
  bindHold(jumpBtn, ()=>{ input.jumpHeld=true; input.jumpQueued=true; }, ()=>input.jumpHeld=false);

  window.addEventListener('keydown', e=>{
    if(['ArrowLeft','KeyA'].includes(e.code)) input.left = true;
    if(['ArrowRight','KeyD'].includes(e.code)) input.right = true;
    if(['Space','ArrowUp','KeyW'].includes(e.code)){
      if(!input.jumpHeld) input.jumpQueued = true;
      input.jumpHeld = true;
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', e=>{
    if(['ArrowLeft','KeyA'].includes(e.code)) input.left = false;
    if(['ArrowRight','KeyD'].includes(e.code)) input.right = false;
    if(['Space','ArrowUp','KeyW'].includes(e.code)) input.jumpHeld = false;
  });

  startBtn.addEventListener('click', e=>{e.stopPropagation(); startGame();});
  nextBtn.addEventListener('click', e=>{e.stopPropagation(); nextLevel();});
  restartBtn.addEventListener('click', e=>{e.stopPropagation(); restartLevel();});
  menuBtn.addEventListener('click', e=>{e.stopPropagation(); openMenu();});
  closeMenuBtn.addEventListener('click', e=>{e.stopPropagation(); closeMenu();});
  saveBtn.addEventListener('click', e=>{e.stopPropagation(); saveGame();});
  loadBtn.addEventListener('click', e=>{e.stopPropagation(); loadGame();});
  loadBtnStart.addEventListener('click', e=>{e.stopPropagation(); loadGame();});
  restartGameBtn.addEventListener('click', e=>{e.stopPropagation(); startGame();});
  const allTapButtons = [startBtn,nextBtn,restartBtn,menuBtn,closeMenuBtn,saveBtn,loadBtn,loadBtnStart,restartGameBtn];
  allTapButtons.forEach(b=>{
    b.addEventListener('touchend', e=>{ e.preventDefault(); e.stopPropagation(); b.click(); }, {passive:false});
  });

  document.addEventListener('touchstart', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e=>{
    const now = Date.now();
    if(now-lastTouchEnd<=300) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false});
  document.addEventListener('gesturestart', e=>e.preventDefault());

  // ---------- Colisiones ----------
  function aabb(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function allSolids(lvl){
    return lvl.platforms.concat(movingPlatforms);
  }

  function update(dt){
    if(paused) return;
    time += dt;
    const lvl = getLevel(levelIndex);

    for(const mp of movingPlatforms){
      mp.prevX = mp.x; mp.prevY = mp.y;
      if(mp.axis==='x') mp.x = mp.baseX + Math.sin(time*mp.speed)*mp.amp;
      else mp.y = mp.baseY + Math.sin(time*mp.speed)*mp.amp;
    }

    if(deathFlash>0) deathFlash = Math.max(0, deathFlash-dt*3);

    if(state !== STATE.PLAYING) return;

    if(input.left && !input.right){ player.vx = -MOVE_SPEED; player.facing=-1; }
    else if(input.right && !input.left){ player.vx = MOVE_SPEED; player.facing=1; }
    else player.vx = 0;

    if(input.jumpQueued && player.onGround){
      player.vy = JUMP_VY;
      player.onGround = false;
    }
    input.jumpQueued = false;

    player.vy += GRAVITY*dt;
    if(player.vy > MAX_FALL) player.vy = MAX_FALL;

    const solids = allSolids(lvl);
    let standingOn = null;

    // eje X
    player.x += player.vx*dt;
    for(const s of solids){
      if(aabb(player,s)){
        if(player.vx > 0) player.x = s.x - player.w;
        else if(player.vx < 0) player.x = s.x + s.w;
      }
    }
    if(player.x < 0) player.x = 0;
    if(player.x + player.w > lvl.width) player.x = lvl.width - player.w;

    // eje Y
    player.y += player.vy*dt;
    player.onGround = false;
    for(const s of solids){
      if(aabb(player,s)){
        if(player.vy > 0){
          player.y = s.y - player.h;
          player.vy = 0;
          player.onGround = true;
          standingOn = s;
        } else if(player.vy < 0){
          player.y = s.y + s.h;
          player.vy = 0;
        }
      }
    }

    if(standingOn && standingOn.axis){
      player.x += (standingOn.x - standingOn.prevX);
      player.y += (standingOn.y - standingOn.prevY);
    }

    if(player.y > SCREEN_H + 60){ die(); }

    for(const sp of lvl.spikes){
      const hb = {x:sp.x+4, y:sp.y-sp.h, w:sp.w-8, h:sp.h};
      if(aabb(player,hb)){ die(); break; }
    }

    for(const m of motes){
      if(!m.collected && Math.abs((player.x+player.w/2)-m.x) < 22 && Math.abs((player.y+player.h/2)-m.y) < 22){
        m.collected = true;
        updateHud();
      }
    }

    if(aabb(player, lvl.goal)){
      if(collectedThisLevel() >= motes.length){
        completeLevel();
      } else if(goalCooldown <= 0){
        const faltan = motes.length - collectedThisLevel();
        showToast('Faltan ' + faltan + (faltan===1 ? ' luz' : ' luces') + ' por recoger');
        goalCooldown = 1.6;
      }
    }
    if(goalCooldown > 0) goalCooldown -= dt;

    camX = Math.max(0, Math.min(player.x + player.w/2 - SCREEN_W*0.4, lvl.width - SCREEN_W));
  }

  // ---------- Dibujo ----------
  function drawBackground(lvl){
    const g = ctx.createLinearGradient(0,0,0,SCREEN_H);
    g.addColorStop(0, '#0b1224');
    g.addColorStop(0.6, '#161138');
    g.addColorStop(1, '#241b3d');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,SCREEN_W,SCREEN_H);

    // luna
    ctx.save();
    ctx.fillStyle = '#f4ecd8';
    ctx.globalAlpha = 0.85;
    ctx.shadowColor = 'rgba(244,236,216,0.4)';
    ctx.shadowBlur = 26;
    ctx.beginPath();
    ctx.arc(SCREEN_W*0.8, 70, 22, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // estrellas con parallax leve
    ctx.fillStyle = 'rgba(240,236,255,0.5)';
    for(let i=0;i<40;i++){
      const sx = (i*137.5) % (lvl.width);
      const px = sx - camX*0.3;
      const wrapped = ((px % SCREEN_W) + SCREEN_W) % SCREEN_W;
      const sy = (i*71) % 300 + 20;
      ctx.globalAlpha = 0.3 + 0.4*Math.sin(i*13+time);
      ctx.beginPath();
      ctx.arc(wrapped, sy, 1.4, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // siluetas lejanas de ruinas (parallax)
    ctx.fillStyle = 'rgba(20,16,38,0.6)';
    for(let i=0;i<8;i++){
      const bx = i*300 - (camX*0.5)%300 - 150;
      ctx.fillRect(bx, 500, 60, 200);
      ctx.fillRect(bx+70, 540, 30, 160);
    }
  }

  function drawPlatform(p){
    const x = p.x - camX;
    if(x+p.w < -20 || x > SCREEN_W+20) return;
    const isMoving = !!p.axis;
    ctx.fillStyle = isMoving ? '#5a4a7c' : '#453a63';
    ctx.fillRect(x, p.y, p.w, p.h);
    ctx.fillStyle = isMoving ? '#8a76b8' : '#6a5c8c';
    ctx.fillRect(x, p.y, p.w, 4);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    for(let bx=x+18; bx<x+p.w; bx+=26){
      ctx.beginPath(); ctx.moveTo(bx,p.y+4); ctx.lineTo(bx,p.y+p.h); ctx.stroke();
    }
  }

  function drawSpikes(sp){
    const x = sp.x - camX;
    if(x+sp.w < -20 || x > SCREEN_W+20) return;
    const n = Math.max(2, Math.round(sp.w/18));
    const step = sp.w/n;
    for(let i=0;i<n;i++){
      const sx = x+i*step;
      ctx.beginPath();
      ctx.moveTo(sx, sp.y);
      ctx.lineTo(sx+step/2, sp.y-sp.h);
      ctx.lineTo(sx+step, sp.y);
      ctx.closePath();
      ctx.fillStyle = '#3a1830';
      ctx.fill();
      ctx.fillStyle = 'rgba(255,107,138,0.55)';
      ctx.beginPath();
      ctx.arc(sx+step/2, sp.y-sp.h, 2, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawMote(m){
    if(m.collected) return;
    const x = m.x - camX, y = m.y;
    if(x < -20 || x > SCREEN_W+20) return;
    const pulse = 0.6 + 0.4*Math.sin(time*4 + m.x);
    ctx.save();
    ctx.globalAlpha = pulse;
    const glow = ctx.createRadialGradient(x,y,0,x,y,14);
    glow.addColorStop(0,'rgba(255,207,122,0.7)');
    glow.addColorStop(1,'rgba(255,207,122,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x,y,14,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffe9b8';
    ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawGoal(goal, lit){
    const x = goal.x - camX;
    if(x+goal.w < -30 || x > SCREEN_W+30) return;
    ctx.fillStyle = '#332a4a';
    ctx.fillRect(x+goal.w/2-3, goal.y, 6, goal.h);
    const flameY = goal.y - 6;
    const glow = ctx.createRadialGradient(x+goal.w/2, flameY, 0, x+goal.w/2, flameY, lit?26:14);
    glow.addColorStop(0, lit? 'rgba(255,207,122,0.85)' : 'rgba(120,110,150,0.4)');
    glow.addColorStop(1, 'rgba(255,207,122,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x+goal.w/2, flameY, lit?26:14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = lit ? '#ffcf7a' : '#5a4f78';
    ctx.beginPath(); ctx.arc(x+goal.w/2, flameY, 7, 0, Math.PI*2); ctx.fill();
  }

  function drawPlayer(){
    const x = player.x - camX, y = player.y;
    ctx.save();
    ctx.translate(x+player.w/2, y+player.h/2);
    ctx.scale(player.facing,1);

    // halo del farol
    const glow = ctx.createRadialGradient(6,4,0,6,4,20);
    glow.addColorStop(0,'rgba(255,207,122,0.5)');
    glow.addColorStop(1,'rgba(255,207,122,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(6,4,20,0,Math.PI*2); ctx.fill();

    // capa/cuerpo
    ctx.fillStyle = '#3a3158';
    ctx.beginPath();
    ctx.moveTo(-player.w/2, player.h/2);
    ctx.quadraticCurveTo(-player.w/2-2, -4, -player.w/2+6, -player.h/2+2);
    ctx.lineTo(player.w/2-4, -player.h/2+6);
    ctx.quadraticCurveTo(player.w/2+2, 0, player.w/2-2, player.h/2);
    ctx.closePath();
    ctx.fill();

    // capucha
    ctx.fillStyle = '#2c2542';
    ctx.beginPath();
    ctx.ellipse(-2,-player.h/2+8, 10, 9, 0, 0, Math.PI*2);
    ctx.fill();

    // farol
    ctx.fillStyle = '#8a76b8';
    ctx.fillRect(player.w/2-6, -2, 3, 10);
    ctx.fillStyle = '#ffcf7a';
    ctx.shadowColor = '#ffb84d';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(player.w/2-4, 6, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  function draw(){
    const lvl = getLevel(levelIndex);
    drawBackground(lvl);
    for(const p of lvl.platforms) drawPlatform(p);
    for(const p of movingPlatforms) drawPlatform(p);
    for(const sp of lvl.spikes) drawSpikes(sp);
    for(const m of motes) drawMote(m);
    drawGoal(lvl.goal, state===STATE.LEVEL_DONE);
    if(state===STATE.PLAYING || state===STATE.LEVEL_DONE) drawPlayer();

    if(deathFlash>0){
      ctx.fillStyle = 'rgba(194,59,94,'+(deathFlash*0.35)+')';
      ctx.fillRect(0,0,SCREEN_W,SCREEN_H);
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function loop(now){
    const dt = Math.min((now-last)/1000, 0.033);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  loadLevel(0);
  refreshLoadButtons();
  requestAnimationFrame(loop);
})();
</script>
</body>
