<script>
const ROWS=8,$=id=>document.getElementById(id),cl=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- datos guardados ---------- */
const DS={snd:1,mus:0,rm:0,hc:0,air:0},DT={deaths:0,wins:0,pearls:0,time:0,streak:0,best:0};
let SV={stars:[],st:{...DT},ach:{},set:{...DS},skin:0,daily:{},mine:[],comm:[],cs:{},author:''};
try{const x=JSON.parse(localStorage.getItem('marea3'));if(x){SV=Object.assign(SV,x);SV.set={...DS,...SV.set};SV.st={...DT,...SV.st}}}catch(e){}

const done=()=>SV.stars.filter(s=>s>0).length,totS=()=>SV.stars.reduce((a,b)=>a+(b||0),0);
const SK=[['#e4572e','#b83b1c','Rojo',0],['#3a86ff','#2456b3','Azul',15],['#ffbe0b','#b88700','Dorado',60],['#9b5de5','#6a3aa8','Morado',120]];
const ACH=[['first','Primer paso','Supera un nivel',()=>SV.st.wins>=1],['l10','Marinero','Supera 10 niveles',()=>done()>=10],['l50','Capitán','Supera 50 niveles',()=>done()>=50],['l100','Señor de la marea','Supera los 100 niveles',()=>done()>=100],['p10','Buscaperlas','Recoge 10 perlas',()=>SV.st.pearls>=10],['s3','Perfeccionista','3 estrellas en 10 niveles',()=>SV.stars.filter(s=>s==3).length>=10],['st5','Sin fallar','5 victorias seguidas sin morir',()=>SV.st.streak>=5],['dl','Diario','Completa un reto diario',()=>!!SV.daily.done],['in10','Sin fin','Llega a 10 en modo infinito',()=>SV.st.best>=10],['cr','Creador','Comparte un nivel que hayas superado',()=>SV.mine.some(m=>m.shared)],['cm5','Explorador','Supera 5 niveles de la comunidad',()=>Object.values(SV.cs).filter(v=>v>0).length>=5]];
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function chk(){for(const[id,n,d,f]of ACH)if(!SV.ach[id]&&f()){SV.ach[id]=1;toast('🏆 '+n+': '+d);sfx('ach')}save()}
/* ---------- sonido ---------- */
let AC,amb,mi;
const au=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();return AC};
function tone(f,d,ty,v,sl,dl){if(!SV.set.snd)return;const a=au();if(!a)return;const t0=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t0);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t0+d);g.gain.setValueAtTime(v||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d)}
function sfx(k){if(k=='pearl'){tone(880,.25,'sine',.16,500)}else if(k=='bub'){tone(500,.15,'sine',.12,400)}else if(k=='die'){tone(320,.6,'sawtooth',.12,-250)}else if(k=='win'){[523,659,784,1046].forEach((f,i)=>tone(f,.3,'triangle',.14,0,i*.12))}else if(k=='ach'){[784,988,1318].forEach((f,i)=>tone(f,.25,'square',.06,0,i*.1))}else if(k=='hint'){tone(660,.12,'sine',.1)}}
function ambient(v){if(!SV.set.snd){if(amb)amb.gain.value=0;return}const a=au();if(!a)return;if(!amb){const b=a.createBuffer(1,a.sampleRate*2,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;s.loop=true;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=500;amb=a.createGain();amb.gain.value=0;s.connect(f);f.connect(amb);amb.connect(a.destination);s.start()}amb.gain.value=Math.min(.12,.012+v*.05)}
function music(){clearInterval(mi);if(SV.set.mus&&SV.set.snd){const sc=[261,294,349,392,440,523];mi=setInterval(()=>tone(sc[Math.random()*6|0],1.6,'triangle',.04),900)}}
/* ---------- generador de niveles ---------- */
function gen(i,seed){

 const q={dr:.13+.0022*i,spd:1.7+.008*i,fs:1.3+.012*i};
 const mf=Math.max(3,Math.min(8,Math.floor(.5*q.spd/q.dr)));
 const P=(n,v)=>{for(let k=0;k<n;k++)H.push(v)};
 P(4,1);let pk='';
 const ns=Math.min(18,7+Math.floor(i/5)),mh=Math.min(5,2+Math.floor(i/12));
 for(let s=0;s<ns;s++){
  const o=['w','w'];if(i>=1)o.push('u');if(i>=4)o.push('f');if(i>=7)o.push('g');if(i>=10)o.push('cu');if(i>=14)o.push('hf');if(i>=17)o.push('rk');if(i>=22)o.push('jl');
  const k=o[r()*o.length|0];ty.add(k);
  const g0=H.length;P(4+(r()*(i<50?3:2)|0)+(k=='hf'?2:0)+(['u','g','hf'].includes(k)&&['f','jl','cu','rk'].includes(pk)?2:0),h);pk=k;gp.push([g0,H.length,h]);
  const a=H.length;
  if(k=='w'){const d=1+(r()*Math.min(4,1+i/18)|0);let n=r()<.65?h+d:h-d;n=Math.max(1,Math.min(mh,n));if(n==h)n=h<mh?h+1:h-1;h=n;P(2+(r()*2|0),h)}
  else if(k=='u'||k=='hf'){const l=k=='u'?3+(r()*(mf-2)|0):Math.min(mf,5);P(l,h);for(let c=a+1;c<a+l;c+=2)E.push({k:'u',x:c+.5});
   if(k=='hf'){E.push({k:'f',x0:a+1,x1:a+l-.5,y:h+1,d:1});if(i>=45)E.push({k:'f',x0:a+1,x1:a+l-.5,y:h+1,d:-1})}
   E.push({k:'b',x:a+l/2,y:h+1.6})}
  else if(k=='f'||k=='jl'){P(6,h);const j=k=='jl',y=j?h+1:h+.3;E.push({k:'f',x0:a+1,x1:a+5,y,d:1,j});if(i>=20)E.push({k:'f',x0:a+1,x1:a+5,y,d:-1,j})}

  else if(k=='cu'){const l=4+(r()*3|0);P(l,h);E.push({k:'c',x0:a,x1:a+l,v:r()<.65?-q.spd*1.1:1});E.push({k:'b',x:a+l/2,y:h+1.6})}

 P(4,h);
 const np=1+(i>=25)+(i>=50)+(i>=75),pe=[],ix=gp.map((_,k)=>k);
 for(let n=0;n<np&&ix.length;n++){const g=gp[ix.splice(r()*ix.length|0,1)[0]];pe.push({x:g[0]+1+r()*(g[1]-g[0]-2),y:r()<.5?g[2]+.3:g[2]+1.6})}

 let tip='Sube el agua para que el cangrejo flote sobre los muros, pero bájala en cuanto pase. Recoge las perlas para las estrellas.';
 if(ty.has('u'))tip+=' Erizos: flota por encima.';
 if(ty.has('f'))tip+=' Peces: con poca agua quedan varados.';
 if(ty.has('g'))tip+=' Gaviotas: en la zona sombreada, cangrejo sumergido.';
 if(ty.has('hf'))tip+=' Pez alto sobre erizos: muy alto o muy justo.';
 if(ty.has('cu'))tip+=' Corrientes: solo actúan sobre el cangrejo sumergido. Baja el agua para no sufrirlas.';
 if(ty.has('rk'))tip+=' Rocas colgantes: mantén el agua baja.';
 if(ty.has('jl'))tip+=' Medusas: suben y bajan, pero varan con poca agua.';
 if(tide)tip+=' Marea viva: el agua se mueve sola, corrígela.';

/* ---------- estado ---------- */
const cv=$('c'),cx=cv.getContext('2d');
let W,Hh,cell,S,gm='play',pg='play',T=1.5,drag=0,keys={},MD={t:'lv',i:0},inf=null;
function fit(){const w=Math.min(cv.parentElement.clientWidth,960),d=window.devicePixelRatio||1;W=w;Hh=Math.round(w*.62);cv.style.width=w+'px';cv.style.height=Hh+'px';cv.width=W*d;cv.height=Hh*d;cx.setTransform(d,0,0,d,0,0);cell=Hh/ROWS}
addEventListener('resize',fit);
function start(g){const H=g.H,q=g.q;
 S={H,n:H.length,q,x:1.2,y:H[1],L:1.5,O:1,t:0,tm:0,mv:0,hints:0,died:0,hint:null,tide:g.tide,th:g.th,sg:g.sg,msg:'',
 par:(H.length-6)/q.spd*1.5+3,

function fillSel(){const s=$('sel');s.innerHTML='';for(let i=0;i<100;i++){const o=document.createElement('option');o.value=i;const st=SV.stars[i]||0;o.textContent=(st?'★'.repeat(st)+' ':'')+'Nivel '+(i+1);s.appendChild(o)}s.value=MD.t=='lv'?MD.i:0}
$('sel').onchange=e=>{loadLevel(+e.target.value);e.target.blur()};
function loadLevel(i){MD={t:'lv',i};start(gen(i,i));fillSel()}
function dailySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function loadDaily(){const sd=dailySeed();MD={t:'daily',seed:sd};start(gen(30+sd%60,sd));$('tip').textContent='Reto diario '+sd+'. '+$('tip').textContent}
function loadInf(keep){if(!keep||!inf)inf={n:0,lives:3,seed:Date.now()%100000};MD={t:'inf'};start(gen(Math.min(99,6+inf.n*3),inf.seed+inf.n))}
const restart=()=>MD.t=='lv'?loadLevel(MD.i):MD.t=='daily'?loadDaily():MD.t=='test'?edTest():MD.t=='com'?playCode(MD.code,MD.id):loadInf(true);
/* ---------- overlay ---------- */
function ov(t,b,btns){const o=$('ov');o.innerHTML='<h2></h2><div class="bd"></div><div class="bt"></div>';o.children[0].textContent=t;o.children[1].innerHTML=b;const bt=o.children[2];btns.forEach(x=>{const e=document.createElement('button');e.textContent=x.l;if(x.p)e.className='p';e.onclick=x.f;bt.appendChild(e)});o.style.display='flex';const f=bt.querySelector('.p')||bt.firstChild;if(f)f.focus()}

function settings(){const s=SV.set,c=k=>s[k]?'checked':'',sk=SK.map((k,i)=>'<option value="'+i+'"'+(totS()<k[3]?' disabled':'')+(SV.skin==i?' selected':'')+'>'+k[2]+(totS()<k[3]?' (🔒 '+k[3]+'★)':'')+'</option>').join('');
 ov('Ajustes','<label><input type=checkbox data-k=snd '+c('snd')+'> Sonido</label><label><input type=checkbox data-k=mus '+c('mus')+'> Música</label><label><input type=checkbox data-k=rm '+c('rm')+'> Reducir animaciones</label><label><input type=checkbox data-k=hc '+c('hc')+'> Alto contraste</label><label><input type=checkbox data-k=air '+c('air')+'> Modo aire (extra difícil: el cangrejo se ahoga bajo el agua; burbujas para recargar)</label><label>Cangrejo: <select data-k=skin>'+sk+'</select></label>',[{l:'Volver',p:1,f:menu}])}
$('ov').addEventListener('change',e=>{const k=e.target.dataset.k;if(!k)return;if(k=='skin')SV.skin=+e.target.value;else SV.set[k]=e.target.checked?1:0;save();if(k=='mus'||k=='snd')music()});
function stats(){const s=SV.st;ov('Logros y estadísticas','<p>Victorias: '+s.wins+' · Muertes: '+s.deaths+' · Perlas: '+s.pearls+'</p><p>Tiempo jugado: '+Math.round(s.time/60)+' min · Mejor modo infinito: '+s.best+'</p><p>Estrellas: '+totS()+' de 300</p>'+ACH.map(a=>'<p>'+(SV.ach[a[0]]?'🏆':'🔒')+' <b>'+a[1]+'</b> · '+a[2]+'</p>').join(''),[{l:'Volver',p:1,f:menu}])}
/* ---------- lógica ---------- */
const hAt=c=>c<0?99:S.H[Math.min(c,S.n-1)];
function die(m){gm='dead';S.msg=m;S.died=1;SV.st.deaths++;SV.st.streak=0;sfx('die');save();

 ov('Fin de la marea','<p>'+m+'</p>'+(MD.t=='inf'?'<p>Vidas: '+inf.lives+'</p>':''),[{l:'Reintentar',p:1,f:restart}].concat(MD.t=='test'?[{l:'Volver al editor',f:()=>editor()}]:MD.t=='com'?[{l:'Comunidad',f:comm}]:[]))}

 else if(MD.t=='daily'){const dt=dailySeed();SV.daily={date:dt,stars:st,time:S.tm,done:1};chk();const tx='Marea diario '+dt+' '+str+' '+S.tm.toFixed(1)+'s';ov('¡Reto diario superado!',info,[{l:'Copiar resultado',p:1,f:()=>{try{navigator.clipboard.writeText(tx);toast('Copiado')}catch(e){toast(tx)}}},{l:'Menú',f:menu}])}
 else if(MD.t=='test'){ed.ver=true;ov('¡Nivel verificado!','<p>Ya puedes compartirlo.</p>'+info,[{l:'Volver al editor',p:1,f:()=>editor()},{l:'Compartir',f:edShare}])}

 else{inf.n++;SV.st.best=Math.max(SV.st.best,inf.n);chk();ov('¡Nivel '+inf.n+' superado!',info+'<p>Vidas: '+inf.lives+'</p>',[{l:'Siguiente',p:1,f:()=>loadInf(true)}])}}
function upd(dt){

  else if(t=='f')ed.o.push({k:'f',a:[col+1,col+5,gh+.3,0]});else if(t=='j')ed.o.push({k:'f',a:[col+1,col+5,gh+1,1]});else if(t=='g')ed.o.push({k:'g',a:[col,col+4]});
  else if(t=='c')ed.o.push({k:'c',a:[col,col+5,ed.dir<0?-2.2:1]});else ed.o.push({k:'r',a:[col,col+5,gh+1.3]})}
 ed.ver=false;edraw()}
function edraw(){if(!ed||$('ed').style.display=='none')return;const c=ectx,cs=ecell,n=ed.n,ex=ed.ex,X=v=>(v-ex)*cs,Y=y=>EH-y*cs,th=TH[ed.th];
 const g=c.createLinearGradient(0,0,0,EH);g.addColorStop(0,th[0]);g.addColorStop(1,th[1]);c.fillStyle=g;c.fillRect(0,0,EW,EH);c.textAlign='center';c.textBaseline='middle';
 for(let k=Math.floor(ex);k<Math.min(n,ex+17);k++){const h=ed.H[k];c.fillStyle='#c99a63';c.fillRect(X(k),Y(h),cs+1,h*cs+1);c.fillStyle='#eecb95';c.fillRect(X(k),Y(h),cs+1,cs*.12);
  if(k<4||k>n-5){c.fillStyle='rgba(0,0,0,.12)';c.fillRect(X(k),0,cs,EH)}c.strokeStyle='rgba(0,0,0,.1)';c.strokeRect(X(k),0,cs,EH);if(k%5==0){c.fillStyle='rgba(0,0,0,.55)';c.font='11px sans-serif';c.fillText(k,X(k)+10,10)}}
 for(const O of ed.o){const a=O.a,k=O.k,col={u:'#2b2d42',f:a[3]?'#c77dff':'#f7b32b',g:'#fff',c:'#6ec6ff',r:'#4a4f6a',p:'#fff',b:'#bfe9ff'}[k],tx={u:'E',f:a[3]?'M':'P',g:'G',c:a[2]<0?'←':'→',r:'R',p:'●',b:'○'}[k];c.fillStyle=col;
  if(k=='f'||k=='g'||k=='c'||k=='r'){const x0=k=='f'?a[0]-1:a[0],w=k=='f'?6:k=='g'?4:5,gh=ed.H[Math.floor(x0)];c.globalAlpha=.8;c.fillRect(X(x0)+2,Y(gh+.75),w*cs-4,cs*.7);c.globalAlpha=1;c.fillStyle=(k=='g'||k=='c')?'#10283a':'#fff';c.font='bold '+cs*.4+'px sans-serif';for(let q=0;q<w;q++)c.fillText(tx,X(x0+q+.5),Y(gh+.4))}
  else{const px=X(a[0]),py=k=='u'?Y(ed.H[Math.floor(a[0])]+.4):Y(a[1]);c.beginPath();c.arc(px,py,cs*.22,0,7);c.fill();c.strokeStyle='#10283a';c.lineWidth=1;c.stroke();c.fillStyle=k=='u'?'#fff':'#10283a';c.font='bold '+cs*.3+'px sans-serif';c.fillText(tx,px,py)}}
 c.fillStyle='#e4572e';c.beginPath();c.arc(X(1.5),Y(ed.H[1]+.3),cs*.25,0,7);c.fill();
 const fx=X(n-.5),fy=Y(ed.H[n-1]);c.strokeStyle='#5a3d2b';c.lineWidth=3;c.beginPath();c.moveTo(fx,fy);c.lineTo(fx,fy-cs*1.3);c.stroke();c.fillStyle='#fff';c.beginPath();c.moveTo(fx,fy-cs*1.3);c.lineTo(fx+cs*.6,fy-cs*1.1);c.lineTo(fx,fy-cs*.9);c.fill()}
ecv.addEventListener('pointerdown',e=>{if(!ed)return;const r=ecv.getBoundingClientRect();edTool(Math.floor((e.clientX-r.left)/r.width*16+ed.ex))});
$('e1').onclick=()=>{ed.ex=Math.max(0,ed.ex-6);edraw()};$('e2').onclick=()=>{ed.ex=Math.max(0,Math.min(ed.n-16,ed.ex+6));edraw()};
function edN(d){const n=cl(ed.n+d,30,120);if(n==ed.n)return;if(d>0)for(let k=ed.n;k<n;k++)ed.H.push(1);else{ed.H.length=n;ed.o=ed.o.filter(O=>span(O)[1]<=n-4)}ed.n=n;ed.ex=Math.min(ed.ex,Math.max(0,n-16));ed.ver=false;edraw()}
$('e3').onclick=()=>edN(10);$('e4').onclick=()=>edN(-10);
$('e5').onclick=()=>{ed.dir*=-1;$('e5').textContent='Corriente '+(ed.dir<0?'←':'→')};
$('en').oninput=()=>{ed.name=$('en').value.slice(0,30)};$('eth').onchange=()=>{ed.th=+$('eth').value;edraw()};$('eti').onchange=()=>{ed.tide=+$('eti').value;ed.ver=false};
const edModel=()=>({name:(ed.name||'').trim()||'Sin nombre',th:ed.th,tide:ed.tide,H:ed.H,o:ed.o});
function edTest(){showEd(false);MD={t:'test'};start(toLevel(edModel()))}
function edSave(){const L=edModel(),code=enc(L);let m=SV.mine.find(x=>x.id==ed.id);if(m){m.name=L.name;m.code=code;m.ver=ed.ver}else{if(SV.mine.length>=30)return say('Máximo 30 niveles guardados.');ed.id=Date.now();SV.mine.push({id:ed.id,name:L.name,code,ver:ed.ver})}save();say('Guardado en «Mis niveles».');toast('Guardado')}
function shareOv(code,back){const link=location.href.split('#')[0]+'#n='+code;pre();
 ov('Compartir nivel','<p>Envía este enlace o el código por el medio que prefieras. Quien lo abra podrá jugarlo y guardarlo.</p><textarea id="sc" rows="4" readonly>'+esc(link)+'</textarea>'+(API?'<p>O publícalo en línea para que cualquiera lo vea en Comunidad:</p><input id="au" type="text" maxlength="20" placeholder="Tu nombre (opcional)" value="'+esc(SV.author||'')+'">':''),[{l:'Copiar enlace',p:1,f:()=>cp(link)},{l:'Copiar código',f:()=>cp(code)}].concat(API?[{l:'Publicar en línea',f:()=>pubOnline(code)}]:[],[{l:'Volver',f:back}]))}
function cp(t){try{navigator.clipboard.writeText(t).then(()=>toast('Copiado'),()=>toast('Selecciona y copia a mano'))}catch(e){toast('Selecciona y copia a mano')}}
function edShare(){if(!ed.ver){showEd(true);return say('Supera tu nivel con «Probar» para poder compartirlo.')}edSave();const m=SV.mine.find(x=>x.id==ed.id);if(m)m.shared=1;chk();shareOv(enc(edModel()),()=>editor())}
$('e6').onclick=edTest;$('e7').onclick=edSave;$('e8').onclick=edShare;$('e9').onclick=()=>{ed=null;editor()};$('e0').onclick=comm;
function rowH(it,src,btns){return'<div class="rw"><span>'+esc(it.name)+(it.ver?' ✓':'')+(SV.cs[it.id]?' '+'★'.repeat(SV.cs[it.id]):'')+'</span><span>'+btns.map(b=>'<button data-act="'+b[0]+'" data-src="'+src+'" data-id="'+esc(it.id)+'">'+b[1]+'</button>').join(' ')+'</span></div>'}
function comm(){pre();
 ov('Comunidad','<h3>Mis niveles</h3>'+(SV.mine.map(m=>rowH(m,'mine',[['play','Jugar'],['edit','Editar'],['share','Compartir'],['del','Borrar']])).join('')||'<p>Aún no has creado ninguno.</p>')+
 '<h3>Niveles guardados</h3>'+(SV.comm.map(m=>rowH(m,'comm',[['play','Jugar'],['del','Borrar']])).join('')||'<p>Importa un código o enlace para añadir niveles de otras personas.</p>')+
 (FEAT.length?'<h3>Destacados de esta web</h3>'+FEAT.map(m=>rowH(m,'feat',[['play','Jugar'],['savef','Guardar']])).join(''):'')+
 '<h3>🌐 En línea</h3><div id="onl"></div><h3>Importar</h3><textarea id="ic" rows="3" placeholder="Pega aquí un código o un enlace"></textarea>',[{l:'Importar',p:1,f:impCode},{l:'Crear nivel',f:()=>editor()},{l:'Volver',f:menu}]);loadOnline()}
function saveComm(code,name){if(SV.comm.some(x=>x.code==code))return false;if(SV.comm.length>=60)SV.comm.shift();SV.comm.push({id:hid(code),name,code});save();return true}
function impCode(){let c=$('ic').value.trim();const i=c.indexOf('#n=');if(i>=0)c=c.slice(i+3);const L=dec(c);if(!L)return toast('Código no válido');toast(saveComm(c,L.name)?'Nivel guardado':'Ya lo tenías');comm()}
$('ov').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,s=b.dataset.src,id=b.dataset.id,list=s=='mine'?SV.mine:s=='comm'?SV.comm:s=='onl'?ONL:FEAT,it=list.find(x=>String(x.id)==id);if(a=='sort'){onlSort=id;loadOnline();return}if(!it)return;
 if(a=='play'){if(s=='onl')api('/levels/'+it.id+'/play',{method:'POST'}).catch(()=>{});playCode(it.code,s=='mine'?it.id:hid(it.code))}
 else if(a=='like')api('/levels/'+it.id+'/like',{method:'POST'}).then(r=>{toast(r.already?'Ya te gustaba':'♥ Gracias');loadOnline()}).catch(e=>toast(e.message))
 else if(a=='report')api('/levels/'+it.id+'/report',{method:'POST'}).then(()=>toast('Reportado, gracias')).catch(e=>toast(e.message))
 else if(a=='edit')editor(dec(it.code),it.id,it.ver);
 else if(a=='share'){if(!it.ver)return toast('Supera el nivel para poder compartirlo');it.shared=1;chk();shareOv(it.code,comm)}
 else if(a=='del'){const i=list.indexOf(it);list.splice(i,1);save();comm()}
 else if(a=='savef'){toast(saveComm(it.code,it.name)?'Guardado':'Ya lo tenías');comm()}});
try{fetch('comunidad.json').then(r=>r.ok?r.json():[]).then(a=>{FEAT=(Array.isArray(a)?a:[]).filter(x=>x&&x.code&&dec(x.code)).slice(0,50).map(x=>({id:hid(x.code),name:String(x.author?x.name+' · '+x.author:x.name).slice(0,50),code:x.code}))}).catch(()=>{})}catch(e){}
fit();loadLevel(Math.min(99,done()));music();requestAnimationFrame(loop);
if(/^#n=/.test(location.hash)){const c=location.hash.slice(3),L=dec(c);if(L){pre();pg='play';ov('Nivel compartido','<p>'+esc(L.name)+'</p>',[{l:'Jugar',p:1,f:()=>playCode(c)},{l:'Guardar y jugar',f:()=>{saveComm(c,L.name);playCode(c)}},{l:'Cerrar',f:resume}])}}
</script></body></html>
