function updatePlayer(){
  let dx=0,dy=0, touchMag=1;
  if(touchMove.active){
    dx = touchMove.x; dy = touchMove.y;
    touchMag = clamp(Math.hypot(dx,dy)*settings.sensitivity, 0, 1);
  } else {
    if(keys['w']) dy-=1;
    if(keys['s']) dy+=1;
    if(keys['a']) dx-=1;
    if(keys['d']) dx+=1;
  }
  const moving = Math.hypot(dx,dy) > 0.12;
  const mlen = Math.hypot(dx,dy)||1;

  if(player.dashing>0){
    player.x += player.dashDir.x*10;
    player.y += player.dashDir.y*10;
    player.dashing--;
  } else {
    if(moving){
      const speedScale = touchMove.active ? touchMag : 1;
      player.x += (dx/mlen)*player.speed*speedScale;
      player.y += (dy/mlen)*player.speed*speedScale;
    }
    if((keys[' ']||touchDash) && player.dashCooldown<=0 && moving){
      player.dashing = 10;
      player.dashDir = {x:dx/mlen,y:dy/mlen};
      player.dashCooldown = player.dashCooldownMax;
      player.invuln = 16;
      playSfx('dash');
    }
  }
  player.x = clamp(player.x, ROOM.x+player.r, ROOM.x+ROOM.w-player.r);
  player.y = clamp(player.y, ROOM.y+player.r, ROOM.y+ROOM.h-player.r);

  // dispersión: aumenta al moverte, se calma al pararte
  const bloomTarget = moving ? player.bloomMax : 0.04;
  player.bloom += (bloomTarget - player.bloom) * 0.09;

  // apuntado: con ratón hacia el cursor; con controles táctiles, auto-apunta al objetivo más cercano
  if(touchFiring){
    const cands = boss ? [boss, ...enemies] : enemies;
    let target=null, best=1e9;
    for(const c of cands){ const dd=dist(player,c); if(dd<best){ best=dd; target=c; } }
    if(target){ player.facing = {x:target.x-player.x, y:target.y-player.y}; }
    else if(moving){ player.facing = {x:dx, y:dy}; }
  } else {
    const dxm = mouse.x - player.x, dym = mouse.y - player.y;
    if(Math.hypot(dxm,dym) > 4){
      player.facing = {x:dxm, y:dym};
    }
  }
  if(mouse.down || touchFiring){
    shootPlayer(player.facing.x, player.facing.y);
  }

  if(player.fireCooldown>0){
    // quieto disparas ~35% más rápido (recompensa plantarse en vez de kitear sin parar)
    player.fireCooldown -= moving ? 1 : 1.35;
  }
  if(player.dashCooldown>0) player.dashCooldown--;
  if(player.invuln>0) player.invuln--;
  dashinner.style.width = (100 - clamp(player.dashCooldown/player.dashCooldownMax,0,1)*100)+'%';
}

function updateBullets(){
  for(let i=bulletsPlayer.length-1;i>=0;i--){
    const b = bulletsPlayer[i];
    if(b.homing){
      let target=null, best=1e9;
      const cands = boss? [boss,...enemies] : enemies;
      for(const c of cands){ const d=dist(b,c); if(d<best){best=d;target=c;} }
      if(target){
        const desired = angleTo(b,target);
        const cur = Math.atan2(b.vy,b.vx);
        let diff = desired-cur;
        while(diff>Math.PI) diff-=Math.PI*2;
        while(diff<-Math.PI) diff+=Math.PI*2;
        const turn = clamp(diff, -b.homing, b.homing);
        const spd = Math.hypot(b.vx,b.vy);
        const na = cur+turn;
        b.vx = Math.cos(na)*spd; b.vy=Math.sin(na)*spd;
      }
    }
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if(b.maxRange!=null){
      b.traveled += Math.hypot(b.vx,b.vy);
      if(b.traveled>=b.maxRange){
        particles.push({x:b.x,y:b.y,vx:0,vy:0,life:10,color:'#5cf0c2',r:3});
        bulletsPlayer.splice(i,1);
        continue;
      }
    }
    let hit=false;
    if(boss && dist(b,boss) < b.r+boss.r){
      const bossColorRef = boss.color; // guardamos referencia: damageBoss puede matar al jefe y poner boss=null
      damageBoss(b.dmg);
      if(player.lifesteal>0 && Math.random()<player.lifesteal){ player.hp = Math.min(player.maxHp, player.hp+1); }
      spawnHitParticles(b.x,b.y, bossColorRef);
      if(player.explosive) explode(b.x,b.y,b.dmg);
      hit=true;
    }
    if(!hit){
      for(let j=enemies.length-1;j>=0;j--){
        const m = enemies[j];
        if(dist(b,m) < b.r+m.r){
          if(m.type==='orbiter' && !isThroughOrbiterGap(m,b.x,b.y)){
            // el halo protector bloquea el disparo: no hace daño, sólo un chispazo en el escudo
            spawnHitParticles(b.x,b.y,'#8affe0');
            hit=true;
            break;
          }
          if(m.type==='orbiter'){
            // entró justo por el hueco del halo: muerte instantánea
            m.hp = 0;
          } else {
            m.hp -= b.dmg;
          }
          spawnHitParticles(b.x,b.y,'#3fd0ff');
          if(player.lifesteal>0 && Math.random()<player.lifesteal){ player.hp = Math.min(player.maxHp, player.hp+1); }
          if(player.explosive) explode(b.x,b.y,b.dmg);
          hit=true;
          if(m.hp<=0){
            particlesBurst(m.x,m.y, enemyDeathColor(m.type));
            trySplitEnemy(m);
            enemies.splice(j,1);
            registerNormalKill();
            playSfx('hit');
            addCoins(m.x, m.y, coinRewardFor(m));
          }
          break;
        }
      }
    }
    if(hit){
      if(b.pierce>0){ b.pierce--; } else { bulletsPlayer.splice(i,1); continue; }
    }
    if(b.life<=0 || b.x<ROOM.x||b.x>ROOM.x+ROOM.w||b.y<ROOM.y||b.y>ROOM.y+ROOM.h){
      bulletsPlayer.splice(i,1);
    }
  }
  for(let i=bulletsEnemy.length-1;i>=0;i--){
    const b = bulletsEnemy[i];
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if(dist(b,player) < b.r+player.r-3 && player.invuln<=0){
      hitPlayer(threatDamage(1));
      bulletsEnemy.splice(i,1);
      continue;
    }
    if(b.life<=0 || b.x<ROOM.x-20||b.x>ROOM.x+ROOM.w+20||b.y<ROOM.y-20||b.y>ROOM.y+ROOM.h+20){
      bulletsEnemy.splice(i,1);
    }
  }
}

function enemyDeathColor(type){
  switch(type){
    case 'shooter': return '#3fd0ff';
    case 'summon': return '#8a3ffc';
    case 'brute': return '#ff5d1a';
    case 'splitter': return '#c9ff3d';
    case 'sniper': return '#ff6b9d';
    case 'orbiter': return '#8affe0';
    case 'bomber': return '#ff9d3f';
    case 'stalker': return '#c9a8ff';
    case 'turret': return '#ffb35c';
    default: return '#ff8a6b';
  }
}

function trySplitEnemy(m){
  if(m.type!=='splitter') return;
  for(let k=0;k<2;k++){
    const ang = rand(0,Math.PI*2);
    enemies.push({
      type:'shard', x:m.x+Math.cos(ang)*10, y:m.y+Math.sin(ang)*10,
      r:7, hp:1, maxHp:1, speed:m.speed*1.7,
      t:0, shootT:9999, fromBoss:false, wob:rand(0,Math.PI*2),
      chargeState:'idle', chargeT:0, chargeDir:{x:0,y:0},
    });
  }
}

function explode(x,y,dmg){
  particles.push({x,y,vx:0,vy:0,life:14,color:'#ffcf5c',r:26,ring:true});
  const amt = Math.max(1,Math.round(dmg*0.6));
  if(boss && dist({x,y},boss) < 30+boss.r) damageBoss(amt);
  for(let j=enemies.length-1;j>=0;j--){
    if(dist({x,y},enemies[j]) < 30+enemies[j].r){
      enemies[j].hp-=amt;
      if(enemies[j].hp<=0){ const m=enemies[j]; particlesBurst(m.x,m.y,'#ffcf5c'); trySplitEnemy(m); enemies.splice(j,1); registerNormalKill(); addCoins(m.x,m.y,coinRewardFor(m)); }
    }
  }
}

function spawnHitParticles(x,y,color){
  for(let i=0;i<5;i++) particles.push({x,y,vx:rand(-3,3),vy:rand(-3,3),life:16,color,r:rand(1,3)});
}
function particlesBurst(x,y,color){
  for(let i=0;i<14;i++) particles.push({x,y,vx:rand(-4,4),vy:rand(-4,4),life:26,color,r:rand(2,4)});
}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
}

function updateHearts(){
  heartsEl.innerHTML='';
  const totalHearts = Math.ceil(player.maxHp/2);
  for(let i=0;i<totalHearts;i++){
    const remain = player.hp - i*2;
    const state = remain>=2?'full':remain===1?'half':'empty';
    const d = document.createElement('div');
    d.className='heart';
    d.innerHTML = heartIconSVG(state);
    heartsEl.appendChild(d);
  }
  if(player.shieldMax>0){
    const s = document.createElement('div');
    s.style.marginLeft='8px';
    s.style.color='var(--shield)';
    s.style.fontSize='13px';
    s.textContent = '🛡'.repeat(player.shield) + '·'.repeat(Math.max(0,player.shieldMax-player.shield));
    heartsEl.appendChild(s);
  }
  if(player.hasRevive){
    const r = document.createElement('div');
    r.style.marginLeft='8px';
    r.style.fontSize='13px';
    r.textContent='💫';
    r.title='Segunda oportunidad disponible';
    heartsEl.appendChild(r);
  }
}

function updateRoomFlow(){
  if(currentRoom && currentRoom.type==='combat' && !currentRoom.cleared && enemies.length===0){
    currentRoom.cleared = true;
    spawnFloatText(W/2, ROOM.y+40, 'Sala despejada — busca la puerta', '#c9ff3d');
    revealDoors();
  }
  updateDoors();
}

// ---------- render ----------
// ---------- fondos de sala: cada reino tiene su propio ambiente, y las salas de jefe
// (de cualquier reino) usan una variante distinta a la de las salas normales ----------

// pseudoaleatorio determinista (mismo resultado siempre para el mismo i+depth): así la
// decoración de una sala no cambia ni parpadea de un fotograma a otro sin necesidad de
// guardar arrays de estado por sala
function seeded(i){
  const x = Math.sin(i*12.9898 + depth*78.233)*43758.5453;
  return x - Math.floor(x);
}

function drawCloud(cx, cy, scale, color, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  const puffs = [[0,0,46,20],[-30,6,30,16],[34,4,32,17],[-8,-12,26,15],[14,-10,24,14]];
  for(const [dx,dy,rx,ry] of puffs){
    ctx.beginPath();
    ctx.ellipse(cx+dx*scale, cy+dy*scale, rx*scale, ry*scale, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}
function drawDriftingClouds(n, color, alpha, driftSpeed, seedBase, yBand){
  for(let i=0;i<n;i++){
    const s = seeded(i+seedBase);
    const baseX = ROOM.x + s*(ROOM.w+160);
    const cx = ROOM.x + ((baseX-ROOM.x + frameT*driftSpeed) % (ROOM.w+160)) - 80;
    const cy = ROOM.y + yBand[0] + seeded(i+seedBase+30)*(yBand[1]-yBand[0]);
    drawCloud(cx, cy, 0.6+seeded(i+seedBase+60)*0.7, color, alpha);
  }
}
function drawGroundPatches(n, color, alpha, seedBase, minR, maxR){
  for(let i=0;i<n;i++){
    const x = ROOM.x + seeded(i+seedBase)*ROOM.w;
    const y = ROOM.y + seeded(i+seedBase+1)*ROOM.h;
    const r = minR + seeded(i+seedBase+2)*(maxR-minR);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, r, r*0.55, seeded(i+seedBase+3)*Math.PI, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawStarfield(n, seedBase){
  for(let i=0;i<n;i++){
    const x = ROOM.x + seeded(i+seedBase)*ROOM.w;
    const y = ROOM.y + seeded(i+seedBase+1)*ROOM.h;
    const tw = 0.4+0.6*Math.abs(Math.sin(frameT*0.03 + i));
    ctx.globalAlpha = tw;
    ctx.fillStyle = '#e8f0ff';
    ctx.beginPath();
    ctx.arc(x, y, 1+seeded(i+seedBase+2)*1.4, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ascuas flotantes de la Cripta: suben lentamente desde el suelo y se apagan al llegar arriba,
// es la seña ambiental propia de este reino (igual que el Cielo tiene sus relámpagos)
function drawEmbers(n, seedBase, color){
  for(let i=0;i<n;i++){
    const baseX = ROOM.x + seeded(i+seedBase)*ROOM.w;
    const speed = 0.3+seeded(i+seedBase+40)*0.35;
    const cycle = ROOM.h+60;
    const rise = (frameT*speed + seeded(i+seedBase+70)*1000) % cycle;
    const y = ROOM.y+ROOM.h - rise;
    const x = baseX + Math.sin(frameT*0.02+i)*10;
    const a = clamp(Math.min(rise/40, (cycle-rise)/60), 0, 0.8);
    ctx.globalAlpha = a;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, 1.6+seeded(i+seedBase+90)*1.4, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// hojas cayendo en la Superficie: caen despacio con un ligero balanceo, seña ambiental propia
// de este reino
function drawLeaves(n, seedBase){
  const colors = ['#8fd13f','#c9a83f','#6b8e3f'];
  for(let i=0;i<n;i++){
    const baseX = ROOM.x + seeded(i+seedBase)*ROOM.w;
    const speed = 0.4+seeded(i+seedBase+40)*0.3;
    const cycle = ROOM.h+80;
    const fall = (frameT*speed + seeded(i+seedBase+70)*1000) % cycle;
    const x = baseX + Math.sin(frameT*0.03+i)*16;
    const y = ROOM.y + fall - 40;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(frameT*0.03+i);
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = colors[i%colors.length];
    ctx.beginPath();
    ctx.ellipse(0,0,4,2.2,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// aviso de "sala de antes del jefe" para Núcleo, Superficie y Más Allá: una viñeta que
// palpita en los bordes de la sala con el color propio de cada reino (el Cielo usa
// relámpagos en su lugar, ver updateCieloAmbientFlash).
function drawPreBossPulse(color, maxAlpha){
  const pulse = (Math.sin(frameT*0.06)*0.5+0.5) * maxAlpha;
  ctx.save();
  ctx.globalAlpha = pulse;
  const g = ctx.createRadialGradient(W/2,H/2, Math.min(ROOM.w,ROOM.h)*0.16, W/2,H/2, Math.max(ROOM.w,ROOM.h)*0.64);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,color);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

// ---- Cripta ----
function drawRoomCripta(){
  const grad = ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,520);
  grad.addColorStop(0,'#132420');
  grad.addColorStop(1,'#050b0f');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  drawEmbers(10, 50, '#ff9d3f'); // seña ambiental propia de la Cripta
  if(isPreBossRoom()) drawPreBossPulse('#ff2d4d', 0.4); // aviso: el jefe está a una sala de distancia
  ctx.strokeStyle='#12403a';
  ctx.lineWidth=6;
  ctx.strokeRect(ROOM.x,ROOM.y,ROOM.w,ROOM.h);
}
function drawRoomCriptaBoss(){
  // sala de jefe: mismo estilo de piedra, pero con un tinte rojo/violeta más ominoso
  const grad = ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,520);
  grad.addColorStop(0,'#2a1220');
  grad.addColorStop(1,'#080308');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  drawEmbers(16, 150, '#ff5d5d'); // más ascuas, más rojizas, que en una sala normal

  ctx.lineWidth=6;
  ctx.strokeRect(ROOM.x,ROOM.y,ROOM.w,ROOM.h);
}

// ---- Superficie: césped y tierra ----
function drawRoomSuperficie(){
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#3f7a30');
  grad.addColorStop(0.6,'#2f5a22');
  grad.addColorStop(1,'#4a3418');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  drawGroundPatches(9, '#375c22', 0.4, 100, 22, 46); // hierba más oscura
  drawGroundPatches(6, '#5a4322', 0.35, 200, 16, 32); // tierra
  drawLeaves(7, 250); // seña ambiental propia de la Superficie
  if(isPreBossRoom()) drawPreBossPulse('#2a1e0a', 0.35); // aviso: el jefe está a una sala de distancia
  ctx.strokeStyle='#6b8e3f';
  ctx.lineWidth=6;
  ctx.strokeRect(ROOM.x,ROOM.y,ROOM.w,ROOM.h);
}
function drawRoomSuperficieBoss(){
  // arena de jefe: tierra removida y quemada, mucha menos hierba viva que en una sala normal
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#4a3a1c');
  grad.addColorStop(0.6,'#3a2a14');
  grad.addColorStop(1,'#1c1610');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  drawGroundPatches(10, '#2a2010', 0.5, 300, 24, 50); // tierra removida
  drawGroundPatches(4, '#4a5a26', 0.3, 400, 14, 24); // matojos de hierba que sobreviven
  drawLeaves(4, 450); // menos hojas vivas que en una sala normal, ambiente más árido
  ctx.strokeStyle='#7a5a2a';
  ctx.lineWidth=6;
  ctx.strokeRect(ROOM.x,ROOM.y,ROOM.w,ROOM.h);
}

// ---- Cielo: azul claro con nubes / tormenta gris en salas de jefe ----
function drawRoomCielo(){
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#bfe8ff');
  grad.addColorStop(0.6,'#8fd0f2');
  grad.addColorStop(1,'#eaf6ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  drawDriftingClouds(5, '#ffffff', 0.85, 0.12, 10, [30,190]);
  if(stormFlashT>0){
    // relámpago lejano de fondo: sólo un destello visual, anticipa la tormenta de la sala de jefe
    ctx.save();
    ctx.globalAlpha = (stormFlashT/4)*0.22;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  ctx.strokeStyle='#6fb8e6';
  ctx.lineWidth=6;
  ctx.strokeRect(ROOM.x,ROOM.y,ROOM.w,ROOM.h);
}
function drawRoomCieloBoss(){
  // tormenta: cielo gris con nubes grises cargadas, y un destello ambiental cuando cae un rayo
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#3a4048');
  grad.addColorStop(0.55,'#565f6b');
  grad.addColorStop(1,'#7a828c');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  drawDriftingClouds(6, '#454c56', 0.92, 0.18, 900, [20,170]);
  if(stormFlashT>0){
    ctx.save();
    ctx.globalAlpha = (stormFlashT/8)*0.32;
    ctx.fillStyle = '#eaf6ff';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  ctx.strokeStyle='#2a2e34';
  ctx.lineWidth=6;
  ctx.strokeRect(ROOM.x,ROOM.y,ROOM.w,ROOM.h);
}

// ---- Más Allá: vacío estrellado / nebulosa intensa en salas de jefe ----
function drawRoomInfinito(){
  const grad = ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,520);
  grad.addColorStop(0,'#1a1230');
  grad.addColorStop(1,'#050310');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  drawStarfield(40, 500);
  if(isPreBossRoom()) drawPreBossPulse('#b06bff', 0.4); // aviso: el jefe está a una sala de distancia
  ctx.strokeStyle='#5c3fa0';
  ctx.lineWidth=6;
  ctx.strokeRect(ROOM.x,ROOM.y,ROOM.w,ROOM.h);
}
function drawRoomInfinitoBoss(){
  const grad = ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,520);
  grad.addColorStop(0,'#2a1040');
  grad.addColorStop(1,'#0a0316');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  if(boss && boss.color){
    // cada uno de los 20 jefes del Más Allá tiñe la nebulosa con su propio color: es su seña
    // ambiental, cada jefe se siente distinto aunque la sala base sea la misma
    ctx.save();
    ctx.globalAlpha = 0.24;
    const tint = ctx.createRadialGradient(W/2,H/2,40,W/2,H/2,420);
    tint.addColorStop(0, boss.color);
    tint.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = tint;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  drawStarfield(55, 800);
  ctx.strokeStyle = (boss && boss.color) ? boss.color : '#b06bff';
  ctx.lineWidth=6;
  ctx.strokeRect(ROOM.x,ROOM.y,ROOM.w,ROOM.h);
}

function drawRoom(){
  const realm = realmOf(depth).id;
  const isBoss = !!boss;
  if(realm==='superficie') (isBoss?drawRoomSuperficieBoss:drawRoomSuperficie)();
  else if(realm==='cielo') (isBoss?drawRoomCieloBoss:drawRoomCielo)();
  else if(realm==='infinito') (isBoss?drawRoomInfinitoBoss:drawRoomInfinito)();
  else (isBoss?drawRoomCriptaBoss:drawRoomCripta)();
  ctx.strokeStyle='#5cf0c222';
  ctx.lineWidth=1;
  ctx.strokeRect(ROOM.x-4,ROOM.y-4,ROOM.w+8,ROOM.h+8);
}

function drawFirstRoomHints(){
  if(depth!==1 || !currentRoom || currentRoom.type!=='combat') return;
  ctx.save();
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  const cx = W/2, cy = ROOM.y+ROOM.h*0.46;

  ctx.fillText('CÓMO JUGAR', cx, cy-80);

  ctx.fillStyle='rgba(228,245,239,0.55)';
  const lines = isMobile ? [
    '🕹️  Joystick (izq.) — moverse',

function drawDoors(){
  if(!currentRoom || !currentRoom.cleared) return;
  for(const d of currentRoom.doors){
    ctx.save();
    ctx.translate(d.x, d.y);
    const explored = !!d.used;
    const pulse = explored ? 0.42 : (0.55 + Math.sin(Date.now()/280)*0.25);
    const col = d.isBack ? '255,207,92' : (explored ? '150,195,185' : '92,240,194'); // vuelta=dorada, ya explorada=atenuada
    ctx.globalAlpha = pulse;
    ctx.fillStyle = `rgba(${col},0.22)`;
    ctx.fillRect(-30,-16,60,30);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = `rgb(${col})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(-30,-16,60,30);
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const labelY = d.isBack ? 28 : -28;
    ctx.fillText(TYPE_ICON[d.nextType]||'?', 0, labelY);
    if(explored){
      ctx.font = '10px sans-serif';
      ctx.fillStyle = `rgba(${col},0.9)`;
      ctx.fillText('✓ ya visitada', 0, d.isBack ? labelY+14 : labelY-14);
    }
    ctx.restore();
  }
}

// dibuja el cuerpo del personaje según la skin elegida; se usa tanto en el juego como
// en las miniaturas de vista previa del menú de ajustes (por eso recibe su propio ctx/x/y).
function drawPlayerBody(pctx, x, y, r, facing, skin, tAnim){
  const fx = facing.x, fy = facing.y;
  const fl = Math.hypot(fx,fy)||1;
  const nfx = fx/fl, nfy = fy/fl;
  pctx.save();
  pctx.translate(x,y);

  if(skin.shape==='wispy'){
    // niebla violeta: un par de volutas semitransparentes detrás del cuerpo
    pctx.save();
    pctx.globalAlpha=0.35;
    pctx.fillStyle=skin.accent;
    const w1 = Math.sin(tAnim*0.06)*4, w2=Math.cos(tAnim*0.05)*4;
    pctx.beginPath(); pctx.arc(-r*0.5+w1,r*0.3,r*0.55,0,Math.PI*2);pctx.fill();
    pctx.beginPath();pctx.arc(r*0.55+w2,-r*0.2,r*0.4,0,Math.PI*2);pctx.fill();
    pctx.restore();
  }

  const grad = pctx.createRadialGradient(-r*0.25,-r*0.25,1,0,0,r*1.15);
  grad.addColorStop(0, skin.accent);
  grad.addColorStop(1, skin.body);
  pctx.fillStyle=grad;

  if(skin.shape==='plain'){
    // esmeralda: el explorador original — se mantiene exactamente como el diseño de siempre, sin adornos
    pctx.beginPath();pctx.arc(0,0,r,0,Math.PI*2);pctx.fill();
  } else if(skin.shape==='spiked'){
    // guerrero escarlata: berserker con un par de cuernos curvos hacia atrás y grietas
    // incandescentes bajo la piel, en vez de la antigua corona de pinchos alrededor del cuerpo
    pctx.beginPath();pctx.arc(0,0,r,0,Math.PI*2);pctx.fill();
    // grietas de brasa que recorren el cuerpo, del centro hacia el borde
    pctx.save();
    pctx.clip();
    pctx.strokeStyle='rgba(255,214,150,0.55)'; pctx.lineWidth=1.4;
    for(let k=0;k<3;k++){
      const sa=(k/3)*Math.PI*2+0.5;
      pctx.beginPath();
      pctx.moveTo(Math.cos(sa)*r*0.1,Math.sin(sa)*r*0.1);
      pctx.lineTo(Math.cos(sa+0.35)*r*0.55,Math.sin(sa+0.35)*r*0.55);
      pctx.lineTo(Math.cos(sa)*r*0.98,Math.sin(sa)*r*0.98);
      pctx.stroke();
    }
    pctx.restore();
    // un par de cuernos curvos que asoman hacia atrás desde la coronilla
    for(const side of [-1,1]){
      pctx.save();
      pctx.fillStyle='#2a0a0a';
      pctx.beginPath();
      pctx.moveTo(side*r*0.34,-r*0.76);
      pctx.quadraticCurveTo(side*r*0.98,-r*1.02, side*r*0.6,-r*1.52);
      pctx.quadraticCurveTo(side*r*0.46,-r*1.0, side*r*0.1,-r*0.88);
      pctx.closePath();
      pctx.fill();
      pctx.strokeStyle='rgba(0,0,0,0.4)'; pctx.lineWidth=1; pctx.stroke();
      pctx.restore();
    }
  } else if(skin.shape==='plated'){
    // campeón dorado: cuerpo liso coronado por una aureola de rayos triangulares (un sol),
    // en vez de la antigua armadura de placas concéntricas
    const rays=10;
    pctx.save();
    pctx.fillStyle=skin.accent;
    pctx.globalAlpha=0.92;
    for(let k=0;k<rays;k++){
      const sa=(k/rays)*Math.PI*2;
      const len = k%2===0 ? r*1.55 : r*1.22;
      const half=0.11;
      pctx.beginPath();
      pctx.moveTo(Math.cos(sa-half)*r*0.92, Math.sin(sa-half)*r*0.92);
      pctx.lineTo(Math.cos(sa)*len, Math.sin(sa)*len);
      pctx.lineTo(Math.cos(sa+half)*r*0.92, Math.sin(sa+half)*r*0.92);
      pctx.closePath();
      pctx.fill();
    }
    pctx.restore();
    pctx.beginPath();pctx.arc(0,0,r,0,Math.PI*2);pctx.fill();
    // brillo metálico pulido en la parte superior
    pctx.save();
    pctx.globalAlpha=0.5;
    pctx.fillStyle='#ffffff';
    pctx.beginPath();
    pctx.ellipse(-r*0.16,-r*0.34,r*0.5,r*0.26,-0.45,0,Math.PI*2);
    pctx.fill();
    pctx.restore();
    // gema central que sirve de emblema
    pctx.fillStyle=skin.dark;
    pctx.globalAlpha=0.9;
    pctx.beginPath();
    pctx.moveTo(0,-r*0.24);pctx.lineTo(r*0.19,0);pctx.lineTo(0,r*0.24);pctx.lineTo(-r*0.19,0);
    pctx.closePath(); pctx.fill();
    pctx.strokeStyle='rgba(255,255,255,0.5)'; pctx.lineWidth=1; pctx.stroke();
    pctx.globalAlpha=1;
  } else if(skin.shape==='crystal'){
    // hielo: cuerpo circular facetado con vetas internas y un cristal que sobresale hacia donde mira
    pctx.beginPath();pctx.arc(0,0,r,0,Math.PI*2);pctx.fill();
    pctx.save();
    pctx.strokeStyle='rgba(255,255,255,0.3)'; pctx.lineWidth=1;
    for(let k=0;k<5;k++){
      const sa=(k/5)*Math.PI*2+0.3;
      pctx.beginPath();pctx.moveTo(0,0);pctx.lineTo(Math.cos(sa)*r*0.9,Math.sin(sa)*r*0.9);pctx.stroke();
    }
    pctx.restore();
    pctx.save();
    pctx.rotate(Math.atan2(nfy,nfx));
    pctx.fillStyle=skin.accent;
    pctx.globalAlpha=0.9;
    pctx.beginPath();
    pctx.moveTo(r*1.2,0); pctx.lineTo(r*0.35,-r*0.42); pctx.lineTo(r*0.5,0); pctx.lineTo(r*0.35,r*0.42);
    pctx.closePath(); pctx.fill();
    pctx.strokeStyle='rgba(255,255,255,0.6)'; pctx.lineWidth=1; pctx.stroke();
    pctx.restore();
  } else if(skin.shape==='wispy'){
    // sombra: silueta fantasmal alargada, distinta del círculo liso — más estilizada y translúcida,
    // con un núcleo violeta que se intuye brillando por dentro
    pctx.save();
    pctx.globalAlpha=0.92;
    pctx.beginPath();
    pctx.moveTo(0,-r*1.08);
    pctx.quadraticCurveTo(r*0.98,-r*0.22, r*0.6, r*0.9);
    pctx.quadraticCurveTo(0, r*1.18, -r*0.6, r*0.9);
    pctx.quadraticCurveTo(-r*0.98,-r*0.22, 0,-r*1.08);
    pctx.closePath();
    pctx.fill();
    pctx.globalAlpha=1;
    pctx.strokeStyle='rgba(201,168,255,0.5)'; pctx.lineWidth=1.3;
    pctx.stroke();
    pctx.restore();
    // resplandor interior difuso que sugiere el núcleo brillando bajo la niebla
    pctx.save();
    pctx.globalAlpha=0.3+Math.sin(tAnim*0.05)*0.08;
    pctx.fillStyle='#ffffff';
    pctx.beginPath();pctx.ellipse(0,-r*0.1,r*0.3,r*0.42,0,0,Math.PI*2);pctx.fill();
    pctx.restore();
  } else if(skin.shape==='scaled'){
    // escamas: cuerpo cubierto de escamas superpuestas en anillos concéntricos, como armadura orgánica
    pctx.beginPath();pctx.arc(0,0,r,0,Math.PI*2);pctx.fill();
    pctx.save();
    pctx.clip();
    pctx.fillStyle=skin.dark;
    pctx.globalAlpha=0.28;
    for(let ring=1;ring<=3;ring++){
      const rr = r*ring/3.6+r*0.15;
      const count = 5+ring*2;
      for(let k=0;k<count;k++){
        const sa=(k/count)*Math.PI*2 + (ring%2===0? 0.3:0);
        pctx.beginPath();
        pctx.ellipse(Math.cos(sa)*rr, Math.sin(sa)*rr, r*0.2, r*0.13, sa, 0, Math.PI*2);
        pctx.fill();
      }
    }
    pctx.restore();
  } else if(skin.shape==='halo'){
    // halo: un anillo orbital inclinado alrededor del cuerpo, como un pequeño planeta con anillos
    pctx.save();
    pctx.rotate(0.5);
    pctx.strokeStyle=skin.accent;
    pctx.globalAlpha=0.85;
    pctx.lineWidth=r*0.14;
    pctx.beginPath();
    pctx.ellipse(0,0,r*1.5,r*0.5,0,0,Math.PI*2);
    pctx.stroke();
    pctx.restore();
    pctx.beginPath();pctx.arc(0,0,r,0,Math.PI*2);pctx.fill();
    pctx.save();
    pctx.rotate(0.5);
    pctx.strokeStyle=skin.accent;
    pctx.globalAlpha=1;
    pctx.lineWidth=r*0.14;
    pctx.beginPath();
    pctx.ellipse(0,0,r*1.5,r*0.5,0,Math.PI,Math.PI*2);
    pctx.stroke();
    pctx.restore();
  } else if(skin.shape==='orbit'){
    // satélites: el cuerpo liso de siempre, con tres motas de energía orbitando alrededor sin parar
    pctx.beginPath();pctx.arc(0,0,r,0,Math.PI*2);pctx.fill();
    pctx.save();
    pctx.fillStyle=skin.accent;
    for(let k=0;k<3;k++){
      const sa=(k/3)*Math.PI*2 + tAnim*0.045;
      const ox=Math.cos(sa)*r*1.55, oy=Math.sin(sa)*r*1.55*0.5;
      pctx.globalAlpha=0.55+0.45*Math.max(0,Math.sin(sa));
      pctx.beginPath();pctx.arc(ox,oy,r*0.2,0,Math.PI*2);pctx.fill();
    }
    pctx.restore();
  } else if(skin.shape==='corona'){
    // corona: skin exclusiva de logro — el cuerpo liso con una pequeña corona espectral flotando
    // encima, brillando despacio
    pctx.beginPath();pctx.arc(0,0,r,0,Math.PI*2);pctx.fill();
    pctx.save();
    pctx.translate(0,-r*1.3);
    pctx.globalAlpha=0.85+0.15*Math.sin(tAnim*0.07);
    pctx.fillStyle=skin.accent;
    pctx.beginPath();
    pctx.moveTo(-r*0.5,r*0.22);
    pctx.lineTo(-r*0.5,-r*0.05);
    pctx.lineTo(-r*0.25,r*0.12);
    pctx.lineTo(0,-r*0.22);
    pctx.lineTo(r*0.25,r*0.12);
    pctx.lineTo(r*0.5,-r*0.05);
    pctx.lineTo(r*0.5,r*0.22);
    pctx.closePath();
    pctx.fill();
    pctx.restore();
  } else {
    // otras skins futuras que no definan una forma concreta: círculo simple de respaldo
    pctx.beginPath();pctx.arc(0,0,r,0,Math.PI*2);pctx.fill();
  }

  // acabado extra (contorno sutil + brillo especular superior) sólo para las skins con relieve
  // circular (escarlata, dorado, hielo, escamas, satélites, corona); la esmeralda original, la
  // sombra y el halo ya tienen su propio look
  if(skin.shape==='spiked' || skin.shape==='plated' || skin.shape==='crystal' || skin.shape==='scaled' || skin.shape==='orbit' || skin.shape==='corona'){
    pctx.strokeStyle='rgba(0,0,0,0.28)'; pctx.lineWidth=1.3;
    pctx.beginPath();pctx.arc(0,0,r*0.99,0,Math.PI*2);pctx.stroke();
    pctx.save();
    pctx.globalAlpha=0.22;
    pctx.fillStyle='#ffffff';
    pctx.beginPath();
    pctx.ellipse(-r*0.32,-r*0.36,r*0.3,r*0.17,-0.5,0,Math.PI*2);
    pctx.fill();
    pctx.restore();
  }

  // núcleo/visor que marca la dirección hacia la que mira el personaje
  pctx.fillStyle=skin.dark;
  pctx.beginPath();
  pctx.arc(nfx*r*0.42, nfy*r*0.42, r*0.28, 0, Math.PI*2);
  pctx.fill();
  if(skin.shape!=='plain'){
    pctx.strokeStyle='rgba(255,255,255,0.25)'; pctx.lineWidth=1;
    pctx.beginPath();
    pctx.arc(nfx*r*0.42, nfy*r*0.42, r*0.28, 0, Math.PI*2);
    pctx.stroke();
  }
  pctx.restore();
}

function drawPlayer(){
  ctx.save();
  if(player.invuln>0 && Math.floor(player.invuln/4)%2===0) ctx.globalAlpha=0.4;
  if(player.shield>0){
    ctx.translate(player.x,player.y);
    ctx.beginPath();
    ctx.arc(0,0,player.r+7,0,Math.PI*2);
    ctx.strokeStyle='rgba(77,211,255,0.7)';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.translate(-player.x,-player.y);
  }
  ctx.restore();
  ctx.save();
  if(player.invuln>0 && Math.floor(player.invuln/4)%2===0) ctx.globalAlpha=0.4;
  drawPlayerBody(ctx, player.x, player.y, player.r, player.facing, currentSkin(), frameT);
  ctx.restore();

  // cono de puntería / dispersión
  ctx.save();
  ctx.translate(player.x,player.y);
  const baseAng = Math.atan2(player.facing.y, player.facing.x);
  ctx.strokeStyle='rgba(92,240,194,0.25)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(Math.cos(baseAng-player.bloom)*40, Math.sin(baseAng-player.bloom)*40);
  ctx.moveTo(0,0);
  ctx.lineTo(Math.cos(baseAng+player.bloom)*40, Math.sin(baseAng+player.bloom)*40);
  ctx.stroke();
  ctx.restore();
}

function drawBoss(){
  if(!boss) return;
  ctx.save();
  ctx.translate(boss.x,boss.y);
  if(boss.isGuardian){
    // aro doble giratorio: distingue a simple vista a un guardián de reino de un jefe normal
    ctx.save();
    ctx.strokeStyle=boss.color; ctx.globalAlpha=0.55; ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,boss.r+10,boss.t*0.02,boss.t*0.02+Math.PI*1.4);ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,boss.r+16,-boss.t*0.015,-boss.t*0.015+Math.PI*1.1);ctx.stroke();
    ctx.restore();
  }
  let fillColor = boss.color;
  if(boss.blinking && Math.floor(boss.t/3)%2===0){
    fillColor = '#a8ff5c'; // mismo verde de los bichos: avisa sin usar texto
  }
  ctx.fillStyle=fillColor;
  ctx.beginPath();
  ctx.arc(0,0,boss.r,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.4)';
  ctx.lineWidth=3;
  ctx.stroke();
  ctx.fillStyle='#fff';
  const a = angleTo(boss,player);
  ctx.beginPath();ctx.arc(Math.cos(a)*10,Math.sin(a)*10,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(Math.cos(a)*13,Math.sin(a)*13,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawEnemies(){
  for(const e of enemies){
    const a = angleTo(e,player);
    // aviso de puntería del francotirador: se dibuja antes, por debajo de todo lo demás
    if(e.type==='sniper' && e.aiming){
      const pulse = 0.35+Math.sin(e.t*0.8)*0.25;
      ctx.save();
      ctx.strokeStyle=`rgba(255,90,90,${pulse})`;
      ctx.lineWidth=2;
      ctx.setLineDash([6,6]);
      ctx.beginPath();
      ctx.moveTo(e.x,e.y);
      ctx.lineTo(e.x+Math.cos(a)*400,e.y+Math.sin(a)*400);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
    ctx.save();
    ctx.translate(e.x,e.y);
    if(e.type==='walker'){
      // criatura ósea irregular con caparazón moteado y pinchos, siempre mirando hacia el jugador
      ctx.rotate(a);
      const grad = ctx.createRadialGradient(-e.r*0.2,-e.r*0.2,1,0,0,e.r*1.1);
      grad.addColorStop(0,'#ffb69f'); grad.addColorStop(1,'#c9432f');
      ctx.fillStyle=grad;
      const spikes=7;
      ctx.beginPath();
      for(let k=0;k<spikes;k++){
        const sa=(k/spikes)*Math.PI*2;
        const rr = e.r*(k%2===0?1.05:0.68);
        const px=Math.cos(sa)*rr, py=Math.sin(sa)*rr;
        if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(60,10,5,0.5)'; ctx.lineWidth=1.2; ctx.stroke();
      ctx.fillStyle='#2a0a05';
      ctx.beginPath();ctx.arc(e.r*0.4,-e.r*0.15,2.6,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(e.r*0.4,e.r*0.15,2.6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffe3d6';
      ctx.beginPath();ctx.arc(e.r*0.42,-e.r*0.15,0.9,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(e.r*0.42,e.r*0.15,0.9,0,Math.PI*2);ctx.fill();
    } else if(e.type==='shooter'){
      // vigía a distancia: cristal romboidal facetado con núcleo que sigue al jugador
      ctx.rotate(a*0.35);
      const grad = ctx.createLinearGradient(0,-e.r,0,e.r);
      grad.addColorStop(0,'#8be9ff'); grad.addColorStop(1,'#1c7a99');
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.moveTo(0,-e.r); ctx.lineTo(e.r*0.75,0); ctx.lineTo(0,e.r); ctx.lineTo(-e.r*0.75,0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(10,40,50,0.6)'; ctx.lineWidth=1.2; ctx.stroke();
      ctx.rotate(-a*0.35); ctx.rotate(a);
      ctx.fillStyle='#0a2630';
      ctx.beginPath();ctx.arc(e.r*0.32,0,3.4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#dffcff';
      ctx.beginPath();ctx.arc(e.r*0.4,0,1.2,0,Math.PI*2);ctx.fill();
    } else if(e.type==='brute'){
      // bestia embistente: aro de aviso antes de la carga, placas óseas y silueta más agresiva al embestir
      if(e.chargeState==='telegraph'){
        const wind = 0.5+Math.sin(e.t*0.9)*0.4;
        ctx.save(); ctx.globalAlpha=wind*0.5;
        ctx.fillStyle='#ffcf5c'; ctx.beginPath();ctx.arc(0,0,e.r*1.7,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }
      const facing = e.chargeState==='charging' ? Math.atan2(e.chargeDir.y,e.chargeDir.x) : a;
      ctx.rotate(facing);
      const grad = ctx.createRadialGradient(-e.r*0.2,-e.r*0.2,1,0,0,e.r*1.2);
      if(e.chargeState==='charging'){ grad.addColorStop(0,'#ffe3a0'); grad.addColorStop(1,'#ff8a1a'); }
      else { grad.addColorStop(0,'#e8735a'); grad.addColorStop(1,'#8a2418'); }
      ctx.fillStyle=grad;
      const spikes=6;
      ctx.beginPath();
      for(let k=0;k<spikes;k++){
        const sa=(k/spikes)*Math.PI*2;
        const rr = e.r*(k%2===0?1.15:0.72);
        const px=Math.cos(sa)*rr, py=Math.sin(sa)*rr;
        if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(30,5,0,0.6)'; ctx.lineWidth=1.5; ctx.stroke();
      // par de cuernos frontales
      ctx.fillStyle='#3a1208';
      ctx.beginPath();ctx.moveTo(e.r*0.55,-e.r*0.5);ctx.lineTo(e.r*1.25,-e.r*0.62);ctx.lineTo(e.r*0.7,-e.r*0.15);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(e.r*0.55,e.r*0.5);ctx.lineTo(e.r*1.25,e.r*0.62);ctx.lineTo(e.r*0.7,e.r*0.15);ctx.closePath();ctx.fill();
      ctx.fillStyle='#2a0f0a';
      ctx.beginPath();ctx.arc(e.r*0.4,0,2.4,0,Math.PI*2);ctx.fill();
    } else if(e.type==='splitter'){
      // masa bilobulada verde translúcida: se nota a simple vista que se puede dividir
      ctx.fillStyle='rgba(160,230,40,0.35)';
      ctx.beginPath();ctx.arc(0,0,e.r*1.15,0,Math.PI*2);ctx.fill();
      const grad = ctx.createRadialGradient(-e.r*0.2,-e.r*0.2,1,-e.r*0.34,0,e.r);
      grad.addColorStop(0,'#e6ff9d'); grad.addColorStop(1,'#93c92a');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.ellipse(-e.r*0.34,0,e.r*0.62,e.r*0.72,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(e.r*0.34,0,e.r*0.62,e.r*0.72,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(30,50,10,0.6)'; ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(0,-e.r*0.62);ctx.lineTo(0,e.r*0.62);ctx.stroke();
    } else if(e.type==='shard'){
      // fragmento diminuto que salió de un splitter
      ctx.rotate(a);
      ctx.fillStyle='#d4ff8a';
      ctx.beginPath();
      ctx.moveTo(e.r,0); ctx.lineTo(-e.r*0.6,e.r*0.6); ctx.lineTo(-e.r*0.6,-e.r*0.6);
      ctx.closePath(); ctx.fill();
    } else if(e.type==='bug'){
      ctx.rotate(a);
      ctx.fillStyle='#a8ff5c';
      ctx.beginPath();
      ctx.moveTo(e.r,0); ctx.lineTo(-e.r*0.7,e.r*0.7); ctx.lineTo(-e.r*0.3,0); ctx.lineTo(-e.r*0.7,-e.r*0.7);
      ctx.closePath(); ctx.fill();
    } else if(e.type==='summon'){
      // esbirro fantasmal invocado por un jefe
      ctx.fillStyle='rgba(138,63,252,0.88)';
      ctx.beginPath();
      ctx.arc(0,-e.r*0.15,e.r*0.85,Math.PI,0);
      const wy=e.r*0.6;
      ctx.lineTo(e.r*0.85,wy);
      ctx.quadraticCurveTo(e.r*0.4,wy-6,0,wy);
      ctx.quadraticCurveTo(-e.r*0.4,wy-6,-e.r*0.85,wy);
      ctx.closePath(); ctx.fill();
    } else if(e.type==='sniper'){
      // francotirador: torreta hexagonal blindada con un cañón que apunta al jugador
      const grad = ctx.createRadialGradient(-e.r*0.2,-e.r*0.2,1,0,0,e.r*1.1);
      grad.addColorStop(0,'#ffb3c9'); grad.addColorStop(1,'#8a1f3f');
      ctx.fillStyle=grad;
      ctx.beginPath();
      for(let k=0;k<6;k++){
        const sa=(k/6)*Math.PI*2 + Math.PI/6;
        const px=Math.cos(sa)*e.r, py=Math.sin(sa)*e.r;
        if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(40,5,15,0.6)'; ctx.lineWidth=1.4; ctx.stroke();
      ctx.rotate(a);
      ctx.fillStyle='#3a0a18';
      ctx.fillRect(0,-2.6,e.r*1.3,5.2);
      ctx.fillStyle= e.aiming ? '#ff5d5d' : '#ffd6e0';
      ctx.beginPath();ctx.arc(0,0,3.6,0,Math.PI*2);ctx.fill();
    } else if(e.type==='orbiter'){
      // guardián flotante: halo giratorio con núcleo brillante, orbita al jugador
      ctx.rotate(e.t*0.05);
      ctx.strokeStyle='rgba(138,255,224,0.65)';
      ctx.lineWidth=2.4;
      ctx.beginPath();ctx.arc(0,0,e.r*1.35,0,Math.PI*1.5);ctx.stroke();
      ctx.rotate(-e.t*0.05);
      const grad = ctx.createRadialGradient(0,0,1,0,0,e.r);
      grad.addColorStop(0,'#eafff8'); grad.addColorStop(1,'#2fae8f');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(0,0,e.r*0.8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#0a2620';
      ctx.beginPath();ctx.arc(Math.cos(a)*3.4,Math.sin(a)*3.4,2.6,0,Math.PI*2);ctx.fill();
    } else if(e.type==='bomber'){
      // masa inestable: cuerpo esférico que pulsa cada vez más rápido según se acerca la detonación
      const arming = e.fuseT<999;
      const pulse = arming ? (0.5+Math.sin(e.t*(1.2+ (26-e.fuseT)*0.25))*0.5) : (0.5+Math.sin(e.t*0.15)*0.5);
      const grad = ctx.createRadialGradient(-e.r*0.2,-e.r*0.2,1,0,0,e.r*1.1);
      grad.addColorStop(0, arming? '#ffe3a0':'#ffcf9d');
      grad.addColorStop(1, arming? '#ff5d1a':'#a8431a');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=`rgba(255,${arming?80:190},60,${0.4+pulse*0.5})`;
      ctx.lineWidth=2+pulse*2;
      ctx.beginPath();ctx.arc(0,0,e.r+2+pulse*3,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#3a1505';
      ctx.beginPath();ctx.arc(0,0,e.r*0.32,0,Math.PI*2);ctx.fill();
    } else if(e.type==='stalker'){
      // asesino cuerpo a cuerpo envuelto en niebla violeta, con una hoja curva que apunta al jugador
      ctx.rotate(a);
      ctx.save();
      ctx.globalAlpha=0.32;
      ctx.fillStyle='#c9a8ff';
      ctx.beginPath();ctx.ellipse(-e.r*0.35,0,e.r*0.95,e.r*0.55,0,0,Math.PI*2);ctx.fill();
      ctx.restore();
      const grad = ctx.createRadialGradient(-e.r*0.2,-e.r*0.2,1,0,0,e.r*1.1);
      grad.addColorStop(0,'#e9d9ff'); grad.addColorStop(1,'#5a1fae');
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.moveTo(e.r*1.15,0); ctx.lineTo(-e.r*0.5,e.r*0.55); ctx.lineTo(-e.r*0.15,0); ctx.lineTo(-e.r*0.5,-e.r*0.55);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(20,5,40,0.6)'; ctx.lineWidth=1.2; ctx.stroke();
      ctx.fillStyle='#ffe8ff';
      ctx.beginPath();ctx.arc(e.r*0.35,0,1.8,0,Math.PI*2);ctx.fill();
    } else if(e.type==='turret'){
      // torreta anclada: base cuadrada blindada con un cañón que gira para apuntar al jugador
      const grad = ctx.createRadialGradient(-e.r*0.2,-e.r*0.2,1,0,0,e.r*1.15);
      grad.addColorStop(0,'#ffdcac'); grad.addColorStop(1,'#a8601f');
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.rect(-e.r,-e.r,e.r*2,e.r*2);
      ctx.fill();
      ctx.strokeStyle='rgba(50,20,0,0.6)'; ctx.lineWidth=1.4; ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1.2;
      ctx.strokeRect(-e.r*0.62,-e.r*0.62,e.r*1.24,e.r*1.24);
      ctx.rotate(a);
      ctx.fillStyle='#3a2005';
      ctx.fillRect(0,-2.8,e.r*1.3,5.6);
      ctx.fillStyle='#ffcf8a';
      ctx.beginPath();ctx.arc(0,0,3.6,0,Math.PI*2);ctx.fill();
    } else if(e.type==='bramble'){
      // Superficie: bola de raíces nudosas con espinas que se abren cuando está a punto de disparar
      const rooted = e.chargeState==='telegraph';
      const grad = ctx.createRadialGradient(-e.r*0.2,-e.r*0.2,1,0,0,e.r*1.1);
      grad.addColorStop(0,'#8fae4a'); grad.addColorStop(1,'#3a2c14');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();
      const nThorns=6;
      for(let k=0;k<nThorns;k++){
        const ta=(k/nThorns)*Math.PI*2;
        const len = e.r*(rooted?1.05:0.5);
        ctx.save();ctx.rotate(ta);
        ctx.fillStyle='#5c4420';
        ctx.beginPath();ctx.moveTo(e.r*0.55,-2.5);ctx.lineTo(e.r*0.55+len,0);ctx.lineTo(e.r*0.55,2.5);ctx.closePath();ctx.fill();
        ctx.restore();
      }
    } else if(e.type==='gust'){
      // Cielo: jirón de nube alargado en la dirección de vuelo, con un núcleo de viento brillante
      ctx.rotate(a);
      ctx.save();
      ctx.globalAlpha=0.5;
      ctx.fillStyle='#eaf6ff';
      ctx.beginPath();
      ctx.ellipse(-e.r*0.5,0,e.r*1.1,e.r*0.5,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
      const grad = ctx.createRadialGradient(-e.r*0.15,-e.r*0.15,1,0,0,e.r);
      grad.addColorStop(0,'#ffffff'); grad.addColorStop(1,'#5cc8ff');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(0,0,e.r*0.72,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1.2;
      for(let k=-1;k<=1;k+=2){
        ctx.beginPath();ctx.moveTo(-e.r*0.4,k*e.r*0.3);ctx.quadraticCurveTo(-e.r*1.1,k*e.r*0.55,-e.r*1.6,k*e.r*0.2);ctx.stroke();
      }
    } else if(e.type==='boar'){
      // Superficie: jabalí acorazado, más ancho y con colmillos curvos hacia afuera al embestir
      if(e.chargeState==='telegraph'){
        const wind = 0.5+Math.sin(e.t*0.9)*0.4;
        ctx.save(); ctx.globalAlpha=wind*0.5;
        ctx.fillStyle='#c7ff8a'; ctx.beginPath();ctx.arc(0,0,e.r*1.7,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }
      const facing = e.chargeState==='charging' ? Math.atan2(e.chargeDir.y,e.chargeDir.x) : a;
      ctx.rotate(facing);
      const grad = ctx.createRadialGradient(-e.r*0.2,-e.r*0.2,1,0,0,e.r*1.2);
      if(e.chargeState==='charging'){ grad.addColorStop(0,'#e8ffc0'); grad.addColorStop(1,'#4a7a1a'); }
      else { grad.addColorStop(0,'#8fae5a'); grad.addColorStop(1,'#33440f'); }
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.ellipse(0,0,e.r*1.15,e.r*0.85,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(20,20,0,0.5)'; ctx.lineWidth=1.4; ctx.stroke();
      ctx.fillStyle='#fff6d8';
      ctx.beginPath();ctx.moveTo(e.r*0.7,-e.r*0.35);ctx.lineTo(e.r*1.4,-e.r*0.15);ctx.lineTo(e.r*0.75,0);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(e.r*0.7,e.r*0.35);ctx.lineTo(e.r*1.4,e.r*0.15);ctx.lineTo(e.r*0.75,0);ctx.closePath();ctx.fill();
    } else if(e.type==='thorn'){
      // Superficie: cristal alargado tipo espino, verde, apunta al jugador
      ctx.rotate(a*0.35);
      const grad = ctx.createLinearGradient(0,-e.r,0,e.r);
      grad.addColorStop(0,'#c7ff8a'); grad.addColorStop(1,'#3c6b1c');
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.moveTo(0,-e.r*1.15); ctx.lineTo(e.r*0.6,0); ctx.lineTo(0,e.r*1.15); ctx.lineTo(-e.r*0.6,0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(15,30,5,0.6)'; ctx.lineWidth=1.2; ctx.stroke();
      ctx.rotate(-a*0.35); ctx.rotate(a);
      ctx.fillStyle='#1c3005';
      ctx.beginPath();ctx.arc(e.r*0.3,0,3,0,Math.PI*2);ctx.fill();
    } else if(e.type==='spiderling'){
      // Superficie: araña saltarina pequeña, patas finas, muy ágil
      ctx.rotate(a);
      ctx.strokeStyle='#20320a'; ctx.lineWidth=1.6;
      for(let k=-1;k<=1;k+=2){
        ctx.beginPath();ctx.moveTo(-e.r*0.2,k*e.r*0.3);ctx.lineTo(-e.r*1.2,k*e.r*0.9);ctx.stroke();
        ctx.beginPath();ctx.moveTo(e.r*0.3,k*e.r*0.35);ctx.lineTo(e.r*1.1,k*e.r*1.0);ctx.stroke();
      }
      const grad = ctx.createRadialGradient(-e.r*0.2,-e.r*0.2,1,0,0,e.r);
      grad.addColorStop(0,'#d9ff9c'); grad.addColorStop(1,'#4a6b1a');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(0,0,e.r*0.8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#1c2a05';
      ctx.beginPath();ctx.arc(e.r*0.3,-e.r*0.2,1.6,0,Math.PI*2);ctx.arc(e.r*0.3,e.r*0.2,1.6,0,Math.PI*2);ctx.fill();
    } else if(e.type==='sparrow'){
      // Cielo: ave veloz de alas triangulares que se pliegan al lanzarse en picado
      ctx.rotate(a);
      ctx.fillStyle='rgba(200,230,255,0.55)';
      ctx.beginPath();ctx.moveTo(-e.r*0.2,0);ctx.lineTo(-e.r*1.3,-e.r*0.85);ctx.lineTo(-e.r*0.3,-e.r*0.15);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(-e.r*0.2,0);ctx.lineTo(-e.r*1.3,e.r*0.85);ctx.lineTo(-e.r*0.3,e.r*0.15);ctx.closePath();ctx.fill();
      const grad = ctx.createRadialGradient(-e.r*0.15,-e.r*0.15,1,0,0,e.r);
      grad.addColorStop(0,'#ffffff'); grad.addColorStop(1,'#4a7fd6');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.moveTo(e.r*1.1,0);ctx.lineTo(-e.r*0.6,e.r*0.5);ctx.lineTo(-e.r*0.6,-e.r*0.5);ctx.closePath();ctx.fill();
    } else if(e.type==='cloudling'){
      // Cielo: nubecilla redondeada con un núcleo eléctrico que sigue al jugador
      ctx.save(); ctx.globalAlpha=0.75;
      ctx.fillStyle='#eaf3ff';
      for(let k=-1;k<=1;k++){
        ctx.beginPath();ctx.ellipse(k*e.r*0.42,e.r*0.12,e.r*0.55,e.r*0.4,0,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
      ctx.rotate(a);
      ctx.fillStyle='#8fc7ff';
      ctx.beginPath();ctx.arc(0,-e.r*0.05,e.r*0.42,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fffbe0';
      ctx.beginPath();ctx.arc(e.r*0.18,-e.r*0.05,1.6,0,Math.PI*2);ctx.fill();
    } else if(e.type==='stormlet'){
      // Cielo: nube fija que chisporrotea antes de cada abanico de rayos
      const grad = ctx.createRadialGradient(-e.r*0.2,-e.r*0.2,1,0,0,e.r*1.1);
      grad.addColorStop(0,'#eaf3ff'); grad.addColorStop(1,'#5c7fae');
      ctx.fillStyle=grad;
      ctx.beginPath();
      for(let k=-1;k<=1;k++) ctx.arc(k*e.r*0.5,0,e.r*0.62,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle='rgba(20,30,50,0.5)'; ctx.lineWidth=1.2; ctx.stroke();
      ctx.rotate(a);
      if(e.shootT<18 && e.t%4<2){
        ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=1.8;
        ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(e.r*1.3,-3);ctx.lineTo(e.r*1.0,2);ctx.lineTo(e.r*1.5,4);ctx.stroke();
      }
    } else {
      ctx.fillStyle='#8a3ffc';
      ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
    // barrita de vida diminuta
    if(e.hp<e.maxHp){
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(e.x-e.r,e.y-e.r-7,e.r*2,3);
      ctx.fillStyle='#5cf0c2';
      ctx.fillRect(e.x-e.r,e.y-e.r-7,e.r*2*(e.hp/e.maxHp),3);
    }
  }
}

// dibuja un proyectil con la forma indicada, centrado en (x,y) y orientado según 'ang'
// (el ángulo sólo importa para formas direccionales como el dardo; el resto son simétricas)
function drawBulletShapeAt(c, x, y, r, ang, shape, color, glow){
  c.save();
  c.translate(x,y);
  if(glow){ c.shadowColor = glow; c.shadowBlur = 6; }
  c.fillStyle = color;
  if(shape==='diamond'){
    c.beginPath();
    c.moveTo(0,-r*1.3); c.lineTo(r*1.3,0); c.lineTo(0,r*1.3); c.lineTo(-r*1.3,0);
    c.closePath(); c.fill();
  } else if(shape==='star'){
    c.rotate(ang+Math.PI/2);
    c.beginPath();
    const spikes=4, outerR=r*1.5, innerR=r*0.55;
    for(let k=0;k<spikes*2;k++){
      const rad = k%2===0 ? outerR : innerR;
      const a = (Math.PI/spikes)*k;
      const px = Math.cos(a)*rad, py = Math.sin(a)*rad;
      if(k===0) c.moveTo(px,py); else c.lineTo(px,py);
    }
    c.closePath(); c.fill();
  } else if(shape==='dart'){
    c.rotate(ang);
    c.beginPath();
    c.moveTo(r*1.7,0); c.lineTo(-r*0.8,r*0.9); c.lineTo(-r*0.3,0); c.lineTo(-r*0.8,-r*0.9);
    c.closePath(); c.fill();
  } else if(shape==='pico'){
    // la gota/pico puntiagudo, forma original del botón de disparo
    c.beginPath();
    c.moveTo(0,-r*1.25);
    c.lineTo(r*0.62,-r*0.55);
    c.lineTo(r*0.62,r*0.6);
    c.quadraticCurveTo(r*0.62,r*1.15, 0,r*1.15);
    c.quadraticCurveTo(-r*0.62,r*1.15, -r*0.62,r*0.6);
    c.lineTo(-r*0.62,-r*0.55);
    c.closePath(); c.fill();
  } else if(shape==='triangle'){
    c.rotate(ang+Math.PI/2);
    c.beginPath();
    c.moveTo(0,-r*1.3); c.lineTo(r*1.1,r*0.85); c.lineTo(-r*1.1,r*0.85);
    c.closePath(); c.fill();
  } else if(shape==='ring'){
    c.lineWidth = Math.max(1.5, r*0.4);
    c.strokeStyle = color;
    c.beginPath(); c.arc(0,0,r*0.85,0,Math.PI*2); c.stroke();
  } else if(shape==='cross'){
    const w = r*0.5;
    c.beginPath();
    c.rect(-w/2,-r*1.2,w,r*2.4);
    c.rect(-r*1.2,-w/2,r*2.4,w);
    c.fill();
  } else if(shape==='bolt'){
    c.rotate(ang+Math.PI/2);
    c.beginPath();
    c.moveTo(r*0.35,-r*1.3); c.lineTo(-r*0.55,r*0.05); c.lineTo(-r*0.05,r*0.05);
    c.lineTo(-r*0.35,r*1.3); c.lineTo(r*0.55,-r*0.15); c.lineTo(r*0.05,-r*0.15);
    c.closePath(); c.fill();
  } else {
    c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();
  }
  c.restore();
}

function drawBullets(){
  const bc = currentBulletColor();
  const bs = currentBulletShape().shape;
  for(const b of bulletsPlayer){
    const ang = Math.atan2(b.vy,b.vx);
    drawBulletShapeAt(ctx, b.x, b.y, b.r, ang, bs, bc.color, bc.glow);
  }
  ctx.fillStyle='#ff5d5d';
  for(const b of bulletsEnemy){
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = Math.max(0,p.life/40);
    ctx.fillStyle=p.color;
    if(p.ring){
      ctx.strokeStyle=p.color;
      ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1-p.life/14),0,Math.PI*2);ctx.stroke();
    } else {
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
}

function render(){
  ctx.save();
  if(shakeT>0){
    ctx.translate(rand(-shakeMag,shakeMag), rand(-shakeMag,shakeMag));
    shakeT--;
  }
  drawRoom();
  drawFirstRoomHints();
  drawDoors();
  drawHazards();
  drawParticles();
  drawBullets();
  drawEnemies();
  drawBoss();
  drawPlayer();
  ctx.restore();
}

// ---------- loop principal ----------
function loop(){
  frameT++;
  if(gameState==='playing'){
    updatePlayer();
    updateBoss();
    updateEnemies();
    updateHazards();
    updateBullets();
    updateParticles();
    updateHearts();
    updateRoomFlow();
  }
  render();
  requestAnimationFrame(loop);
}
updateHearts();
loop();
})();
</script>
