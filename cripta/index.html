// peligro extra propio de cada reino, que se mezcla con el de siempre para que Superficie y Cielo
// tengan más variedad de trampas en vez de un único tipo repetido por toda la sala.
const REALM_EXTRA_HAZARD = {superficie:'roots', cielo:'storm'};
function hazardRadius(hkind){
  return hkind==='flames' ? 36 : (hkind==='electric'||hkind==='storm' ? 30 : (hkind==='gas' ? 42 : 32));
}
// ---------- peligros de sala (permanentes: no parpadean) ----------
function generateHazards(kind, isBoss){
  const hkind = HAZARD_MAP[kind];
  const extraKind = REALM_EXTRA_HAZARD[realmOf(depth).id] || null;
  const count = isBoss ? (extraKind ? 3 : 2) : Math.floor(rand(3,4)) + (extraKind?1:0);
  const arr = [];
  const minGap = Math.max(hazardRadius(hkind), extraKind?hazardRadius(extraKind):0)*2 + 70; // separación mínima entre centros para que no se amontonen
  for(let i=0;i<count;i++){
    const thisKind = (extraKind && i%2===1) ? extraKind : hkind;
    const baseR = hazardRadius(thisKind);
    let x=0,y=0,tries=0,ok=false;
    while(!ok && tries<50){
      x = rand(ROOM.x+100, ROOM.x+ROOM.w-100);
      y = rand(ROOM.y+120, ROOM.y+ROOM.h-100);
      ok = arr.every(h=>dist({x,y},h) > minGap) && dist({x,y},{x:W/2,y:H-120}) > 130;
      tries++;
    }
    if(thisKind==='gas'){
      arr.push({kind:'gas', x, y, r:baseR, vx:0, vy:0, wanderT:0, tickTimer:60, t:0});
    } else {
      arr.push({
        kind:thisKind, x, y,
        r: baseR,
        tickTimer: rand(0,60), t:0,
      });
    }
  }
  return arr;
}

function updateHazards(){
  for(const h of hazards){
    h.t++;
    if(h.kind==='gas'){
      h.wanderT--;
      if(h.wanderT<=0){ h.vx=rand(-0.35,0.35); h.vy=rand(-0.35,0.35); h.wanderT=100; }
      h.x = clamp(h.x+h.vx, ROOM.x+h.r, ROOM.x+ROOM.w-h.r);
      h.y = clamp(h.y+h.vy, ROOM.y+h.r, ROOM.y+ROOM.h-h.r);
    }
    if(h.kind==='storm' && h.t%70===58){
      // el rayo cae justo cuando termina el aviso: destello ambiental en toda la sala
      stormFlashT = 8; shakeT = Math.max(shakeT,6); shakeMag = Math.max(shakeMag,3);
    }
    if(h.tickTimer>0) h.tickTimer--;
    if(dist(h,player) < h.r+player.r-2){
      if(h.tickTimer<=0 && player.invuln<=0){
        hitPlayer(threatDamage(1));
        h.tickTimer = h.kind==='gas' ? 95 : (h.kind==='flames' ? 55 : (h.kind==='electric'||h.kind==='storm' ? 50 : 65));
      }
    }
  }
  if(stormFlashT>0) stormFlashT--;
  updateRoomStorm();
  updateCieloAmbientFlash();
}

// tormenta ambiental de las salas de jefe del Cielo: cada cierto tiempo cae un rayo desde una
// nube cerca del jugador, sea cual sea el jefe concreto al que se enfrenta (es del entorno,
// no del propio jefe)
let roomStormT = 0;
let stormFlashT = 0;
const ROOM_STORM_INTERVAL = 300; // 5s a 60fps (antes 3s)
function updateRoomStorm(){
  if(!boss || realmOf(depth).id!=='cielo'){ roomStormT = 0; return; }
  roomStormT++;
  if(roomStormT%ROOM_STORM_INTERVAL===0 && hazards.filter(h=>h.kind==='storm').length<3){
    const x = clamp(player.x+rand(-90,90), ROOM.x+70, ROOM.x+ROOM.w-70);
    const y = clamp(player.y+rand(-70,50), ROOM.y+70, ROOM.y+ROOM.h-70);
    hazards.push({kind:'storm', x, y, r:34, tickTimer:35, t:0});
  }
}

// detecta si la sala actual es "la sala de antes del jefe": tiene una puerta sin usar que
// lleva directo a un combate de jefe (normal o guardián de reino, ambos usan nextType='boss').
// Sirve para telegrafiar el peligro con un aviso ambiental distinto en cada reino.
function isPreBossRoom(){
  return !!(currentRoom && !boss && currentRoom.doors && currentRoom.doors.some(d=>d.nextType==='boss' && !d.used));
}

// relámpagos de fondo, sólo en la sala justo antes del jefe del Cielo: aviso visual, sin
// daño, exclusivo de este reino (ningún otro reino tiene relámpagos).
let ambientLightningT = 0;
let nextAmbientLightningAt = 90;
function updateCieloAmbientFlash(){
  if(boss || realmOf(depth).id!=='cielo' || !isPreBossRoom()){ ambientLightningT = 0; return; }
  ambientLightningT++;
  if(ambientLightningT>=nextAmbientLightningAt){
    ambientLightningT = 0;
    nextAmbientLightningAt = Math.round(rand(150,220)); // ritmo irregular, ~2.5-3.7s a 60fps
    stormFlashT = 4; // destello más breve y tenue que el rayo real de la sala de jefe
  }
}

function drawHazards(){
  for(const h of hazards){
    ctx.save();
    ctx.translate(h.x,h.y);
    if(h.kind==='gas'){
      // vial de cristal roto incrustado en el suelo, liberando vapor tóxico en volutas ascendentes
      ctx.save();
      ctx.fillStyle='rgba(30,45,30,0.55)';
      ctx.beginPath();ctx.ellipse(0,h.r*0.42,h.r*0.62,h.r*0.2,0,0,Math.PI*2);ctx.fill(); // charco en el suelo
      ctx.fillStyle='rgba(130,255,160,0.28)';
      ctx.strokeStyle='rgba(170,255,190,0.75)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(-h.r*0.24,-h.r*0.52);
      ctx.lineTo(h.r*0.12,-h.r*0.58);
      ctx.lineTo(h.r*0.3,-h.r*0.05);
      ctx.lineTo(h.r*0.13,h.r*0.2);
      ctx.lineTo(-h.r*0.2,h.r*0.14);
      ctx.lineTo(-h.r*0.32,-h.r*0.16);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-h.r*0.04,-h.r*0.42); ctx.lineTo(h.r*0.06,-h.r*0.1); ctx.lineTo(-h.r*0.02,h.r*0.06);
      ctx.stroke();
      ctx.restore();
      for(let k=0;k<3;k++){
        const rise = (h.t*0.9+k*45)%(h.r*3.4);
        ctx.globalAlpha = clamp(1-rise/(h.r*3.4),0,0.5);
        const sway = Math.sin(h.t*0.05+k*2)*h.r*0.25;
        const gg = ctx.createRadialGradient(sway,-rise,0,sway,-rise,h.r*0.42);
        gg.addColorStop(0,'rgba(140,255,170,0.4)');
        gg.addColorStop(1,'rgba(80,200,120,0)');
        ctx.fillStyle = gg;
        ctx.beginPath();ctx.arc(sway,-rise,h.r*0.42,0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;
    } else if(h.kind==='spikes'){
      // fosa ósea: hueco irregular en el suelo del que emergen huesos afilados
      const cyc = (h.t%70);
      const ext = cyc<50 ? clamp(cyc/14,0,1) : clamp((70-cyc)/20,0,1);
      ctx.fillStyle = 'rgba(12,9,7,0.92)';
      ctx.beginPath();
      const pitPts = 9;
      for(let k=0;k<pitPts;k++){
        const a=(k/pitPts)*Math.PI*2;
        const rr = h.r*0.92*(0.86+0.14*Math.sin(k*2.3+3));
        const px=Math.cos(a)*rr, py=Math.sin(a)*rr*0.82;
        if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(255,100,80,0.35)';
      ctx.lineWidth=2;
      ctx.stroke();
      const nSpikes = 6;
      for(let k=0;k<nSpikes;k++){
        const a = (k/nSpikes)*Math.PI*2 + 0.3;
        const bx = Math.cos(a)*h.r*0.42, by = Math.sin(a)*h.r*0.36;
        const len = h.r*(0.22+0.6*ext);
        ctx.save();
        ctx.translate(bx,by);
        ctx.rotate(a);
        ctx.fillStyle = ext>0.5 ? '#f2ead9' : '#b9ad93';
        ctx.beginPath();
        ctx.moveTo(-3,0); ctx.lineTo(3,0); ctx.lineTo(1.5,-len); ctx.lineTo(0,-len-4); ctx.lineTo(-1.5,-len);
        ctx.closePath(); ctx.fill();
        if(ext>0.6){
          ctx.fillStyle='rgba(255,110,95,0.9)';
          ctx.beginPath();ctx.arc(0,-len-3,1.6,0,Math.PI*2);ctx.fill();
        }
        ctx.restore();
      }
    } else if(h.kind==='flames'){
      // altar rúnico: base de piedra tallada con símbolos, llamas ondulantes y brasas ascendiendo
      ctx.fillStyle='#241812';
      ctx.beginPath();ctx.ellipse(0,h.r*0.55,h.r*0.72,h.r*0.28,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,150,70,0.5)';
      ctx.lineWidth=1.4;
      const runes=5;
      for(let k=0;k<runes;k++){
        const a=(k/runes)*Math.PI*2;
        const rx=Math.cos(a)*h.r*0.5, ry=h.r*0.55+Math.sin(a)*h.r*0.14;
        ctx.beginPath();ctx.moveTo(rx-3,ry-3);ctx.lineTo(rx+3,ry+3);ctx.moveTo(rx+3,ry-3);ctx.lineTo(rx-3,ry+3);ctx.stroke();
      }
      const flick = Math.sin(h.t*0.3)*0.15;
      function flame(scale,color,alpha,skew){
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, h.r*0.5*scale);
        ctx.bezierCurveTo(h.r*0.55*scale, h.r*0.1*scale, h.r*0.35*scale+skew, -h.r*0.55*scale, 0, -h.r*(0.95+flick)*scale);
        ctx.bezierCurveTo(-h.r*0.35*scale+skew, -h.r*0.55*scale, -h.r*0.55*scale, h.r*0.1*scale, 0, h.r*0.5*scale);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      flame(1.0,'#ff5d1a',0.9, Math.sin(h.t*0.2)*4);
      flame(0.72,'#ffb23f',0.9, Math.sin(h.t*0.25+1)*4);
      flame(0.42,'#fff2b0',0.95, Math.sin(h.t*0.3+2)*3);
      for(let i=0;i<3;i++){
        const sp = (h.t*1.1+i*26)%(h.r*2.2);
        ctx.globalAlpha = clamp(1-sp/(h.r*2.2),0,1);
        ctx.fillStyle='#ffcf5c';
        ctx.beginPath();ctx.arc(Math.sin(h.t*0.1+i)*h.r*0.32, -sp, 2, 0, Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;
    } else if(h.kind==='electric'){
      // racimo de cristales crepitantes con un núcleo pulsante y arcos entre puntas
      const pulse = 0.6+Math.sin(h.t*0.15)*0.4;
      const shards = 5;
      for(let k=0;k<shards;k++){
        const a=(k/shards)*Math.PI*2 + 0.4;
        const cx=Math.cos(a)*h.r*0.3, cy=Math.sin(a)*h.r*0.26;
        const len=h.r*(0.55+0.12*Math.sin(h.t*0.08+k));
        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(a);
        const g = ctx.createLinearGradient(0,0,0,-len);
        g.addColorStop(0,'#164a60');
        g.addColorStop(1,'#c9f5ff');
        ctx.fillStyle=g;
        ctx.beginPath();
        ctx.moveTo(-4,0); ctx.lineTo(4,0); ctx.lineTo(2,-len*0.85); ctx.lineTo(0,-len); ctx.lineTo(-2,-len*0.85);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      const coreG = ctx.createRadialGradient(0,0,0,0,0,h.r*0.3*pulse+2);
      coreG.addColorStop(0,'rgba(235,252,255,0.95)');
      coreG.addColorStop(1,'rgba(90,210,255,0)');
      ctx.fillStyle = coreG;
      ctx.beginPath();ctx.arc(0,0,h.r*0.3*pulse+2,0,Math.PI*2);ctx.fill();
      if(h.t%9<2){
        ctx.strokeStyle='rgba(220,250,255,0.85)';
        ctx.lineWidth=1.3;
        const a1 = rand(0,Math.PI*2), a2 = a1+rand(1.4,2.6);
        const p1 = {x:Math.cos(a1)*h.r*0.7, y:Math.sin(a1)*h.r*0.6};
        const p2 = {x:Math.cos(a2)*h.r*0.7, y:Math.sin(a2)*h.r*0.6};
        const mx = (p1.x+p2.x)/2 + rand(-8,8), my=(p1.y+p2.y)/2 + rand(-8,8);
        ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(mx,my);ctx.lineTo(p2.x,p2.y);ctx.stroke();
      }
    } else if(h.kind==='roots'){
      // trampa de Superficie: mata de raíces nudosas que se hinchan bajo la hierba y azotan hacia arriba
      const cyc = (h.t%80);
      const ext = cyc<55 ? clamp(cyc/16,0,1) : clamp((80-cyc)/22,0,1);
      ctx.fillStyle='rgba(28,20,10,0.85)';
      ctx.beginPath();ctx.ellipse(0,h.r*0.4,h.r*0.85,h.r*0.24,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(70,120,40,0.5)';
      ctx.beginPath();ctx.ellipse(0,h.r*0.36,h.r*0.7,h.r*0.18,0,0,Math.PI*2);ctx.fill();
      const nRoots=5;
      for(let k=0;k<nRoots;k++){
        const a=(k/nRoots)*Math.PI*2+0.5;
        const bx=Math.cos(a)*h.r*0.4, by=Math.sin(a)*h.r*0.3;
        const len = h.r*(0.2+0.65*ext);
        ctx.save();
        ctx.translate(bx,by);
        ctx.rotate(a+Math.sin(h.t*0.08+k)*0.08);
        ctx.strokeStyle='#3a2c14'; ctx.lineWidth=4.5;
        ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(2,-len*0.6,-2,-len);ctx.stroke();
        ctx.strokeStyle='#6fae4a'; ctx.lineWidth=1.6;
        ctx.beginPath();ctx.moveTo(0,-len*0.3);ctx.lineTo(-5,-len*0.55);ctx.moveTo(0,-len*0.6);ctx.lineTo(4,-len*0.8);ctx.stroke();
        ctx.restore();
      }
    } else if(h.kind==='storm'){
      // trampa de Cielo: una pequeña nube cargada que avisa antes de descargar un rayo hacia abajo
      const cyc = h.t%70;
      ctx.fillStyle='rgba(90,110,140,0.55)';
      for(let k=-1;k<=1;k++){
        ctx.beginPath();ctx.ellipse(k*h.r*0.4,-h.r*0.55,h.r*0.42,h.r*0.26,0,0,Math.PI*2);ctx.fill();
      }
      const charging = cyc>45 && cyc<58; // telegrafiado: parpadea justo antes de descargar
      if(charging && h.t%6<3){
        ctx.strokeStyle='rgba(230,245,255,0.95)'; ctx.lineWidth=2.2;
        ctx.beginPath();
        ctx.moveTo(-3,-h.r*0.5); ctx.lineTo(3,-h.r*0.1); ctx.lineTo(-3,-h.r*0.1); ctx.lineTo(3,h.r*0.55);
        ctx.stroke();
      }
      const pulse=0.5+Math.sin(h.t*0.2)*0.3;
      const g = ctx.createRadialGradient(0,-h.r*0.5,0,0,-h.r*0.5,h.r*0.5*pulse+4);
      g.addColorStop(0,'rgba(220,240,255,0.7)'); g.addColorStop(1,'rgba(120,160,220,0)');
      ctx.fillStyle=g; ctx.beginPath();ctx.arc(0,-h.r*0.5,h.r*0.5*pulse+4,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}

// ---------- disparo del jugador ----------
function shootPlayer(dirx,diry){
  if(player.fireCooldown>0) return;
  player.fireCooldown = player.fireRate;
  playSfx('shoot');
  const count = 1 + player.multishot;
  const spread = 0.14;
  const baseAng = Math.atan2(diry,dirx);
  for(let k=0;k<count;k++){
    const fan = (k - (count-1)/2) * spread;
    const jitter = rand(-player.bloom, player.bloom);
    const ang = baseAng + fan + jitter;
    bulletsPlayer.push({
      x:player.x, y:player.y,
      vx:Math.cos(ang)*player.bulletSpeed, vy:Math.sin(ang)*player.bulletSpeed,
      r: 4*player.bulletSizeMul, dmg: player.damage, pierce: player.pierce, life:90, homing: player.homing,
      traveled:0, maxRange: player.bulletRange
    });
  }
}

// ---------- ataques de jefes ----------
function bossShootRing(b, n, speed){
  for(let k=0;k<n;k++){
    const ang = (Math.PI*2/n)*k + b.t*0.01;
    bulletsEnemy.push({x:b.x,y:b.y,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,r:6,life:240});
  }
}
function bossShootAimed(b, spreadCount, speed){
  const base = angleTo(b,player);
  for(let k=0;k<spreadCount;k++){
    const off = (k-(spreadCount-1)/2)*0.22;
    const ang = base+off;
    bulletsEnemy.push({x:b.x,y:b.y,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,r:6,life:240});
  }
}
function spawnSummon(x,y){
  enemies.push({type:'summon', x, y, r:10, hp:6, maxHp:6, speed:1.6, t:0, shootT:rand(0,60), fromBoss:true});
}

// todos los jefes, cada cierto tiempo, arrojan bichos hacia el jugador (se pueden destruir a tiros).
// no hay aviso de texto: el propio jefe parpadea en verde justo antes de lanzarlos.
function bossThrowBugs(b){
  const n = clamp(1 + Math.floor(bossIndex/2), 1, 3);
  for(let i=0;i<n;i++){
    const tx = player.x + rand(-50,50);
    const ty = player.y + rand(-50,50);
    const ang = angleTo(b, {x:tx,y:ty});
    const spd = 3.4 + rand(0,0.7);
    enemies.push({
      type:'bug', x:b.x, y:b.y, r:9,
      vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
      hp:2, maxHp:2, speed:2.3 + bossIndex*0.08,
      t:0, thrownT:32, fromBoss:true,
    });
  }
}

const BOSS_THROW_OFFSET = 70;
const BOSS_THROW_WARN = 24; // frames de parpadeo antes de lanzar
function updateBossThrow(b){
  const interval = Math.max(130, 230 - bossIndex*14);
  if(b.t < BOSS_THROW_OFFSET){ b.blinking=false; return; }
  const cyclePos = (b.t - BOSS_THROW_OFFSET) % interval;
  if(cyclePos===0){
    bossThrowBugs(b);
    b.blinking=false;
  } else {
    b.blinking = cyclePos >= interval - BOSS_THROW_WARN;
  }
}

// jefes cuyo movimiento está totalmente controlado por su propia IA: no reciben el
// vagabundeo ambiental por defecto porque pelearía con su posicionamiento a propósito
const NO_DRIFT_KINDS = new Set([
  'sentinel','guardian_cripta','guardian_superficie','guardian_cielo',
  'rotoCentinela','sierpe','espejo','cazador',
]);
function defaultDriftAllowed(b){
  if(b.kind==='charger' || b.kind==='devorador') return !b.chargeTarget;
  return !NO_DRIFT_KINDS.has(b.kind);
}

function updateBoss(){
  if(!boss) return;
  boss.t++;
  updateBossThrow(boss);

  if(defaultDriftAllowed(boss)){
    boss.x += Math.cos(boss.t*0.013+1)*1.1;
    boss.y += Math.sin(boss.t*0.017)*0.9;
    boss.x = clamp(boss.x, ROOM.x+boss.r+10, ROOM.x+ROOM.w-boss.r-10);
    boss.y = clamp(boss.y, ROOM.y+boss.r+10, ROOM.y+ROOM.h*0.6);
  }

  if(boss.kind==='radial'){
    if(boss.t%70===0) bossShootRing(boss, 12, 2.6);
    if(boss.t%140===35) bossShootAimed(boss,3,3.4);
  } else if(boss.kind==='charger'){
    if(!boss.chargeTarget && boss.t%90===0){
      boss.chargeTarget = {x:player.x,y:player.y};
      boss._chargeT = 0;
    }
    if(boss.chargeTarget){
      boss._chargeT++;
      const a = angleTo(boss, boss.chargeTarget);
      const spd = boss._chargeT<20 ? 0.4 : 8.5;
      boss.x += Math.cos(a)*spd;
      boss.y += Math.sin(a)*spd;
      boss.x = clamp(boss.x, ROOM.x+boss.r, ROOM.x+ROOM.w-boss.r);
      boss.y = clamp(boss.y, ROOM.y+boss.r, ROOM.y+ROOM.h-boss.r);
      if(boss._chargeT%4===0) particles.push({x:boss.x,y:boss.y,vx:0,vy:0,life:20,color:'#ff7a2e',r:14});
      if(boss._chargeT>40 || dist(boss,boss.chargeTarget)<12){
        boss.chargeTarget=null;
      }
    }
    if(boss.t%50===0) bossShootAimed(boss,1,4);
  } else if(boss.kind==='summoner'){
    if(boss.t%160===0 && enemies.filter(e=>e.fromBoss).length<5){
      spawnSummon(boss.x+rand(-60,60), boss.y+rand(-30,30));
    }
    if(boss.t%100===40) bossShootRing(boss,8,2.2);
  } else if(boss.kind==='spiral'){
    if(boss.t%6===0) bossShootRing(boss,2,3.1);
    if(boss.t%180===90) bossShootAimed(boss,5,3);
  } else if(boss.kind==='vortex'){
    // atrae suavemente al jugador hacia sí mismo mientras dispara anillos giratorios dobles
    const dv = dist(boss,player);
    if(dv>55 && dv<430){
      const av = angleTo(player,boss);
      player.x += Math.cos(av)*0.35;
      player.y += Math.sin(av)*0.35;
    }
    if(boss.t%55===0) bossShootRing(boss,10,2.3);
    if(boss.t%160===80) bossShootAimed(boss,4,3.4);
  } else if(boss.kind==='sentinel'){
    // torreta blindada casi inmóvil: barre la sala con un haz continuo de proyectiles
    boss.sweepAng += 0.045;
    if(boss.t%4===0){
      bulletsEnemy.push({x:boss.x,y:boss.y,vx:Math.cos(boss.sweepAng)*5.2,vy:Math.sin(boss.sweepAng)*5.2,r:6,life:110});
    }
    if(boss.t%200===100) bossShootAimed(boss,5,3.6);
  } else if(boss.kind==='plague'){
    // deja charcos de gas tóxico a su paso y refuerza el combate con esbirros e impactos en anillo
    if(boss.t%130===0 && hazards.length<8){
      hazards.push({kind:'gas', x:clamp(boss.x+rand(-40,40),ROOM.x+50,ROOM.x+ROOM.w-50), y:clamp(boss.y+rand(-30,30),ROOM.y+50,ROOM.y+ROOM.h-50), r:32, vx:0, vy:0, wanderT:60, tickTimer:40, t:0});
    }
    if(boss.t%150===70) bossShootRing(boss,7,2.5);
    if(boss.t%220===0 && enemies.filter(e=>e.fromBoss).length<4){
      spawnSummon(boss.x+rand(-50,50), boss.y+rand(-30,30));
    }
  } else if(boss.kind==='vacio'){
    // se teletransporta junto al jugador (con un parpadeo de aviso) y descarga un anillo al llegar
    const cyc = boss.t % 150;
    boss.blinking = cyc>=120 && cyc<150;
    if(cyc===0 && boss.t>0){
      boss.x = clamp(player.x+rand(-160,160), ROOM.x+boss.r+20, ROOM.x+ROOM.w-boss.r-20);
      boss.y = clamp(player.y+rand(-170,-70), ROOM.y+boss.r+20, ROOM.y+ROOM.h*0.6);
      particlesBurst(boss.x,boss.y,'#6b3fa0');
      bossShootRing(boss,10,2.6);
    }
    if(boss.t%90===45) bossShootAimed(boss,3,3.2);
  } else if(boss.kind==='custodio'){
    // dos haces giratorios en direcciones opuestas, casi estático
    boss.sweepAng += 0.03;
    if(boss.t%3===0){
      bulletsEnemy.push({x:boss.x,y:boss.y,vx:Math.cos(boss.sweepAng)*4.6,vy:Math.sin(boss.sweepAng)*4.6,r:6,life:100});
      bulletsEnemy.push({x:boss.x,y:boss.y,vx:Math.cos(-boss.sweepAng)*4.6,vy:Math.sin(-boss.sweepAng)*4.6,r:6,life:100});
    }
    if(boss.t%170===0) bossShootRing(boss,8,2.4);
  } else if(boss.kind==='devorador'){
    // encadena hasta 3 embestidas rápidas seguidas antes de descansar y disparar un anillo
    if(!boss.chargeTarget && boss.t%110===0){
      boss.chargeTarget = {x:player.x,y:player.y};
      boss._chargeT = 0;
      boss._dashCount = (boss._dashCount||0)+1;
    }
    if(boss.chargeTarget){
      boss._chargeT++;
      const a = angleTo(boss, boss.chargeTarget);
      const spd = boss._chargeT<14 ? 0.5 : 9.5;
      boss.x += Math.cos(a)*spd; boss.y += Math.sin(a)*spd;
      boss.x = clamp(boss.x, ROOM.x+boss.r, ROOM.x+ROOM.w-boss.r);
      boss.y = clamp(boss.y, ROOM.y+boss.r, ROOM.y+ROOM.h-boss.r);
      if(boss._chargeT%3===0) particles.push({x:boss.x,y:boss.y,vx:0,vy:0,life:16,color:'#ff3f3f',r:12});
      if(boss._chargeT>34 || dist(boss,boss.chargeTarget)<12){
        if(boss._dashCount%3!==0){ boss.chargeTarget = {x:player.x+rand(-40,40),y:player.y+rand(-40,40)}; }
        else { boss.chargeTarget=null; bossShootRing(boss,10,2.8); }
      }
    }
  } else if(boss.kind==='enjambre'){
    // invoca esbirros con más frecuencia y en mayor número que cualquier otro jefe
    if(boss.t%110===0 && enemies.filter(e=>e.fromBoss).length<7){
      spawnSummon(boss.x+rand(-70,70), boss.y+rand(-30,30));
    }
    if(boss.t%160===60) bossShootRing(boss,6,2.1);
  } else if(boss.kind==='rotoCentinela'){
    // haz de barrido oscilante (va y vuelve) en vez de dar vueltas completas
    boss.sweepAng = Math.PI/2 + Math.sin(boss.t*0.05)*1.15;
    if(boss.t%3===0){
      bulletsEnemy.push({x:boss.x,y:boss.y,vx:Math.cos(boss.sweepAng)*5.6,vy:Math.sin(boss.sweepAng)*5.6,r:6,life:110});
    }
    if(boss.t%190===90) bossShootAimed(boss,4,3.4);
  } else if(boss.kind==='plaga'){
    // deja tras de sí una trampa distinta cada vez (gas, pinchos o eléctrica) por turnos
    if(boss.t%110===0 && hazards.length<9){
      const hk = ['gas','spikes','electric'][Math.floor(boss.t/110)%3];
      const hx = clamp(boss.x+rand(-50,50),ROOM.x+50,ROOM.x+ROOM.w-50), hy = clamp(boss.y+rand(-30,30),ROOM.y+50,ROOM.y+ROOM.h-50);
      if(hk==='gas') hazards.push({kind:'gas', x:hx, y:hy, r:30, vx:0, vy:0, wanderT:60, tickTimer:35, t:0});
      else hazards.push({kind:hk, x:hx, y:hy, r:30, tickTimer:35, t:0});
    }
    if(boss.t%150===70) bossShootRing(boss,7,2.4);
  } else if(boss.kind==='gravitacional'){
    // alterna entre atraer y repeler al jugador mientras dispara anillos densos
    const dv = dist(boss,player);
    const phaseAttract = Math.floor(boss.t/200)%2===0;
    if(dv>50 && dv<440){
      const av = phaseAttract ? angleTo(player,boss) : angleTo(boss,player);
      player.x += Math.cos(av)*0.5;
      player.y += Math.sin(av)*0.5;
    }
    if(boss.t%55===0) bossShootRing(boss,11,2.3);
  } else if(boss.kind==='gemelos'){
    // proyecta un espejismo de sí mismo al otro lado de la sala que también dispara
    if(boss.t%130===0) bossShootAimed(boss,3,3.2);
    if(boss.t%130===65){
      const mx = W-boss.x, my = boss.y;
      bossShootAimed({x:mx,y:my,t:boss.t}, 3, 3.2);
      particlesBurst(mx,my,'#ff6bd6');
    }
    if(boss.t%200===0) bossShootRing(boss,9,2.5);
  } else if(boss.kind==='heraldo'){
    // ataques impredecibles: cada ciclo elige al azar entre anillo, dirigido o espiral
    if(boss.t%70===0){
      const pick = Math.floor(rand(0,3));
      if(pick===0) bossShootRing(boss,10,2.6);
      else if(pick===1) bossShootAimed(boss,4,3.4);
      else bossShootRing(boss,3,3.4);
    }
  } else if(boss.kind==='tejedor'){
    // se desvanece (invulnerable) para reposicionarse y reaparece con una ráfaga dirigida
    const cyc = boss.t%220;
    boss.invulnerable = cyc>=150 && cyc<210;
    if(cyc===150){ boss.x = clamp(rand(ROOM.x+80,ROOM.x+ROOM.w-80),ROOM.x+boss.r,ROOM.x+ROOM.w-boss.r); particlesBurst(boss.x,boss.y,'#b06bff'); }
    if(cyc===210){ bossShootAimed(boss,5,3.4); particlesBurst(boss.x,boss.y,'#b06bff'); }
  } else if(boss.kind==='furia'){
    // se enfurece a partir de la mitad de su vida: dispara y se mueve más rápido
    const enraged = boss.hp < boss.maxHp*0.5;
    const rate = enraged ? 45 : 75;
    if(boss.t%rate===0) bossShootAimed(boss, enraged?4:2, enraged?4.2:3.4);
    if(enraged){ boss.x += Math.cos(boss.t*0.05)*1.4; boss.y += Math.sin(boss.t*0.06)*1.1; boss.x=clamp(boss.x,ROOM.x+boss.r,ROOM.x+ROOM.w-boss.r); boss.y=clamp(boss.y,ROOM.y+boss.r,ROOM.y+ROOM.h*0.6); }
  } else if(boss.kind==='centella'){
    // movimiento errático a alta velocidad con ráfagas dirigidas frecuentes
    boss.x += Math.sin(boss.t*0.11)*3.4;
    boss.y += Math.cos(boss.t*0.08)*2.6;
    boss.x = clamp(boss.x, ROOM.x+boss.r+10, ROOM.x+ROOM.w-boss.r-10);
    boss.y = clamp(boss.y, ROOM.y+boss.r+10, ROOM.y+ROOM.h*0.6);
    if(boss.t%55===0) bossShootAimed(boss,2,4.2);
  } else if(boss.kind==='nigromante'){
    // levanta un par de esbirros fijos que disparan por su cuenta, en vez de perseguir
    if(boss.t%180===0 && enemies.filter(e=>e.fromBoss).length<4){
      enemies.push({type:'turret', x:clamp(boss.x+rand(-90,90),ROOM.x+40,ROOM.x+ROOM.w-40), y:clamp(boss.y+rand(20,70),ROOM.y+40,ROOM.y+ROOM.h-40), r:13, hp:10, maxHp:10, speed:0, t:0, shootT:rand(0,50), fromBoss:true, wob:0, chargeState:'idle', chargeT:0, chargeDir:{x:0,y:0}, orbitDir:1, orbitAng:0, aiming:false, aimT:0, fuseT:999, blinkT:50});
    }
    if(boss.t%140===70) bossShootRing(boss,7,2.4);
  } else if(boss.kind==='martillo'){
    // ataque único y contundente: telegrafía un buen rato y luego golpea con un anillo grande y pinchos
    const cyc = boss.t%170;
    boss.blinking = cyc>=140 && cyc<170;
    if(cyc===0 && boss.t>0){
      bossShootRing(boss,16,2.9);
      for(let k=0;k<2;k++){ hazards.push({kind:'spikes', x:clamp(player.x+rand(-70,70),ROOM.x+60,ROOM.x+ROOM.w-60), y:clamp(player.y+rand(-70,70),ROOM.y+60,ROOM.y+ROOM.h-60), r:28, tickTimer:20, t:0}); }
      shakeT=10; shakeMag=5;
    }
  } else if(boss.kind==='sierpe'){
    // órbita continua y amplia alrededor de la sala mientras dispara en espiral
    boss._orbAng = (boss._orbAng||0) + 0.018;
    const cx = W/2, cy = ROOM.y+ROOM.h*0.34, rad = Math.min(ROOM.w,ROOM.h)*0.3;
    boss.x = cx + Math.cos(boss._orbAng)*rad;
    boss.y = cy + Math.sin(boss._orbAng)*rad*0.6;
    if(boss.t%6===0) bossShootRing(boss,2,3.0);
  } else if(boss.kind==='arquitecto'){
    // apenas se mueve, pero va sembrando la sala de trampas hasta un límite más alto de lo normal
    if(boss.t%95===0 && hazards.length<11){
      const hk = ['spikes','electric','gas'][Math.floor(rand(0,3))];
      const hx = clamp(rand(ROOM.x+100,ROOM.x+ROOM.w-100),ROOM.x+50,ROOM.x+ROOM.w-50), hy = clamp(rand(ROOM.y+140,ROOM.y+ROOM.h-100),ROOM.y+50,ROOM.y+ROOM.h-50);
      if(hk==='gas') hazards.push({kind:'gas', x:hx, y:hy, r:28, vx:0, vy:0, wanderT:60, tickTimer:35, t:0});
      else hazards.push({kind:hk, x:hx, y:hy, r:28, tickTimer:35, t:0});
    }
    if(boss.t%160===80) bossShootRing(boss,6,2.2);
  } else if(boss.kind==='espejo'){
    // se mantiene arriba y calca el movimiento horizontal del jugador, disparando hacia abajo
    boss.x += (player.x-boss.x)*0.05;
    boss.x = clamp(boss.x, ROOM.x+boss.r+10, ROOM.x+ROOM.w-boss.r-10);
    boss.y = ROOM.y+110;
    if(boss.t%40===0) bossShootAimed(boss,3,3.6);
    if(boss.t%160===20) bossShootRing(boss,8,2.2);
  } else if(boss.kind==='cazador'){
    // acecha en silencio, acercándose despacio, y sólo dispara ráfagas cortas cuando está cerca
    const d = dist(boss,player);
    if(d>140){ const a=angleTo(boss,player); boss.x+=Math.cos(a)*0.9; boss.y+=Math.sin(a)*0.9; }
    boss.x = clamp(boss.x, ROOM.x+boss.r+10, ROOM.x+ROOM.w-boss.r-10);
    boss.y = clamp(boss.y, ROOM.y+boss.r+10, ROOM.y+ROOM.h*0.62);
    if(d<=170 && boss.t%75===0) bossShootAimed(boss,3,4.4);
  } else if(boss.kind==='fragmentado'){
    // parpadea y se fragmenta a saltos cortos por la sala mientras lanza un anillo amplio
    const cyc = boss.t%130;
    boss.blinking = cyc>=100 && cyc<130;
    if(cyc===0 && boss.t>0){
      boss.x = clamp(rand(ROOM.x+80,ROOM.x+ROOM.w-80), ROOM.x+boss.r, ROOM.x+ROOM.w-boss.r);
      boss.y = clamp(rand(ROOM.y+100,ROOM.y+ROOM.h*0.55), ROOM.y+boss.r, ROOM.y+ROOM.h*0.6);
      particlesBurst(boss.x,boss.y,'#cccccc');
      bossShootRing(boss,14,2.7);
    }
  } else if(boss.kind==='ultimo'){
    // combina varios patrones: anillo, ráfaga dirigida y teletransporte, y se enfurece a poca vida
    const enraged = boss.hp < boss.maxHp*0.4;
    const cyc = boss.t%160;
    boss.blinking = cyc>=130 && cyc<160;
    if(cyc===0 && boss.t>0){
      boss.x = clamp(player.x+rand(-140,140), ROOM.x+boss.r+20, ROOM.x+ROOM.w-boss.r-20);
      boss.y = clamp(player.y+rand(-160,-60), ROOM.y+boss.r+20, ROOM.y+ROOM.h*0.6);
      particlesBurst(boss.x,boss.y,'#ffffff');
      bossShootRing(boss, enraged?16:11, enraged?3.2:2.6);
    }
    if(boss.t%(enraged?55:80)===40) bossShootAimed(boss, enraged?5:3, enraged?4.2:3.4);
  } else if(boss.kind==='centinelaFinal'){
    // jefe secreto "Nexo del Vacío": aparece al completar una vuelta entera a los 20 jefes del
    // Más Allá. Combina teletransporte, invocación de esbirros y un doble patrón de disparo,
    // con una fase de furia agresiva a partir de la mitad de su vida.
    const enraged = boss.hp < boss.maxHp*0.5;
    const cyc = boss.t%150;
    boss.blinking = cyc>=115 && cyc<150;
    if(cyc===0 && boss.t>0){
      boss.x = clamp(player.x+rand(-150,150), ROOM.x+boss.r+20, ROOM.x+ROOM.w-boss.r-20);
      boss.y = clamp(player.y+rand(-170,-60), ROOM.y+boss.r+20, ROOM.y+ROOM.h*0.6);
      particlesBurst(boss.x,boss.y,SECRET_BOSS_COLOR);
      bossShootRing(boss, enraged?18:13, enraged?3.1:2.6);
    }
    if(boss.t%(enraged?50:75)===35) bossShootAimed(boss, enraged?5:3, enraged?4.4:3.6);
    if(boss.t%170===85 && enemies.filter(e=>e.fromBoss).length<4) spawnSummon(boss.x+rand(-70,70), boss.y+rand(-30,30));
  } else if(boss.kind==='guardian_cripta'){
    // guardián de la Cripta: casi inmóvil, telegrafía un temblor y golpea el suelo desatando un
    // anillo de proyectiles a la vez que abre grietas de pinchos junto al jugador
    boss.blinking = (boss.t%130)>=60 && (boss.t%130)<90;
    if(boss.t%130===0){
      bossShootRing(boss, 14, 2.8);
      for(let k=0;k<2;k++){
        hazards.push({kind:'spikes', x:clamp(player.x+rand(-70,70),ROOM.x+60,ROOM.x+ROOM.w-60), y:clamp(player.y+rand(-70,70),ROOM.y+60,ROOM.y+ROOM.h-60), r:30, tickTimer:20, t:0});
      }
      shakeT=10; shakeMag=5;
    }
    if(boss.t%260===140) bossShootAimed(boss,5,3.6);
  } else if(boss.kind==='guardian_superficie'){
    // coloso de la Superficie: avanza sin parar hacia el jugador dejando un rastro de raíces
    // vivas tras de sí, y cada cierto tiempo golpea el suelo en un anillo de espinas
    const ga = angleTo(boss,player);
    boss.x += Math.cos(ga)*1.7; boss.y += Math.sin(ga)*1.7;
    boss.x = clamp(boss.x, ROOM.x+boss.r, ROOM.x+ROOM.w-boss.r);
    boss.y = clamp(boss.y, ROOM.y+boss.r+10, ROOM.y+ROOM.h*0.62);
    if(boss.t%26===0 && hazards.length<10){
      hazards.push({kind:'roots', x:boss.x, y:boss.y, r:26, tickTimer:30, t:0});
    }
    if(boss.t%150===0) bossShootRing(boss,10,2.4);
    if(boss.t%230===110) bossShootAimed(boss,4,3.4);
  } else if(boss.kind==='guardian_cielo'){
    // tirano del Cielo: se desplaza a saltos erráticos por el aire y llama tormentas que golpean
    // la posición del jugador tras un breve aviso
    if(boss.t%70===0 || !boss._jumpTarget){
      boss._jumpTarget = {x:clamp(player.x+rand(-140,140),ROOM.x+boss.r+20,ROOM.x+ROOM.w-boss.r-20), y:clamp(player.y+rand(-130,40),ROOM.y+boss.r+20,ROOM.y+ROOM.h*0.55)};
      particlesBurst(boss.x,boss.y,'#5c9dff');
    }
    boss.x += (boss._jumpTarget.x-boss.x)*0.07;
    boss.y += (boss._jumpTarget.y-boss.y)*0.07;
    if(boss.t%90===45 && hazards.length<10){
      hazards.push({kind:'storm', x:clamp(player.x,ROOM.x+60,ROOM.x+ROOM.w-60), y:clamp(player.y,ROOM.y+60,ROOM.y+ROOM.h-60), r:34, tickTimer:35, t:10});
    }
    if(boss.t%140===0) bossShootRing(boss,10,3.0);
    if(boss.t%210===105) bossShootAimed(boss,4,3.8);
  }

if(dist(boss,player) < boss.r+player.r && player.invuln<=0){
  hitPlayer(threatDamage(1));

  // Si el golpe nos ha matado, gameOver() pone boss=null.
  // Salimos inmediatamente para no intentar usar boss.r después.
  if(gameState !== 'playing' || !boss) return;
  }
  }
}

// ---------- enemigos (sala + esbirros) ----------
function updateEnemies(){
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    e.t++;
    if(e.type==='walker' || e.type==='summon' || e.type==='shard'){
      const a = angleTo(e,player);
      e.x += Math.cos(a)*e.speed;
      e.y += Math.sin(a)*e.speed;
      if(e.type==='walker' || e.type==='shard'){
        // ligero zigzag: hace que acercarse en línea recta no sea trivial de esquivar
        const perp = a + Math.PI/2;
        const wobAmt = Math.sin(e.t*0.09 + e.wob) * (e.speed*0.6);
        e.x += Math.cos(perp)*wobAmt;
        e.y += Math.sin(perp)*wobAmt;
      }
    } else if(e.type==='splitter'){
      const a = angleTo(e,player);
      e.x += Math.cos(a)*e.speed;
      e.y += Math.sin(a)*e.speed;
    } else if(e.type==='brute' || e.type==='boar'){
      if(e.chargeState==='idle'){
        const d = dist(e,player);
        if(d<230){
          e.chargeState='telegraph'; e.chargeT=26;
          const a = angleTo(e,player);
          e.chargeDir = {x:Math.cos(a), y:Math.sin(a)};
        } else {
          const a = angleTo(e,player);
          e.x += Math.cos(a)*e.speed*0.6;
          e.y += Math.sin(a)*e.speed*0.6;
        }
      } else if(e.chargeState==='telegraph'){
        e.chargeT--;
        if(e.chargeT<=0){ e.chargeState='charging'; e.chargeT=18; }
      } else if(e.chargeState==='charging'){
        e.x += e.chargeDir.x*7.4;
        e.y += e.chargeDir.y*7.4;
        e.chargeT--;
        if(e.chargeT<=0){ e.chargeState='cooldown'; e.chargeT=55; }
      } else if(e.chargeState==='cooldown'){
        e.chargeT--;
        if(e.chargeT<=0) e.chargeState='idle';
      }
    } else if(e.type==='bug'){
      if(e.thrownT>0){
        e.x += e.vx; e.y += e.vy; e.thrownT--;
        if(e.thrownT<=0){ e.landedLife = 260; }
      } else {
        const a = angleTo(e,player);
        e.x += Math.cos(a)*e.speed;
        e.y += Math.sin(a)*e.speed;
        e.landedLife--;
        if(e.landedLife<=0){ enemies.splice(i,1); continue; }
      }
    } else if(e.type==='shooter' || e.type==='cloudling'){
      const d = dist(e,player);
      const a = angleTo(e,player);
      if(d<130){ e.x -= Math.cos(a)*e.speed; e.y -= Math.sin(a)*e.speed; }
      else if(d>220){ e.x += Math.cos(a)*e.speed; e.y += Math.sin(a)*e.speed; }
    } else if(e.type==='thorn'){
      // Superficie: mantiene distancia como un tirador, pero dispara en abanico corto
      const d = dist(e,player);
      const a = angleTo(e,player);
      if(d<150){ e.x -= Math.cos(a)*e.speed; e.y -= Math.sin(a)*e.speed; }
      else if(d>240){ e.x += Math.cos(a)*e.speed; e.y += Math.sin(a)*e.speed; }
    } else if(e.type==='sniper'){
      // mantiene una distancia larga y sólo dispara cuando tiene línea de tiro cargada
      const d = dist(e,player);
      const a = angleTo(e,player);
      if(!e.aiming){
        if(d<260){ e.x -= Math.cos(a)*e.speed; e.y -= Math.sin(a)*e.speed; }
        else if(d>320){ e.x += Math.cos(a)*e.speed; e.y += Math.sin(a)*e.speed; }
      }
    } else if(e.type==='orbiter'){
      // orbita alrededor del jugador a distancia media mientras dispara
      const orbitR = 165;
      e.orbitAng += 0.028*e.orbitDir;
      const tx = player.x + Math.cos(e.orbitAng)*orbitR;
      const ty = player.y + Math.sin(e.orbitAng)*orbitR;
      const a = Math.atan2(ty-e.y, tx-e.x);
      e.x += Math.cos(a)*e.speed;
      e.y += Math.sin(a)*e.speed;
    } else if(e.type==='bomber'){
      // avanza lento y, al acercarse lo suficiente, detona en una ronda radial de proyectiles
      const d = dist(e,player);
      if(e.fuseT>=999 && d<95){ e.fuseT = 26; } // arma la mecha
      if(e.fuseT<999){
        e.fuseT--;
        if(e.fuseT<=0){
          bossShootRing(e, 8, 3.0);
          particles.push({x:e.x,y:e.y,vx:0,vy:0,life:14,color:'#ff9d3f',r:30,ring:true});
          shakeT=8; shakeMag=4;
          enemies.splice(i,1);
          continue;
        }
      } else {
        const a = angleTo(e,player);
        e.x += Math.cos(a)*e.speed;
        e.y += Math.sin(a)*e.speed;
      }
    } else if(e.type==='stalker' || e.type==='sparrow' || e.type==='spiderling'){
      // asesino cuerpo a cuerpo: acecha y, cada cierto tiempo, se lanza en un tramo corto
      // hacia el jugador (un "parpadeo" de sombra) en vez de avanzar siempre en línea recta
      e.blinkT--;
      if(e.blinkT<=0){
        const d = dist(e,player);
        if(d>70){
          const a = angleTo(e,player);
          const bd = Math.min(95, d-40);
          e.x += Math.cos(a)*bd;
          e.y += Math.sin(a)*bd;
          particlesBurst(e.x,e.y, e.type==='sparrow' ? '#bfe0ff' : (e.type==='spiderling' ? '#c9ff8a' : '#c9a8ff'));
        }
        e.blinkT = e.type==='spiderling' ? 60 : (e.type==='sparrow' ? 75 : 95); // más ágiles, parpadean más seguido
      } else {
        const a = angleTo(e,player);
        e.x += Math.cos(a)*e.speed;
        e.y += Math.sin(a)*e.speed;
      }
    } else if(e.type==='bramble'){
      // Superficie: avanza despacio y, al acercarse lo suficiente, se enraíza para lanzar espinas
      if(e.chargeState==='idle'){
        const d = dist(e,player);
        if(d<170){ e.chargeState='telegraph'; e.chargeT=34; }
        else { const a=angleTo(e,player); e.x+=Math.cos(a)*e.speed; e.y+=Math.sin(a)*e.speed; }
      } else if(e.chargeState==='telegraph'){
        e.chargeT--;
        if(e.chargeT<=0){ bossShootAimed(e,3,3.6); e.chargeState='cooldown'; e.chargeT=70; }
      } else if(e.chargeState==='cooldown'){
        e.chargeT--;
        if(e.chargeT<=0) e.chargeState='idle';
      }
    } else if(e.type==='gust'){
      // Cielo: vuelo errático alrededor del jugador, invirtiendo el sentido de giro de vez en cuando
      if(e.t%140===0) e.orbitDir *= -1;
      const orbitR = 150 + Math.sin(e.t*0.02)*40;
      e.orbitAng += 0.045*e.orbitDir;
      const tx = player.x + Math.cos(e.orbitAng)*orbitR;
      const ty = player.y + Math.sin(e.orbitAng)*orbitR;
      const a = Math.atan2(ty-e.y, tx-e.x);
      e.x += Math.cos(a)*e.speed;
      e.y += Math.sin(a)*e.speed;
    }
    e.x = clamp(e.x, ROOM.x+e.r, ROOM.x+ROOM.w-e.r);
    e.y = clamp(e.y, ROOM.y+e.r, ROOM.y+ROOM.h-e.r);

    if(e.type==='shooter' || e.type==='summon' || e.type==='orbiter' || e.type==='cloudling'){
      e.shootT--;
      if(e.shootT<=0){
        e.shootT = e.type==='summon' ? 90 : (e.type==='orbiter' ? 105 : Math.max(45, 110-bossIndex*6));
        const a = angleTo(e,player);
        bulletsEnemy.push({x:e.x,y:e.y,vx:Math.cos(a)*3.2,vy:Math.sin(a)*3.2,r:5,life:200});
      }
    }
    if(e.type==='thorn'){
      // Superficie: dispara un abanico corto en vez de un único proyectil
      e.shootT--;
      if(e.shootT<=0){ e.shootT=130; bossShootAimed(e,2,3.4); }
    }
    if(e.type==='sniper'){
      const d = dist(e,player);
      if(!e.aiming){
        e.shootT--;
        if(e.shootT<=0 && d<340){ e.aiming=true; e.aimT=48; e.shootT=150; }
      } else {
        e.aimT--;
        if(e.aimT<=0){
          const a = angleTo(e,player);
          bulletsEnemy.push({x:e.x,y:e.y,vx:Math.cos(a)*6.4,vy:Math.sin(a)*6.4,r:5,life:200});
          e.aiming=false;
        }
      }
    }
    if(e.type==='turret' || e.type==='stormlet'){
      // torreta fija: no se mueve, sólo gira y dispara un abanico de proyectiles a intervalos
      e.shootT--;
      if(e.shootT<=0){
        e.shootT = Math.max(55, 130-depth*3);
        bossShootAimed(e, 3, 3.6);
      }
    }
    if(e.type==='gust'){
      // Cielo: ráfaga de viento aimed, más rápida que la de un disparador normal
      e.shootT--;
      if(e.shootT<=0){ e.shootT=95; bossShootAimed(e,2,5.2); }
    }
    if(dist(e,player) < e.r+player.r && player.invuln<=0){
      hitPlayer(threatDamage((e.type==='brute'||e.type==='boar') && e.chargeState==='charging' ? 2 : 1));
    }
  }
}

// el halo del orbitador gira (mismo ángulo que su dibujo) y cubre 3/4 de círculo, dejando
// un hueco de 90° por el que se le puede dar para matarlo de un solo golpe.
function isThroughOrbiterGap(e,x,y){
  const gapStart = e.t*0.05 + Math.PI*1.5; // el hueco empieza donde termina el arco dibujado
  let ang = Math.atan2(y-e.y, x-e.x);
  let rel = ((ang-gapStart) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  return rel < Math.PI*0.5;
}

// ---------- daño / colisiones ----------
function hitPlayer(dmg){
  if(player.dashing>0) return;
  if(player.shield>0){ player.shield--; flashShield(); return; }
  player.hp -= dmg;
  player.invuln = 55;
  shakeT = 14; shakeMag = 7;
  playSfx('hurt');
  spawnFloatText(player.x,player.y-20,'-'+dmg,'#ff5d5d');
  if(player.hp<=0){
    if(player.hasRevive){
      player.hasRevive = false;
      player.hp = Math.max(1, Math.ceil(player.maxHp/2));
      player.invuln = 120;
      shakeT = 20; shakeMag = 10;
      spawnFloatText(player.x,player.y-42,'¡SEGUNDA OPORTUNIDAD!','#ffcf5c');
      return;
    }
    player.hp=0;
    gameOver();
  }
}
function flashShield(){
  spawnFloatText(player.x,player.y-20,'¡BLOQUEADO!','#4dd3ff');
  shakeT=8; shakeMag=4;
}

// el escudo ya no se recarga tras cada jefe: ahora recupera 1 carga cada 10 enemigos eliminados
// (cuentan tanto los enemigos de sala como los esbirros de jefe)
function registerNormalKill(){
  normalKills++;
  if(player.shieldMax>0 && player.shield<player.shieldMax){
    killsSinceShieldCharge++;
    const threshold = 10;
    if(killsSinceShieldCharge>=threshold){
      killsSinceShieldCharge = 0;
      player.shield = Math.min(player.shieldMax, player.shield+1);
      spawnFloatText(player.x,player.y-24,'🛡️ +1 CARGA','#4dd3ff');
    }
  }
}

function damageBoss(amount){
  if(boss.invulnerable){ spawnHitParticles(boss.x,boss.y,'#e8d9ff'); return; }
  boss.hp -= amount;
  bosshpinner.style.width = Math.max(0,(boss.hp/boss.maxHp*100))+'%';
  if(boss.hp<=0){
    killBoss();
  }
}

function killBoss(){
  playSfx('bossdeath');
  for(let i=0;i<40;i++){
    particles.push({x:boss.x,y:boss.y,vx:rand(-6,6),vy:rand(-6,6),life:40,color:boss.color,r:rand(2,5)});
  }
  spawnFloatText(boss.x,boss.y,'¡DERROTADO!','#c9ff3d');
  addCoins(boss.x, boss.y, Math.round((30+bossIndex*8)*coinMult));
  if(boss.isGuardian){
    // el guardián de reino suelta la llave que abre el ascenso al siguiente reino
    keysCollected.push(boss.unlocksRealm);
    keyHUDUpdate();
    const bx = boss.x, by = boss.y; // guardamos posición antes de que boss se ponga a null más abajo,
    // si no, estos setTimeout leen boss.x/boss.y sobre null cuando disparan y rompen el bucle de animación
    setTimeout(()=>spawnFloatText(bx,by-30,'+1 🔑 LLAVE','#ffe45c'), 260);
    // subir de reino también fortalece al jugador: +1 de daño permanente por disparo
    player.damage += 1;
    setTimeout(()=>spawnFloatText(bx,by-52,'+1 🗡️ DAÑO','#ff8a6b'), 420);
    playSfx('coin');
  }
  bossesDefeated++;
  killnumEl.textContent = bossesDefeated;
  if(bossesDefeated===1) unlockAchievement('primer_jefe');
  if(INFINITO_KINDS.includes(boss.kind)){
    meta.infinitoKindsSeen[boss.kind] = true;
    saveMeta();
    if(INFINITO_KINDS.every(k=>meta.infinitoKindsSeen[k])) unlockAchievement('maestro_mas_alla');
  } else if(boss.kind==='centinelaFinal'){
    unlockAchievement('centinela_final');
    addCoins(boss.x, boss.y, Math.round(60*coinMult));
  }
  bossbar.style.display='none';
  boss = null;
  enemies=[];
  bulletsEnemy=[];
  hazards=[];
  bossIndex++;
  pickNextBossKind(); // avanza el ciclo fijo de jefes (ver pickNextBossKind)
  gameState='choosing';
  setTimeout(openAbilityChoice, 650);
}

// ---------- pantalla de elección tras un jefe ----------
function openAbilityChoice(){
  const cardsWrap = document.createElement('div');
  cardsWrap.id='cards';
  const opts = pickAbilities(3);
  opts.forEach(ab=>{
    const c = document.createElement('div');
    c.className='card';
    c.innerHTML = `<div class="icon">${ab.icon}</div><div class="name">${ab.name}</div><div class="desc">${ab.desc}</div>`;
    c.addEventListener('click', ()=>{
      ab.apply(player);
      overlay.classList.add('hidden');
      overlay.innerHTML='';
      gameState='playing';
      currentRoom.cleared = true;
      spawnFloatText(W/2, ROOM.y+40, 'Busca la puerta para continuar', '#c9ff3d');
      revealDoors();
    });
    cardsWrap.appendChild(c);
  });
  overlay.innerHTML = `<h1>PODER OBTENIDO</h1><p>El altar se abre. Elige el poder que llevarás contigo: <b style="color:var(--accent)">${ZONE_NAMES[currentKind()]}</b>.</p>`;
  overlay.appendChild(cardsWrap);
  overlay.classList.remove('hidden');
}

// ---------- regalo inicial del Pacto del Vacío: una elección extra de poder al empezar la
// partida, a cambio del reto de tener hasta 2 enemigos más por sala. Se elige 1 de 3 (el mismo
// balance que un altar normal) para que el pacto siga siendo un intercambio justo y no un

function openPactVoidBonus(){
  const cardsWrap = document.createElement('div');

    c.innerHTML = `<div class="icon">${ab.icon}</div><div class="name">${ab.name}</div><div class="desc">${ab.desc}</div>`;

      ab.apply(player);
      overlay.classList.add('hidden');
      overlay.innerHTML='';
      gameState='playing';
    });

}

// ---------- tienda dentro del mapa ----------
function renderShopRoom(){
  const grid = document.createElement('div');
  grid.id = 'shopgrid';
  currentShopOffers.forEach(item=>{
    const cost = shopCost(item);
    const c = document.createElement('div');
    c.className = 'shopcard';
    c.innerHTML = `<div class="icon">${item.icon}</div>
      <div class="name">${item.name}</div>
      <div class="desc">${item.desc}</div>
      <button class="buybtn" ${coins<cost?'disabled':''}>🪙 ${cost}</button>`;
    const btn = c.querySelector('.buybtn');
    btn.addEventListener('click', ()=>{
      if(coins<shopCost(item)) return;
      coins -= shopCost(item);
      updateCoinHUD();
      shopPurchaseCounts[item.id] = (shopPurchaseCounts[item.id]||0)+1;
      item.apply(player);
      if(item.oncePerRun){ currentShopOffers = currentShopOffers.filter(it=>it.id!==item.id); }
      renderShopRoom();
    });
    grid.appendChild(c);
  });
  overlay.innerHTML = `<h1 style="font-size:30px;">TIENDA</h1><p>Compra con las monedas de esta partida — se pierden si mueres. Monedas: <b style="color:var(--gold)">🪙 ${coins}</b></p>`;
  overlay.appendChild(grid);
  const cont = document.createElement('button');
  cont.className='btn';
  cont.style.marginTop='16px';
  cont.textContent='Continuar';
  cont.addEventListener('click', ()=>{
    overlay.classList.add('hidden');
    overlay.innerHTML='';
    gameState='playing';
    currentRoom.cleared = true;
    revealDoors();
  });
  overlay.appendChild(cont);
  overlay.classList.remove('hidden');
}

// ---------- minimapa ----------
function renderMinimap(){
  if(!minimapEl || !currentRoom) return;
  let html = '';
  const hist = mapHistory.slice(-4);
  hist.forEach(t=>{
    html += `<div class="mm-node">${TYPE_ICON[t]||'•'}</div><div class="mm-line"></div>`;
  });
  html += `<div class="mm-node current">${TYPE_ICON[currentRoom.type]||'•'}</div>`;
  if(currentRoom.doors && currentRoom.doors.length){
    html += '<div class="mm-line"></div><div class="mm-branch">';
    currentRoom.doors.forEach(d=>{
      html += `<div class="mm-node next">${TYPE_ICON[d.nextType]||'?'}</div>`;
    });
    html += '</div>';
  }
  minimapEl.innerHTML = html;
}

// ---------- pausa / guardado (8 huecos) ----------
const SAVE_SLOT_COUNT = 8;
const SAVE_SLOT_PREFIX = 'cripta_descenso_slot_';
function slotKey(i){ return SAVE_SLOT_PREFIX+i; }

function serializeRoom(room){
  if(!room) return null;
  return {
    type: room.type,
    cleared: room.cleared,
    doors: room.doors,
    savedHazards: room.savedHazards || null,
    parentRoom: serializeRoom(room.parentRoom),
  };
}

function serializeCurrentRun(){
  return {
    player: JSON.parse(JSON.stringify(player)),
    coins, coinMult, bossIndex, bossesDefeated, normalKills, infinitoBossCount,
    nextBossKind, bossKindCounts, keysCollected,
    depth, roomsSinceBoss, roomsSinceShop, mapHistory,
    roomsSinceEssenceCoin, nextEssenceCoinAt,
    shopPurchaseCounts,
    currentRoom: serializeRoom(currentRoom),
    enemies: JSON.parse(JSON.stringify(enemies)),
    hazards: JSON.parse(JSON.stringify(hazards)),
    boss: boss ? JSON.parse(JSON.stringify(boss)) : null,
    savedAt: Date.now(),
  };
}

function getSlotSummary(i){
  try{
    const raw = localStorage.getItem(slotKey(i));
    if(!raw) return null;
    const data = JSON.parse(raw);
    return {depth:data.depth, coins:data.coins, bossesDefeated:data.bossesDefeated, savedAt:data.savedAt||null};
  } catch(e){ return null; }
}

function anySlotHasSave(){
  for(let i=1;i<=SAVE_SLOT_COUNT;i++){ if(getSlotSummary(i)) return true; }
  return false;
}

function saveToSlot(i){
  try{
    localStorage.setItem(slotKey(i), JSON.stringify(serializeCurrentRun()));
    return true;
  } catch(e){ console.error('No se pudo guardar la partida', e); return false; }
}

function loadFromSlot(i){
  let data;
  try{
    const raw = localStorage.getItem(slotKey(i));
    if(!raw) return false;
    data = JSON.parse(raw);
  } catch(e){ return false; }
  Object.assign(player, data.player);
  coins=data.coins; coinMult=data.coinMult; bossIndex=data.bossIndex;
  bossesDefeated=data.bossesDefeated; normalKills=data.normalKills; infinitoBossCount=data.infinitoBossCount||0;
  nextBossKind = data.nextBossKind || KINDS[bossIndex % KINDS.length];
  bossKindCounts = data.bossKindCounts || {};
  keysCollected = data.keysCollected || [];
  keyHUDUpdate();
  depth=data.depth; roomsSinceBoss=data.roomsSinceBoss; roomsSinceShop=data.roomsSinceShop;
  mapHistory=data.mapHistory||[];
  roomsSinceEssenceCoin=data.roomsSinceEssenceCoin||0; nextEssenceCoinAt=data.nextEssenceCoinAt||Math.round(rand(8,12));
  shopPurchaseCounts=data.shopPurchaseCounts||{};
  currentRoom = data.currentRoom;
  enemies = data.enemies||[];
  hazards = data.hazards||[];
  boss = data.boss||null;
  // red de seguridad: si una partida guardada antigua o corrupta trae un jefe en la sala 1,
  // se descarta al cargarla en vez de dejar que aparezca
  if(depth<=1 && boss){
    boss = null;
    if(currentRoom) currentRoom.type = 'combat';
  }
  bulletsPlayer=[]; bulletsEnemy=[]; particles=[];
  killnumEl.textContent=bossesDefeated;
  updateCoinHUD(); updateDepthHUD(); updateHearts();
  bossbar.style.display = boss ? 'block':'none';
  zonebar.style.display = (!boss && currentRoom.type==='combat') ? 'block':'none';
  if(boss){
    bossname.textContent = boss.name;
    bosshpinner.style.width = Math.max(0,(boss.hp/boss.maxHp*100))+'%';
  } else if(currentRoom.type==='combat'){
    updateZoneHUD();
  }
  ensureForwardDoor(currentRoom); // por si el hueco se guardó en una sala ya sin salida de avance
  renderMinimap();
  return true;
}

function formatSlotDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const pad = n=>String(n).padStart(2,'0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// mode: 'save' o 'load'. onBack: función a llamar al pulsar "Volver".
function renderSlotList(mode, onBack){
  let rows = '';
  for(let i=1;i<=SAVE_SLOT_COUNT;i++){
    const s = getSlotSummary(i);
    if(s){
      rows += `<div class="slotRow">
        <button class="slotBtn" data-slot="${i}">
          <span class="slotNum">Hueco ${i}</span>
          <span class="slotInfo">Profundidad ${s.depth} · 👑${s.bossesDefeated} · 🪙${s.coins}${s.savedAt?` · ${formatSlotDate(s.savedAt)}`:''}</span>
        </button>
        <button class="slotDelBtn" data-slot="${i}" title="Eliminar este hueco">🗑️</button>
      </div>`;
    } else {
      rows += `<div class="slotRow">
        <button class="slotBtn empty" data-slot="${i}">
          <span class="slotNum">Hueco ${i}</span>
          <span class="slotInfo">${mode==='save' ? 'Vacío — guardar aquí' : 'Vacío'}</span>
        </button>
      </div>`;
    }
  }
  overlay.innerHTML = `<h1 style="font-size:26px;">${mode==='save' ? 'GUARDAR PARTIDA' : 'CARGAR PARTIDA'}</h1>
    <p style="font-size:12px;">${mode==='save' ? 'Elige un hueco. Si ya tiene partida, se te pedirá confirmar antes de sobrescribirlo. También puedes eliminar huecos con 🗑️.' : 'Elige la partida que quieras continuar, o elimínala con 🗑️.'}</p>
    <div class="slotlist">${rows}</div>
    <p id="slotMsg" style="min-height:16px;color:var(--gold);font-size:12px;"></p>
    <button class="btn" id="slotBackBtn">Volver</button>`;
  overlay.classList.remove('hidden');
  document.getElementById('slotBackBtn').addEventListener('click', onBack);
  overlay.querySelectorAll('.slotBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.getAttribute('data-slot'),10);
      if(mode==='save'){
        const isEmpty = btn.classList.contains('empty');
        const doSave = ()=>{
          const ok = saveToSlot(i);
          renderSlotList('save', onBack);
          const m = document.getElementById('slotMsg');
          if(m) m.textContent = ok ? `Guardado en el hueco ${i} ✓` : 'No se pudo guardar en este navegador.';
        };
        if(isEmpty){
          doSave();
        } else {
          const msg = document.getElementById('slotMsg');
          if(msg){
            msg.innerHTML = `Hueco ${i} ya tiene partida. <button class="btn" id="confirmOverwrite" style="display:inline-block;width:auto;padding:4px 12px;margin-left:6px;font-size:11px;">Sobrescribir</button>`;
            const cbtn = document.getElementById('confirmOverwrite');
            if(cbtn) cbtn.addEventListener('click', doSave);
          }
        }
      } else {
        if(btn.classList.contains('empty')) return;
        const ok = loadFromSlot(i);
        if(ok){
          overlay.classList.add('hidden');
          overlay.innerHTML='';
          gameState='playing';
          setAmbientRealm(realmOf(depth).id);
          updateAmbientVolume();
        } else {
          const m = document.getElementById('slotMsg');
          if(m) m.textContent = 'No se pudo cargar esa partida.';
        }
      }
    });
  });
  overlay.querySelectorAll('.slotDelBtn').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const i = parseInt(btn.getAttribute('data-slot'),10);
      const msg = document.getElementById('slotMsg');
      if(msg){
        msg.innerHTML = `¿Eliminar el hueco ${i}? Esta acción no se puede deshacer. <button class="btn" id="confirmDelete" style="display:inline-block;width:auto;padding:4px 12px;margin-left:6px;font-size:11px;border-color:var(--blood);color:#ffb3b3;">Eliminar</button>`;
        const cbtn = document.getElementById('confirmDelete');
        if(cbtn) cbtn.addEventListener('click', ()=>{
          try{ localStorage.removeItem(slotKey(i)); }catch(e){}
          renderSlotList(mode, onBack);
        });
      }
    });
  });
}

function togglePause(){
  if(gameState==='playing') openPauseMenu();
  else if(gameState==='paused') resumeGame();
}

function openPauseMenu(){
  gameState='paused';
  renderPauseMenu(false);
  overlay.classList.remove('hidden');
  updateAmbientVolume();
}

function renderPauseMenu(confirmingNew){
  overlay.innerHTML = `<h1 style="font-size:30px;">PAUSA</h1>
    <p>Profundidad ${depth} · ${bossesDefeated} jefe(s) derrotados · 🪙 ${coins}</p>
    <div class="stackbtns">
      <button class="btn" id="resumeBtn">Continuar</button>

      <button class="btn" id="loadBtn">Cargar partida</button>
      <button class="btn" id="settingsFromPauseBtn">Ajustes</button>

        <button class="btn" id="confirmNewBtn" style="border-color:var(--blood);color:#ffb3b3;">Sí, empezar de nuevo</button>

      ` : `<button class="btn" id="newRunFromPauseBtn" style="border-color:var(--blood);color:#ffb3b3;">Nueva partida</button>`}
    </div>`;
  document.getElementById('resumeBtn').addEventListener('click', resumeGame);

  document.getElementById('loadBtn').addEventListener('click', ()=>renderSlotList('load', ()=>renderPauseMenu(false)));
  document.getElementById('settingsFromPauseBtn').addEventListener('click', ()=>renderSettingsScreen(()=>renderPauseMenu(false)));
  if(confirmingNew){
    document.getElementById('confirmNewBtn').addEventListener('click', ()=>{
      overlay.classList.add('hidden');
      overlay.innerHTML='';
      startFullRun();
    });
    document.getElementById('cancelNewBtn').addEventListener('click', ()=>renderPauseMenu(false));

    document.getElementById('newRunFromPauseBtn').addEventListener('click', ()=>renderPauseMenu(true));

// se gana al final de cada partida (aunque mueras) según lo lejos que llegaste, se guarda en el
// dispositivo y se gasta en mejoras pequeñas y permanentes para todas las partidas futuras.
const META_KEY = 'cripta_meta_v1';
const META_UPGRADES = [
  {id:'vida',     name:'Vitalidad',         icon:'❤️', desc:'+1 corazón de vida máxima al empezar la partida.', maxLevel:5, baseCost:22, costStep:20},
  {id:'monedas',  name:'Bolsillos Grandes',  icon:'🪙', desc:'+15% monedas ganadas durante toda la partida.',    maxLevel:4, baseCost:20, costStep:18},
  {id:'reflejos', name:'Reflejos',          icon:'💨', desc:'-8% tiempo de reutilización de la esquiva.',       maxLevel:4, baseCost:18, costStep:16},
  {id:'fortuna',  name:'Fortuna Inicial',   icon:'✨', desc:'+15 monedas nada más empezar la partida.',         maxLevel:4, baseCost:14, costStep:12},
];
function loadMeta(){
  try{
    const raw = localStorage.getItem(META_KEY);
    if(raw){
      const d = JSON.parse(raw);
      return {
        essence:d.essence||0, levels:d.levels||{},
        bestDepth:d.bestDepth||0, bestBosses:d.bestBosses||0, totalRuns:d.totalRuns||0,
        achievements:d.achievements||{}, infinitoKindsSeen:d.infinitoKindsSeen||{},
        activePact:d.activePact||null,
      };
    }
  }catch(e){}
  return {essence:0, levels:{}, bestDepth:0, bestBosses:0, totalRuns:0, achievements:{}, infinitoKindsSeen:{}, activePact:null};
}
function saveMeta(){ try{ localStorage.setItem(META_KEY, JSON.stringify(meta)); }catch(e){} }
let meta = loadMeta();
function metaLevel(id){ return meta.levels[id]||0; }
function metaUpgradeCost(u){ return u.baseCost + u.costStep*metaLevel(u.id); }

// ---------- logros ----------
// se comprueban en puntos concretos del código (ver unlockAchievement) y quedan guardados para
// siempre; algunos desbloquean cosméticos exclusivos (ver SKIN_COLORS/SKIN_SHAPES: locked)
// ---------- pactos: modificadores opcionales para variar partidas una vez ya tienes de todo ----------
// sólo puede haber uno activo (o ninguno); se elige desde la pantalla de inicio y se guarda
const PACTS = [

  {id:'vacio', name:'Pacto del Vacío', icon:'🌀',
   desc:'Las salas pueden tener hasta 2 enemigos más. A cambio, empiezas la partida con un poder extra a elegir entre 3.'},

function activePact(){ return PACTS.find(p=>p.id===meta.activePact) || null; }

  overlay.innerHTML = `<h1 style="font-size:26px;">PACTOS</h1>
    <p>Activa como mucho un pacto para variar tus partidas: cambia el reto a cambio de una recompensa distinta. Se puede desactivar cuando quieras.</p>

      return `<div class="metaRow">

            <div class="metaName">${p.name}</div>

const ACHIEVEMENTS = [
  {id:'primer_jefe',       name:'Primera Sangre',    icon:'🗡️', desc:'Derrota a tu primer jefe.'},
  {id:'sala_51',           name:'La Superficie',     icon:'🌾', desc:'Alcanza la Superficie (sala 51).'},
  {id:'sala_101',          name:'El Cielo',          icon:'☁️', desc:'Alcanza el Cielo (sala 101).'},
  {id:'sala_151',          name:'Más Allá',          icon:'✨', desc:'Alcanza el Más Allá (sala 151). Desbloquea la piel Ónix.'},
  {id:'maestro_mas_alla',  name:'Maestro del Vacío', icon:'👑', desc:'Derrota a los 20 jefes distintos del Más Allá (no hace falta que sea en la misma partida). Desbloquea la forma Corona.'},
  {id:'centinela_final',   name:'El Nexo',           icon:'🌀', desc:'Derrota al jefe secreto que aparece al completar un ciclo completo de los 20 jefes del Más Allá.'},

function unlockAchievement(id){
  if(meta.achievements[id]) return; // ya lo tenía, no repetir el aviso
  meta.achievements[id] = true;
  saveMeta();
  const ach = ACHIEVEMENTS.find(a=>a.id===id);
  if(ach) spawnFloatText(player.x, player.y-60, `🏆 LOGRO: ${ach.name}`, '#ffcf5c');
}
function isCosmeticUnlocked(entry){ return !entry.locked || !!meta.achievements[entry.locked]; }
function awardEssence(){
  // se ha reducido a propósito: conseguir esencia para las mejoras permanentes debe costar
  // bastante más que antes, así que se gana bastante más despacio por profundidad y por jefe
  let earned = Math.max(1, Math.round(depth*0.28) + bossesDefeated*1.4);
  meta.essence += earned;
  saveMeta();
  return earned;
}
function renderMetaScreen(onBack){
  overlay.innerHTML = `<h1 style="font-size:26px;">MEJORAS PERMANENTES</h1>
    <p>Se pagan con esencia — se gana al final de cada partida según lo lejos que llegues, y se queda contigo aunque mueras. Esencia: <b style="color:var(--accent)">✨ ${meta.essence}</b></p>
    <div class="settingsBlock" id="metaList"></div>
    <div class="stackbtns">
      <button class="btn" id="metaBackBtn">Volver</button>
    </div>`;
  overlay.classList.remove('hidden');
  renderMetaList();
  document.getElementById('metaBackBtn').addEventListener('click', onBack);
}
function renderMetaList(){
  const list = document.getElementById('metaList');
  if(!list) return;
  list.innerHTML = META_UPGRADES.map(u=>{
    const lvl = metaLevel(u.id);
    const maxed = lvl>=u.maxLevel;
    const cost = metaUpgradeCost(u);
    return `<div class="metaRow">
      <div class="metaInfo">
        <span class="metaIcon">${u.icon}</span>
        <div>
          <div class="metaName">${u.name} <span style="color:var(--ink-dim);font-weight:normal;">(${lvl}/${u.maxLevel})</span></div>
          <div class="metaDesc">${u.desc}</div>
        </div>
      </div>
      <button class="btn metaBuyBtn" data-upg="${u.id}" ${maxed || meta.essence<cost ? 'disabled' : ''}>${maxed ? 'Máximo' : '✨'+cost}</button>
    </div>`;
  }).join('');
  list.querySelectorAll('.metaBuyBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-upg');
      const u = META_UPGRADES.find(x=>x.id===id);
      const cost = metaUpgradeCost(u);
      if(meta.essence<cost || metaLevel(id)>=u.maxLevel) return;
      meta.essence -= cost;
      meta.levels[id] = metaLevel(id)+1;
      saveMeta();
      playSfx('coin');
      renderMetaList();
    });
  });
}

function gameOver(){
  gameState='dead';
  updateAmbientVolume();
  bossbar.style.display='none';
  zonebar.style.display='none';
  // el jefe (si te mató uno) no se borraba al morir y seguía "vivo" en memoria: se veía y
  // atacaba de nuevo en la sala 1 al reintentar. Limpiar aquí es lo que lo evita de raíz.
  boss = null;
  enemies = [];
  bulletsEnemy = [];
  hazards = [];
  meta.totalRuns = (meta.totalRuns||0) + 1;
  if(depth>meta.bestDepth) meta.bestDepth = depth;
  if(bossesDefeated>meta.bestBosses) meta.bestBosses = bossesDefeated;
  saveMeta();
  const earned = awardEssence();
  overlay.innerHTML = `<h1 style="color:var(--blood);text-shadow:0 0 18px rgba(255,77,94,.6);">HAS CAÍDO</h1>
    <p>Llegaste a la profundidad ${depth} y derrotaste a ${bossesDefeated} jefe(s), venciendo a ${normalKills} enemigos.<br>La cripta te reclama... por ahora.<br>Ganaste <b style="color:var(--accent)">✨ ${earned}</b> de esencia para mejoras permanentes.</p>
    <div class="stackbtns">
      <button class="btn" id="retryBtn">Reintentar</button>
      <button class="btn" id="metaFromDeathBtn">Mejoras permanentes</button>
    </div>`;
  overlay.classList.remove('hidden');
  document.getElementById('retryBtn').addEventListener('click', startFullRun);
  document.getElementById('metaFromDeathBtn').addEventListener('click', ()=>renderMetaScreen(()=>gameOver()));
}

function startFullRun(){
  player.x=W/2; player.y=H-140;
  player.maxHp=6; player.hp=6; player.damage=1; player.fireRate=16;
  player.bulletSpeed=7; player.bulletRange=230; player.multishot=0; player.pierce=0; player.lifesteal=0;
  player.homing=0; player.bulletSizeMul=1; player.explosive=false;
  player.shieldMax=0; player.shield=0; player.speed=3.1; player.dashCooldownMax=70;
  player.bloomMax=0.5; player.hasRevive=false;
  bossIndex=0; bossesDefeated=0; normalKills=0; killnumEl.textContent=0; infinitoBossCount=0;
  bossKindCounts = {}; nextBossKind = KINDS[0];
  keysCollected = []; keyHUDUpdate();
  coins=0; coinMult=1; shopPurchaseCounts={};
  // mejoras permanentes compradas con esencia: se aplican a cada partida nueva
  player.maxHp += metaLevel('vida')*2; player.hp = player.maxHp;
  coinMult = 1 + metaLevel('monedas')*0.15;
  player.dashCooldownMax = Math.round(player.dashCooldownMax * (1 - metaLevel('reflejos')*0.08));
  coins += metaLevel('fortuna')*15;
  // pacto activo (opcional): ver PACTS/activePact — cambia el reto de la partida
  const pact = activePact();
  if(pact?.id==='fragil'){ player.maxHp = Math.max(2, player.maxHp-1); player.hp = player.maxHp; coinMult *= 1.25; }
  if(pact?.id==='fuerza'){ coinMult *= 1.4; } // Pacto de Fuerza: +40% monedas (se pierden si mueres, no farmeable como la esencia)
  depth=1; roomsSinceBoss=0; roomsSinceShop=0; mapHistory=[];
  roomsSinceEssenceCoin=0; nextEssenceCoinAt=Math.round(rand(8,12));
  bulletsPlayer=[]; bulletsEnemy=[]; particles=[]; enemies=[]; hazards=[];
  updateCoinHUD();
  overlay.classList.add('hidden');
  overlay.innerHTML='';
  gameState='playing';
  enterRoom('combat');
  setAmbientRealm(realmOf(depth).id);
  updateAmbientVolume();
  // Pacto del Vacío: regalo de un poder extra al empezar, a cambio del reto de más enemigos por sala
  if(pact?.id==='vacio'){ gameState='choosing'; openPactVoidBonus(); }
}

// ---------- controles táctiles (joystick + botones) ----------
let touchMove = {x:0, y:0, active:false};
let touchFiring = false;
let touchDash = false;
let joyTouchId = null;

function joyResetVisual(){
  joyKnob.style.transform = 'translate(-50%,-50%)';
}
function updateJoyFromTouch(t){
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
  let dx = t.clientX-cx, dy = t.clientY-cy;
  const d = Math.hypot(dx,dy);
  const maxD = rect.width/2;
  if(d>maxD){ dx = dx/d*maxD; dy = dy/d*maxD; }
  touchMove.x = dx/maxD; touchMove.y = dy/maxD; touchMove.active = true;
  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
joyBase.addEventListener('touchstart', e=>{
  if(repositioning) return;
  e.preventDefault();
  ensureAudio();
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  updateJoyFromTouch(t);
}, {passive:false});
joyBase.addEventListener('touchmove', e=>{
  if(repositioning) return;
  for(const t of e.changedTouches){ if(t.identifier===joyTouchId){ e.preventDefault(); updateJoyFromTouch(t); } }
}, {passive:false});
function joyEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier===joyTouchId){ joyTouchId=null; touchMove.x=0; touchMove.y=0; touchMove.active=false; joyResetVisual(); }
  }
}
joyBase.addEventListener('touchend', joyEnd);
joyBase.addEventListener('touchcancel', joyEnd);

fireBtnTouch.addEventListener('touchstart', e=>{ if(repositioning) return; e.preventDefault(); ensureAudio(); touchFiring=true; fireBtnTouch.classList.add('active'); }, {passive:false});

fireBtnTouch.addEventListener('touchcancel', ()=>{ touchFiring=false; fireBtnTouch.classList.remove('active'); });
