<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CRIPTA — Descenso</title>
<style>
  :root{
    --bg-deep:#050b0d;
    --bg-floor:#0c1a1a;
    --wall:#123634;
    --accent:#5cf0c2;
    --accent-dim:#2c8a70;
    --blood:#ff4d5e;
    --gold:#ffcf5c;
    --ink:#e4f5ef;
    --ink-dim:#7fa39a;
    --shield:#4dd3ff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:var(--bg-deep);
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    color:var(--ink);
    user-select:none;
    touch-action:none;
    overscroll-behavior:none;
  }
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;background:var(--bg-floor);image-rendering:pixelated;box-shadow:0 0 0 4px var(--wall), 0 0 70px rgba(0,0,0,0.85) inset;cursor:crosshair;
    max-width:100vw;max-height:100vh;width:auto;height:auto;touch-action:none;}

  #hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:14px;}
  #hearts{display:flex;gap:6px;align-items:center;}
  .heart{width:22px;height:20px;position:relative;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6));}
  .heart svg{width:100%;height:100%;}

  #zonebar,#bossbar{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:min(64%,540px);text-align:center;}
  #zonename,#bossname{letter-spacing:3px;text-transform:uppercase;font-size:12px;color:var(--ink-dim);margin-bottom:4px;text-shadow:0 1px 2px #000;}
  #bossname{color:#ffb3b3;}
  #bosshpouter{height:12px;border:2px solid var(--wall);background:#000;border-radius:3px;overflow:hidden;box-shadow:0 0 10px rgba(0,0,0,.6);}
  #bosshpinner{height:100%;width:100%;background:linear-gradient(90deg,var(--blood),#ff8a6b);transition:width .15s ease;}

  #hudright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  #killcount{color:var(--ink-dim);font-size:12px;text-align:right;letter-spacing:1px;}
  #killcount b{color:var(--gold);font-size:16px;}
  #coincount{color:var(--gold);font-size:14px;text-align:right;letter-spacing:1px;}
  #coincount b{font-size:16px;}
  #levelbar{position:absolute;top:14px;left:14px;right:14px;text-align:center;font-size:11px;letter-spacing:3px;color:var(--ink-dim);pointer-events:none;text-shadow:0 1px 2px #000;}
  #levelbar b{color:var(--accent);}

  #minimap{position:absolute;left:14px;bottom:40px;display:flex;align-items:center;gap:3px;background:rgba(8,14,14,0.6);border:1px solid var(--wall);border-radius:8px;padding:6px 8px;pointer-events:none;max-width:220px;flex-wrap:wrap;}

  #pauseBtn{position:absolute;top:104px;right:14px;width:32px;height:32px;border-radius:50%;
    background:rgba(8,14,14,0.6);border:1px solid var(--wall);color:var(--ink-dim);font-size:14px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;}
  #pauseBtn:hover{border-color:var(--accent);color:var(--accent);}
  #settingsBtn{position:absolute;top:104px;right:54px;width:32px;height:32px;border-radius:50%;
    background:rgba(8,14,14,0.6);border:1px solid var(--wall);color:var(--ink-dim);font-size:14px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;}
  #settingsBtn:hover{border-color:var(--accent);color:var(--accent);}

  /* ---- controles táctiles: sólo visibles en móvil (ver clase touch-mode en <body>) ---- */
  #touchControls{display:none;position:absolute;inset:0;pointer-events:none;z-index:6;}
  body.touch-mode #touchControls{display:block;}
  body.touch-mode #controls-hint{display:none;}
  .tc-joystick{position:absolute;left:18px;bottom:20px;width:92px;height:92px;border-radius:50%;
    background:rgba(15,26,24,0.55);border:2px solid var(--wall);pointer-events:auto;touch-action:none;
    display:flex;align-items:center;justify-content:center;}
  .tc-joystick .tc-mark{position:absolute;font-size:20px;opacity:0.22;pointer-events:none;}
  .tc-knob{position:absolute;left:50%;top:50%;width:38px;height:38px;border-radius:50%;
    background:rgba(92,240,194,0.35);border:2px solid var(--accent);transform:translate(-50%,-50%);
    pointer-events:none;transition:background .1s;}
  .tc-btn{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;user-select:none;
    display:flex;align-items:center;justify-content:center;color:var(--ink);background:rgba(15,26,24,0.55);}
  .tc-fire{right:18px;bottom:24px;width:60px;height:60px;border:2px solid #ff6b5c;color:#ffb3ab;}
  .tc-fire canvas{width:28px;height:28px;}
  .tc-fire.active,.tc-dash.active{background:rgba(255,107,92,0.35);}
  /* la esquiva es el botón más pequeño, colocado debajo a la izquierda del de disparo */
  .tc-dash{right:82px;bottom:8px;width:38px;height:38px;font-size:15px;border:2px solid var(--gold);color:var(--gold);}
  .tc-dash.active{background:rgba(255,207,92,0.35);}

  /* ---- modo "reorganizar controles": resalta joystick/botones para arrastrarlos donde se quiera ---- */
  body.repositioning .tc-joystick,
  body.repositioning .tc-fire,
  body.repositioning .tc-dash{outline:2px dashed var(--gold);outline-offset:4px;touch-action:none;}
  .tc-resize-handle{display:none;position:absolute;width:14px;height:14px;border-radius:50%;
    background:var(--gold);border:2px solid #1a1410;pointer-events:none;z-index:8;touch-action:none;}
  body.repositioning .tc-resize-handle{display:block;pointer-events:auto;}
  #repositionBar{display:none;position:absolute;top:14px;left:50%;transform:translateX(-50%);
    z-index:20;background:rgba(8,14,14,0.9);border:1px solid var(--wall);border-radius:10px;
    padding:10px 14px;text-align:center;max-width:88vw;}
  body.repositioning #repositionBar{display:block;}
  #repositionHint{font-size:12px;color:var(--ink-dim);margin-bottom:8px;}
  #repositionBtns{display:flex;gap:8px;justify-content:center;}
  #repositionBtns .btn{padding:6px 14px;font-size:12px;letter-spacing:1px;}

  .stackbtns{display:flex;flex-direction:column;gap:12px;align-items:stretch;width:220px;}
  .stackbtns .btn{width:100%;}

  .settingsBlock{display:flex;flex-direction:column;gap:6px;width:280px;max-width:88vw;margin:6px 0 18px;text-align:left;}
  .settingLabel{font-size:13px;color:var(--ink-dim);display:flex;justify-content:space-between;}
  .settingSlider{width:100%;accent-color:var(--accent);}

  .skinGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:2px 2px 8px;}
  .skinCard{display:flex;flex-direction:column;align-items:center;gap:4px;width:auto;
    background:rgba(20,32,30,0.7);border:2px solid var(--wall);border-radius:8px;padding:6px 4px;
    color:var(--ink-dim);font-family:inherit;font-size:10px;cursor:pointer;transition:border-color .15s,background .15s;}
  .skinCard:hover{border-color:var(--accent-dim);}
  .skinCard.selected{border-color:var(--accent);background:rgba(30,50,46,0.85);color:var(--ink);box-shadow:0 0 10px rgba(92,240,194,.3);}
  .skinCard.locked{opacity:0.45;cursor:not-allowed;filter:grayscale(0.6);}
  .skinCard.locked:hover{border-color:var(--wall);}
  .skinPreview{width:100%;height:auto;aspect-ratio:1/1;max-width:52px;}
  .skinName{letter-spacing:.5px;font-size:9px;text-align:center;}

  .metaRow{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(20,32,30,0.7);border:1px solid var(--wall);border-radius:8px;padding:8px 10px;}
  .metaInfo{display:flex;align-items:center;gap:10px;text-align:left;}
  .metaIcon{font-size:20px;}
  .metaName{font-size:13px;color:var(--ink);}
  .metaDesc{font-size:11px;color:var(--ink-dim);}
  .metaBuyBtn{width:auto;min-width:64px;padding:8px 10px;font-size:12px;flex-shrink:0;}
  .metaBuyBtn:disabled{opacity:.4;cursor:default;}

  .slotRow{display:flex;gap:6px;}
  .slotRow .slotBtn{flex:1;}
  .slotDelBtn{flex-shrink:0;width:42px;border-radius:8px;border:1px solid var(--wall);
    background:rgba(60,20,20,0.45);color:#ffb3b3;cursor:pointer;font-size:15px;}
  .slotDelBtn:hover{border-color:var(--blood);}

  .slotlist{display:flex;flex-direction:column;gap:8px;width:320px;max-width:86vw;max-height:44vh;overflow-y:auto;margin:10px 0;padding-right:4px;}
  .slotBtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
    background:rgba(20,32,30,0.7);border:1px solid var(--wall);border-radius:8px;padding:10px 14px;
    color:var(--ink);font-family:inherit;cursor:pointer;transition:border-color .15s,background .15s;}
  .slotBtn:hover{border-color:var(--accent);background:rgba(30,50,46,0.85);}
  .slotBtn.empty{color:var(--ink-dim);border-style:dashed;}
  .slotNum{font-weight:bold;font-size:13px;letter-spacing:.03em;color:var(--accent);}
  .slotBtn.empty .slotNum{color:var(--ink-dim);}
  .slotInfo{font-size:11px;color:var(--ink-dim);}
  .mm-node{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;background:#182a28;border:1px solid var(--wall);flex-shrink:0;}
  .mm-node.current{background:var(--accent);color:#08201a;border-color:var(--accent);box-shadow:0 0 8px rgba(92,240,194,.7);}
  .mm-node.next{opacity:.7;border-style:dashed;}
  .mm-line{width:7px;height:2px;background:var(--wall);flex-shrink:0;}
  .mm-branch{display:flex;flex-direction:column;gap:2px;}

  #shopgrid{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:720px;max-height:56vh;overflow-y:auto;padding:6px;}
  .shopcard{
    width:170px;background:linear-gradient(180deg,#122522,#0a1614);
    border:2px solid var(--wall);border-radius:10px;padding:14px;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;
  }
  .shopcard .icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:radial-gradient(circle,#1c3835,#0a1614);border:2px solid var(--accent-dim);}
  .shopcard .name{font-size:13px;letter-spacing:1px;color:var(--accent);text-transform:uppercase;}
  .shopcard .desc{font-size:11px;color:var(--ink-dim);line-height:1.4;min-height:44px;}
  .shopcard .buybtn{
    background:linear-gradient(180deg,#1c3835,#0a1614);border:2px solid var(--gold);color:var(--gold);
    padding:6px 14px;font-size:12px;border-radius:6px;cursor:pointer;letter-spacing:1px;
  }
  .shopcard .buybtn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--wall);color:var(--ink-dim);}
  .shopcard .buybtn:not(:disabled):hover{box-shadow:0 0 10px rgba(255,207,92,.5);}

  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at 50% 40%, rgba(10,20,20,.92), rgba(3,6,8,.98));text-align:center;padding:20px;overflow-y:auto;touch-action:pan-y;}
  #overlay.hidden{display:none;}
  #overlay h1{font-size:42px;letter-spacing:6px;margin:0 0 6px;color:var(--accent);text-shadow:0 0 18px rgba(92,240,194,.5);}
  #overlay p{color:var(--ink-dim);max-width:520px;line-height:1.5;font-size:14px;margin:6px 0 22px;}
  .btn{
    background:linear-gradient(180deg,#1c3835,#0a1614);
    border:2px solid var(--accent-dim);color:var(--accent);
    padding:12px 28px;font-size:15px;letter-spacing:2px;border-radius:6px;cursor:pointer;
    text-transform:uppercase;transition:.15s;
  }
  .btn:hover{border-color:var(--accent);box-shadow:0 0 16px rgba(92,240,194,.4);transform:translateY(-1px);}

  #cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:900px;}
  .card{
    width:190px;min-height:230px;background:linear-gradient(180deg,#122522,#0a1614);
    border:2px solid var(--wall);border-radius:10px;padding:16px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
    transition:.15s;
  }
  .card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 20px rgba(92,240,194,.25);}
  .card .icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;background:radial-gradient(circle,#1c3835,#0a1614);border:2px solid var(--accent-dim);}
  .card .name{font-size:14px;letter-spacing:1px;color:var(--accent);text-transform:uppercase;}
  .card .desc{font-size:12px;color:var(--ink-dim);line-height:1.4;}

  #controls-hint{position:absolute;bottom:12px;left:14px;font-size:11px;color:var(--ink-dim);letter-spacing:1px;pointer-events:none;}
  #dashbar{position:absolute;bottom:14px;right:14px;width:120px;text-align:right;font-size:11px;color:var(--ink-dim);}
  #dashouter{height:6px;background:#000;border:1px solid var(--wall);border-radius:3px;overflow:hidden;margin-top:4px;}
  #dashinner{height:100%;width:100%;background:var(--shield);}

  #floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="600"></canvas>

  <div id="hud">
    <div id="hearts"></div>
    <div id="hudright">
      <div id="coincount">🪙 <b id="coinnum">0</b></div>
      <div id="keycount">🔑 <b id="keynum">0</b></div>
      <div id="killcount">JEFES CAÍDOS<br><b id="killnum">0</b></div>
    </div>
  </div>

  <div id="levelbar">PROFUNDIDAD <b id="levelnum">1</b></div>

  <div id="zonebar" style="display:none;">
    <div id="zonename">ZONA</div>
  </div>

  <div id="bossbar" style="display:none;">
    <div id="bossname">???</div>
    <div id="bosshpouter"><div id="bosshpinner"></div></div>
  </div>

  <div id="minimap"></div>

  <button id="settingsBtn" title="Ajustes">⚙️</button>
  <button id="pauseBtn" title="Pausa">⏸</button>

  <div id="controls-hint">WASD mover · CLICK IZQ disparar · ESPACIO esquiva · ESC pausa</div>
  <div id="dashbar">ESQUIVA<div id="dashouter"><div id="dashinner"></div></div></div>

  <div id="touchControls">
    <div id="joystickBase" class="tc-joystick">
      <span class="tc-mark">🕹️</span>
      <div id="joystickKnob" class="tc-knob"></div>
    </div>
    <button id="dashBtnTouch" class="tc-btn tc-dash" title="Esquivar">💨</button>
    <button id="fireBtnTouch" class="tc-btn tc-fire" title="Disparar">
      <canvas id="picoIconCanvas" width="40" height="40"></canvas>
    </button>
  </div>

  <div id="repositionBar">
    <div id="repositionHint">Arrastra el joystick y los botones donde quieras · el punto dorado cambia el tamaño</div>
    <div id="repositionBtns">
      <button class="btn" id="repositionResetBtn">Restablecer</button>
      <button class="btn" id="repositionDoneBtn">Listo</button>
    </div>
  </div>

  <div id="overlay"></div>

  <div id="floaters"></div>
</div>

<script>
(function(){
"use strict";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const ROOM = {x:40,y:40,w:W-80,h:H-80};

const overlay = document.getElementById('overlay');
const bossbar = document.getElementById('bossbar');
const bossname = document.getElementById('bossname');
const bosshpinner = document.getElementById('bosshpinner');
const zonebar = document.getElementById('zonebar');
const zonenameEl = document.getElementById('zonename');
const heartsEl = document.getElementById('hearts');
const killnumEl = document.getElementById('killnum');
const dashinner = document.getElementById('dashinner');
const floaters = document.getElementById('floaters');
const coinnumEl = document.getElementById('coinnum');
const keynumEl = document.getElementById('keynum');
const levelnumEl = document.getElementById('levelnum');
const minimapEl = document.getElementById('minimap');
const pauseBtn = document.getElementById('pauseBtn');
const settingsBtn = document.getElementById('settingsBtn');
const touchControls = document.getElementById('touchControls');
const joyBase = document.getElementById('joystickBase');
const joyKnob = document.getElementById('joystickKnob');
const fireBtnTouch = document.getElementById('fireBtnTouch');
const dashBtnTouch = document.getElementById('dashBtnTouch');

// ---------- ajustes (volumen / sensibilidad) ----------
// los mismos 5 colores y las mismas 5 formas de siempre, pero ahora desacoplados: cada color
// se puede combinar con cualquier forma en vez de venir siempre emparejados igual.
const SKIN_COLORS = [
  {id:'esmeralda', name:'Esmeralda', icon:'🟢', body:'#5cf0c2', dark:'#0a1614', accent:'#2c8a70'},
  {id:'escarlata', name:'Escarlata', icon:'🔴', body:'#ff5d5d', dark:'#2a0a0a', accent:'#ff8a6b'},
  {id:'dorado',    name:'Dorado',    icon:'🟡', body:'#ffcf5c', dark:'#3a2a05', accent:'#fff3c9'},
  {id:'sombra',    name:'Sombra',    icon:'🟣', body:'#8a3ffc', dark:'#1c0a30', accent:'#c9a8ff'},
  {id:'hielo',     name:'Hielo',     icon:'🔵', body:'#4dd3ff', dark:'#062633', accent:'#bdf3ff'},
  {id:'blanco',    name:'Blanco',    icon:'⚪', body:'#f0f5f4', dark:'#3a4442', accent:'#ffffff'},
  {id:'coral',     name:'Coral',     icon:'🟠', body:'#ff8f5c', dark:'#331505', accent:'#ffd0b0'},
  {id:'plata',     name:'Plata',     icon:'⚙️', body:'#c9d6dc', dark:'#23282a', accent:'#ffffff'},
  // color exclusivo: se desbloquea con un logro (ver ACHIEVEMENTS/isCosmeticUnlocked), aparece
  // aparte en el selector con un candado hasta entonces
  {id:'onix',      name:'Ónix',      icon:'⚫', body:'#232228', dark:'#000000', accent:'#8a8aa0', locked:'sala_151'},
];
const SKIN_SHAPES = [
  {shape:'plain',   label:'Liso',      desc:'El diseño original, sin adornos.'},
  {shape:'spiked',  label:'Cuernos',   desc:'Cuernos curvos hacia atrás y grietas incandescentes.'},
  {shape:'plated',  label:'Sol',       desc:'Aureola de rayos triangulares, como un sol.'},
  {shape:'crystal', label:'Cristal',   desc:'Cuerpo facetado con un cristal que apunta al frente.'},
  {shape:'wispy',   label:'Fantasma',  desc:'Silueta translúcida y alargada, envuelta en niebla.'},
  {shape:'scaled',  label:'Escamas',   desc:'Cuerpo cubierto de escamas superpuestas, como una armadura orgánica.'},
  {shape:'halo',    label:'Halo',      desc:'Un anillo orbital inclinado rodea el cuerpo, como un planeta con anillos.'},
  {shape:'orbit',   label:'Satélites', desc:'Tres motas de energía orbitan alrededor del cuerpo sin parar.'},
  // forma exclusiva: se desbloquea con un logro, igual que el color Ónix
  {shape:'corona',  label:'Corona',    desc:'Una corona espectral flota sobre el cuerpo: la marca de quien ha vencido a los veinte guardianes del Más Allá.', locked:'maestro_mas_alla'},
];
// combinaciones "nativas": las 5 parejas color+forma que ya existían, conservan su id e icono de
// siempre para no romper partidas guardadas ni ajustes previos.
const NATIVE_SKIN_PAIRS = {esmeralda:'plain', escarlata:'spiked', dorado:'plated', sombra:'wispy', hielo:'crystal'};
const CHARACTER_SKINS = [];
for(const c of SKIN_COLORS){
  for(const s of SKIN_SHAPES){
    const native = NATIVE_SKIN_PAIRS[c.id]===s.shape;
    CHARACTER_SKINS.push({
      id: native ? c.id : `${c.id}_${s.shape}`,
      name: s.shape==='plain' ? c.name : `${c.name} ${s.label}`,
      icon: c.icon,
      desc: s.desc,
      body: c.body, dark: c.dark, accent: c.accent,
      shape: s.shape,
      colorId: c.id, shapeId: s.shape,
    });
  }
}
function currentSkin(){
  return CHARACTER_SKINS.find(s=>s.colorId===settings.skinColor && s.shapeId===settings.skinShape) || CHARACTER_SKINS[0];
}

// ---------- proyectiles del jugador: color y forma elegibles por separado, igual que la piel ----------
const BULLET_COLORS = [
  {id:'blanco',    name:'Blanco',    color:'#e4f5ef', glow:'#ffffff'},
  {id:'esmeralda', name:'Esmeralda', color:'#5cf0c2', glow:'#bdfff0'},
  {id:'escarlata', name:'Escarlata', color:'#ff5d5d', glow:'#ffb3ab'},
  {id:'dorado',    name:'Dorado',    color:'#ffcf5c', glow:'#fff3c9'},
  {id:'sombra',    name:'Sombra',    color:'#a86bff', glow:'#c9a8ff'},
  {id:'hielo',     name:'Hielo',     color:'#4dd3ff', glow:'#bdf3ff'},
  {id:'coral',     name:'Coral',     color:'#ff8f5c', glow:'#ffd0b0'},
  {id:'plata',     name:'Plata',     color:'#c9d6dc', glow:'#ffffff'},
];
const BULLET_SHAPES = [
  {id:'circulo',   name:'Círculo',   shape:'circle'},
  {id:'diamante',  name:'Diamante',  shape:'diamond'},
  {id:'estrella',  name:'Estrella',  shape:'star'},
  {id:'dardo',     name:'Dardo',     shape:'dart'},
  {id:'triangulo', name:'Triángulo', shape:'triangle'},
  {id:'anillo',    name:'Anillo',    shape:'ring'},
  {id:'cruz',      name:'Cruz',      shape:'cross'},
  {id:'rayo',      name:'Rayo',      shape:'bolt'},
];
function currentBulletColor(){
  return BULLET_COLORS.find(c=>c.id===settings.bulletColor) || BULLET_COLORS[0];
}

  picoColor:'escarlata', picoShape:'pico',
  touchLayout: JSON.parse(JSON.stringify(DEFAULT_TOUCH_LAYOUT))};
function validTouchPos(p){ return p && typeof p.x==='number' && typeof p.y==='number'; }
function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(typeof d.volume==='number') settings.volume = clamp(d.volume,0,1);
      if(typeof d.sensitivity==='number') settings.sensitivity = clamp(d.sensitivity,0.5,2);
      // partidas/ajustes guardados antes de separar color y forma: traducimos el id combinado

      if(typeof d.skinShape==='string' && SKIN_SHAPES.some(s=>s.shape===d.skinShape)) settings.skinShape = d.skinShape;

      if(typeof d.picoColor==='string' && BULLET_COLORS.some(c=>c.id===d.picoColor)) settings.picoColor = d.picoColor;
      if(typeof d.picoShape==='string' && PICO_SHAPES.some(s=>s.id===d.picoShape)) settings.picoShape = d.picoShape;
      if(d.touchLayout && typeof d.touchLayout==='object'){

              scale: typeof d.touchLayout[key].scale==='number' ? clamp(d.touchLayout[key].scale,0.6,1.8) : 1,

// ---------- sonido (síntesis simple, sin archivos externos) ----------
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  } else if(audioCtx.state==='suspended'){
    audioCtx.resume();
  }
}
function playSfx(type){
  if(settings.volume<=0) return;
  ensureAudio();
  if(!audioCtx) return;
  try{
    const t0 = audioCtx.currentTime;
    const gain = audioCtx.createGain();
    const osc = audioCtx.createOscillator();
    let freq=440, dur=0.07, wave='sine', vol=0.5;
    switch(type){
      case 'shoot': freq=760; dur=0.045; wave='square'; vol=0.22; break;
      case 'hit': freq=190; dur=0.08; wave='sawtooth'; vol=0.3; break;
      case 'hurt': freq=140; dur=0.15; wave='sawtooth'; vol=0.4; break;
      case 'coin': freq=1050; dur=0.08; wave='triangle'; vol=0.28; break;
      case 'dash': freq=520; dur=0.07; wave='sine'; vol=0.3; break;
      case 'door': freq=340; dur=0.14; wave='sine'; vol=0.3; break;
      case 'bossdeath': freq=90; dur=0.55; wave='sawtooth'; vol=0.5; break;
    }
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, t0);
    if(type==='bossdeath') osc.frequency.exponentialRampToValueAtTime(28, t0+dur);
    gain.gain.setValueAtTime(vol*settings.volume, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  } catch(e){}
}

// ---------- música ambiental por reino (drones sintetizados, sin archivos externos) ----------
// cada reino tiene su propio acorde sostenido de fondo; se cruza suavemente al cambiar de reino
// y se silencia (sin parar del todo) fuera de partida, en pausa o al morir.
const REALM_AMBIENCE = {
  cripta:     [{freq:55,  type:'sine',     gain:0.5}, {freq:82.5,  type:'triangle', gain:0.28, detune:-6}, {freq:110, type:'sine', gain:0.16}],
  superficie: [{freq:98,  type:'triangle', gain:0.42}, {freq:146.8, type:'sine',     gain:0.3},  {freq:196, type:'triangle', gain:0.14, detune:5}],
  cielo:      [{freq:220, type:'sine',     gain:0.32}, {freq:330,   type:'sine',     gain:0.22}, {freq:440, type:'triangle', gain:0.1, detune:-4}],
  infinito:   [{freq:130.8,type:'sawtooth',gain:0.22}, {freq:138.6, type:'sine',     gain:0.26}, {freq:207.7, type:'sine', gain:0.16, detune:6}],
};
let ambientMasterGain = null;
let ambientVoices = [];
let ambientRealmId = null;
function stopAmbientVoices(){
  if(!audioCtx) { ambientVoices=[]; return; }
  const now = audioCtx.currentTime;
  ambientVoices.forEach(v=>{
    try{
      v.gain.gain.cancelScheduledValues(now);
      v.gain.gain.setValueAtTime(v.gain.gain.value, now);
      v.gain.gain.linearRampToValueAtTime(0, now+0.8);
      v.osc.stop(now+0.85);
    }catch(e){}
  });
  ambientVoices = [];
}
function startAmbientVoices(realmId){
  ensureAudio();
  if(!audioCtx) return;
  if(!ambientMasterGain){
    ambientMasterGain = audioCtx.createGain();
    ambientMasterGain.gain.value = 0;
    ambientMasterGain.connect(audioCtx.destination);
  }
  const specs = REALM_AMBIENCE[realmId] || REALM_AMBIENCE.cripta;
  const now = audioCtx.currentTime;
  specs.forEach(sp=>{
    try{
      const osc = audioCtx.createOscillator();
      osc.type = sp.type;
      osc.frequency.value = sp.freq;
      if(sp.detune) osc.detune.value = sp.detune;
      const g = audioCtx.createGain();
      g.gain.value = 0;
      osc.connect(g); g.connect(ambientMasterGain);
      osc.start(now);
      g.gain.linearRampToValueAtTime(sp.gain, now+1.8);
      ambientVoices.push({osc, gain:g});
    }catch(e){}
  });
}
function setAmbientRealm(realmId){
  if(realmId===ambientRealmId) return;
  ambientRealmId = realmId;
  stopAmbientVoices();
  startAmbientVoices(realmId);
}
function updateAmbientVolume(){
  if(!ambientMasterGain || !audioCtx) return;
  const now = audioCtx.currentTime;
  const target = (gameState==='playing') ? settings.volume*0.16 : 0;
  ambientMasterGain.gain.cancelScheduledValues(now);
  ambientMasterGain.gain.setValueAtTime(ambientMasterGain.gain.value, now);
  ambientMasterGain.gain.linearRampToValueAtTime(target, now+0.6);
}

// ---------- posición libre de los controles táctiles: el jugador puede arrastrar el joystick y
// los botones a donde le resulte más cómodo; se guarda como % de la pantalla para que funcione
// igual sin importar el tamaño o la orientación del dispositivo ----------
const TOUCH_EL = {joystick: () => joyBase, fire: () => fireBtnTouch, dash: () => dashBtnTouch};
function applyTouchLayout(){
  for(const key of ['joystick','fire','dash']){
    const el = TOUCH_EL[key]();
    const pos = settings.touchLayout[key];
    if(!el || !pos) continue;
    const scale = pos.scale || 1;
    el.style.left = pos.x+'%';
    el.style.top = pos.y+'%';
    el.style.right = 'auto';
    el.style.bottom = 'auto';
    el.style.transform = `translate(-50%,-50%) scale(${scale})`;
    const handle = RESIZE_HANDLES[key];
    if(handle){
      handle.style.left = pos.x+'%';
      handle.style.top = pos.y+'%';
      const off = TOUCH_BASE_RADIUS[key]*scale;
      handle.style.transform = `translate(${off-7}px, ${off-7}px)`;
    }
  }
}
let repositioning = false;
let repositionDragKey = null;
let resizeDragKey = null;
let afterRepositionReturn = null;
function enterRepositionMode(){
  repositioning = true;
  document.body.classList.add('repositioning');
}
function exitRepositionMode(){
  repositioning = false;
  repositionDragKey = null;
  resizeDragKey = null;
  document.body.classList.remove('repositioning');
}
function screenToPct(clientX, clientY){
  return { x: clamp(clientX/window.innerWidth*100, 4, 96), y: clamp(clientY/window.innerHeight*100, 4, 96) };
}
function attachRepositionDrag(getEl, key){
  const el = getEl();
  if(!el) return;
  el.addEventListener('pointerdown', e=>{
    if(!repositioning) return;
    e.preventDefault(); e.stopPropagation();
    repositionDragKey = key;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  });
  el.addEventListener('pointermove', e=>{
    if(!repositioning || repositionDragKey!==key) return;
    e.preventDefault();
    const cur = settings.touchLayout[key];
    settings.touchLayout[key] = {...screenToPct(e.clientX, e.clientY), scale: cur.scale||1};
    applyTouchLayout();
  });
  const release = e=>{
    if(repositionDragKey===key){ repositionDragKey=null; saveSettings(); }
  };
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
}

// tirador de redimensionado: un puntito en la esquina de cada control, sólo visible en modo
// "reorganizar controles"; arrastrarlo hacia fuera/dentro agranda o encoge ese control.
const RESIZE_HANDLES = {};
function createResizeHandles(){
  const container = document.getElementById('touchControls');
  for(const key of ['joystick','fire','dash']){
    const h = document.createElement('div');
    h.className = 'tc-resize-handle';
    h.title = 'Arrastra para cambiar el tamaño';
    container.appendChild(h);
    RESIZE_HANDLES[key] = h;
    h.addEventListener('pointerdown', e=>{
      if(!repositioning) return;
      e.preventDefault(); e.stopPropagation();
      resizeDragKey = key;
      try{ h.setPointerCapture(e.pointerId); }catch(err){}
    });
    h.addEventListener('pointermove', e=>{
      if(!repositioning || resizeDragKey!==key) return;
      e.preventDefault();
      const el = TOUCH_EL[key]();
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
      const d = Math.hypot(e.clientX-cx, e.clientY-cy);
      const scale = clamp(d / TOUCH_BASE_RADIUS[key], 0.6, 1.8);
      settings.touchLayout[key].scale = scale;
      applyTouchLayout();
    });
    const release = ()=>{ if(resizeDragKey===key){ resizeDragKey=null; saveSettings(); } };
    h.addEventListener('pointerup', release);
    h.addEventListener('pointercancel', release);
  }
}

function pickAbilities(n){

  while(out.length<n && pool.length){

  }
  return out;
}

// amuleto de segunda vida (normalmente sólo comprable en tienda) con muchísimo menos peso, para que
// pueda salir pero sea raro — así el pacto no se vuelve un atajo fiable para conseguir la revivida
const VACIO_BONUS_POOL = [
  ...ABILITIES.map(a=>({...a, weight:12})),
  {id:'revive', name:'Amuleto de la Segunda Vida', desc:'Revive una vez con la mitad de vida.', icon:'💫', weight:1,
   apply:p=>{p.hasRevive = true;}},
];
function pickWeightedAbilities(n){
  const pool = VACIO_BONUS_POOL.map(a=>({...a}));
  const out = [];
  while(out.length<n && pool.length){
    const total = pool.reduce((s,a)=>s+a.weight,0);
    let r = Math.random()*total, idx = 0;
    for(; idx<pool.length-1; idx++){ r -= pool[idx].weight; if(r<=0) break; }
    out.push(pool.splice(idx,1)[0]);
  }
  return out;
}

function rollShopOffers(n){

// salto de dificultad al cambiar de reino: además del escalado normal por cada jefe superado,
// los jefes de Superficie pegan más fuerte que los de la Cripta, y los del Cielo más que los de
// Superficie; pasado el Cielo (modo infinito) sigue subiendo sin límite con la profundidad.
function realmDifficultyMult(d){
  const r = realmOf(d);
  if(r.id==='cripta') return 1;
  if(r.id==='superficie') return 1.3;
  if(r.id==='cielo') return 1.7;
  return Math.min(4.5, 2.1 + (d-150)*0.006); // infinito: sigue subiendo pero se estabiliza para no volverse infinito de verdad
}
// el daño de contacto (enemigos, sus proyectiles, jefes y trampas) también sube por reino, para
// que "más difícil" se note en el golpe y no sólo en cuánta vida hay que gastarle al enemigo —
// pegar más fuerte no sirve de nada si de todas formas sólo quita medio corazón.
function threatDamage(base){
  const r = realmOf(depth).id;
  const bump = r==='cripta' ? 0 : r==='superficie' ? 1 : r==='cielo' ? 2 : Math.min(5, 2 + Math.floor((depth-150)/200));
  return base + bump;
}

// ---------- generación del mapa: qué hay tras cada puerta ----------
// probabilidad de jefe según cuántas salas han pasado desde el último (roomsSinceBoss).
// roomsSinceBoss=4 -> se está generando la puerta nº5 desde el último jefe, etc.
// puertas 1-4: nunca jefe (deja respirar tras el jefe anterior)
// puertas 5-9: probabilidad creciente de que aparezca antes de tiempo
// puerta 10: garantía dura, el jefe siempre aparece como muy tarde aquí
const BOSS_CHANCE_BY_ROOMS_SINCE = {4:0.12, 5:0.20, 6:0.32, 7:0.46, 8:0.62};
// fronteras entre reinos: la profundidad justo antes de cada una siempre lleva al guardián de turno,
// nunca a una sala normal, así el ascenso a Superficie/Cielo siempre pasa por su llave.
const REALM_BOUNDARIES = REALMS.filter(r=>r.to!==Infinity).map(r=>r.to);
function pickNextRoomType(){
  // la sala 1 es siempre la tutorial: nunca puede aparecer un jefe justo al salir de ella
  if(depth<=1) return (roomsSinceShop>=2 && Math.random()<0.22) ? 'shop' : 'combat';
  if(REALM_BOUNDARIES.includes(depth+1)) return 'boss'; // frontera de reino: guardián garantizado
  if(roomsSinceBoss>=9) return 'boss'; // puerta 10: garantía dura
  const chance = BOSS_CHANCE_BY_ROOMS_SINCE[roomsSinceBoss];
  if(chance!=null && Math.random()<chance) return 'boss';
  if(roomsSinceShop>=2 && Math.random()<0.22) return 'shop';
  return 'combat';
}

const BACK_DOOR_Y_OFFSET = 26; // separación respecto al borde inferior de la sala

function revealDoors(){
  if(!currentRoom || currentRoom.doors.length) return;
  const allowBranch = currentRoom.type!=='boss';
  const numDoors = (allowBranch && Math.random()<0.35) ? 2 : 1;
  const xs = numDoors===2 ? [W/2-130, W/2+130] : [W/2];
  const doors = xs.map(x=>({x, y:ROOM.y, nextType: pickNextRoomType(), used:false}));
  // cualquier sala a la que se llega desde otra (es decir, salvo la primera) tiene una puerta
  // de vuelta atrás en el lado opuesto, así se puede volver por CUALQUIERA de las dos puertas
  // de un cruce y explorar la rama que falte.
  if(currentRoom.parentRoom){
    doors.push({x:W/2, y:ROOM.y+ROOM.h-BACK_DOOR_Y_OFFSET, nextType:'back', used:false, isBack:true});
  }
  currentRoom.doors = doors;
  renderMinimap();
}

function doorZoneFor(d){ return {x:d.x-32, y:d.y-16, w:64, h:32}; }

function updateDoors(){
  if(!currentRoom || !currentRoom.cleared) return;
  for(const d of currentRoom.doors){
    const z = doorZoneFor(d);
    if(player.x>z.x && player.x<z.x+z.w && player.y>z.y && player.y<z.y+z.h){
      takeDoor(d);
      return;
    }
  }
}

function takeDoor(d){
  playSfx('door');
  if(d.nextType==='back'){
    returnToParentRoom();
    return;
  }
  if(d.childRoom){
    // esta puerta ya se había cruzado antes: volvemos a esa misma sala tal y como la dejamos,
    // sin generar contenido nuevo ni contar progreso otra vez, así se puede entrar y salir
    // de manera indefinida.
    goToChildRoom(d);
    return;
  }
  const prevType = currentRoom.type;
  depth++;
  if(depth===51) unlockAchievement('sala_51');
  else if(depth===101) unlockAchievement('sala_101');
  else if(depth===151) unlockAchievement('sala_151');
  if(depth>meta.bestDepth){ meta.bestDepth = depth; saveMeta(); }
  setAmbientRealm(realmOf(depth).id); // cambia la música de fondo si se ha entrado en un reino nuevo
  if(d.nextType==='boss') roomsSinceBoss=0; else roomsSinceBoss++;
  if(d.nextType==='shop') roomsSinceShop=0; else roomsSinceShop++;
  roomsSinceEssenceCoin++;
  mapHistory.push(prevType);
  if(mapHistory.length>6) mapHistory.shift();
  currentRoom.savedHazards = hazards; // por si se vuelve atrás desde la siguiente sala
  const parentRoom = currentRoom;
  enterRoom(d.nextType, parentRoom);
  d.childRoom = currentRoom; // guardamos la referencia para poder volver a entrar más tarde
  d.used = true; // sólo marca visual de "ya explorada"; sigue siendo utilizable
  if(roomsSinceEssenceCoin>=nextEssenceCoinAt){
    roomsSinceEssenceCoin = 0;
    nextEssenceCoinAt = Math.round(rand(8,12));
    meta.essence += 1;
    saveMeta();
    spawnFloatText(player.x, player.y-30, '✨ +1 ESENCIA', '#5cf0c2');
  }
}

function goToChildRoom(d){
  currentRoom.savedHazards = hazards; // guardamos cómo dejamos esta sala
  const child = d.childRoom;
  currentRoom = child;
  player.x = W/2; player.y = H-120;
  bulletsEnemy = [];
  bulletsPlayer = [];
  enemies = [];
  hazards = child.savedHazards || [];
  boss = null;
  bossbar.style.display='none';
  zonebar.style.display = child.type==='combat' ? 'block':'none';
  if(child.type==='combat') updateZoneHUD();
  updateDepthHUD();
  renderMinimap();
}

function returnToParentRoom(){
  const parent = currentRoom.parentRoom;
  if(!parent) return; // por seguridad, no debería pasar (la sala inicial no tiene vuelta)
  currentRoom.savedHazards = hazards; // guardamos cómo dejamos esta sala, para volver a ella igual
  currentRoom = parent;
  player.x = W/2; player.y = ROOM.y+ROOM.h-90;
  bulletsEnemy = [];
  bulletsPlayer = [];
  enemies = [];
  hazards = parent.savedHazards || [];
  boss = null;
  bossbar.style.display='none';
  zonebar.style.display = parent.type==='combat' ? 'block':'none';
  if(parent.type==='combat') updateZoneHUD();
  updateDepthHUD();
  ensureForwardDoor(currentRoom); // red de seguridad por si una sala se quedó sin ninguna puerta de avance
  renderMinimap();
}

// red de seguridad: evita quedarse sin salida en una sala que, por algún motivo, no tenga ninguna puerta de avance
function ensureForwardDoor(room){
  if(!room || !room.cleared) return;
  const hasForward = room.doors.some(d=>!d.isBack);
  if(hasForward) return;
  const takenX = room.doors.filter(d=>d.y===ROOM.y).map(d=>Math.round(d.x));
  const candidates = [W/2, W/2-130, W/2+130, W/2-200, W/2+200];
  let x = candidates.find(cx=>!takenX.includes(Math.round(cx)));
  if(x===undefined) x = W/2 + rand(-180,180);
  room.doors.push({x, y:ROOM.y, nextType: pickNextRoomType(), used:false});
}

function enterRoom(type, parentRoom){
  // red de seguridad extra: pase lo que pase (incluida una partida guardada antigua o
  // corrupta), en la sala 1 nunca puede aparecer un jefe.
  if(type==='boss' && depth<=1) type='combat';
  currentRoom = {type, cleared:false, doors:[], parentRoom: parentRoom||null};
  player.x = W/2; player.y = H-120;
  bulletsEnemy = [];
  if(type==='combat'){
    startCombatRoom();
  } else if(type==='shop'){
    startShopRoom();
  } else if(type==='boss'){
    startBossEncounter();
  }
  updateDepthHUD();
  renderMinimap();
}

// dificultad: el inicio ya exige moverse y esquivar, y escala con la profundidad
function enemyStatsForRoom(){
  const mult = realmDifficultyMult(depth); // los enemigos normales también pegan un salto al cambiar de reino, no sólo los jefes
  const pactHpMult = activePact()?.id==='fuerza' ? 1.2 : 1; // Pacto de Fuerza: +20% vida
  const hp = Math.round((5 + Math.round(depth*0.9)) * mult * pactHpMult);
  const speed = (1.45 + depth*0.022) * Math.min(1.35, 1 + (mult-1)*0.4); // la velocidad sube menos que la vida, para que siga siendo esquivable
  const pactExtra = activePact()?.id==='vacio' ? 2 : 0; // Pacto del Vacío: hasta 2 enemigos más por sala
  const count = clamp(2 + Math.floor(depth/6), 2, 8+pactExtra);
  return {hp,speed,count};
}

// regla de vida por tipo de enemigo: los que atacan cuerpo a cuerpo (deben acercarse y arriesgarse)
// tienen más vida que los que atacan a distancia (pueden herir sin exponerse), y dentro de cada
// grupo la vida final también depende de lo agresivo/especial que sea cada tipo en concreto.
function spawnRoomEnemy(type,hp,speed){
  const x = rand(ROOM.x+50, ROOM.x+ROOM.w-50);
  const y = rand(ROOM.y+50, ROOM.y+170);
  let r = 12, sp = speed, hpFinal = Math.round(hp*1.1); // caminante: cuerpo a cuerpo básico
  if(type==='shooter'){ r=11; sp=speed*0.78; hpFinal=Math.round(hp*0.75); } // a distancia
  else if(type==='brute'){ r=16; sp=speed*0.68; hpFinal=Math.round(hp*1.8); } // cuerpo a cuerpo pesado
  else if(type==='splitter'){ r=14; sp=speed*0.62; hpFinal=Math.round(hp*1.2); } // cuerpo a cuerpo
  else if(type==='sniper'){ r=12; sp=speed*0.55; hpFinal=Math.round(hp*0.7); } // a distancia, muy preciso
  else if(type==='orbiter'){ r=11; sp=speed*0.9; hpFinal=Math.round(hp*0.75); } // a distancia
  else if(type==='bomber'){ r=15; sp=speed*0.5; hpFinal=Math.round(hp*1.15); } // se acerca para detonar
  else if(type==='stalker'){ r=12; sp=speed*1.22; hpFinal=Math.round(hp*1.35); } // cuerpo a cuerpo, veloz
  else if(type==='turret'){ r=13; sp=0; hpFinal=Math.round(hp*0.65); } // a distancia, fija
  else if(type==='bramble'){ r=13; sp=speed*0.62; hpFinal=Math.round(hp*1.4); } // Superficie: se enraíza y dispara espinas
  else if(type==='gust'){ r=10; sp=speed*1.3; hpFinal=Math.round(hp*0.6); } // Cielo: vuelo errático, dispara ráfagas
  else if(type==='boar'){ r=15; sp=speed*0.66; hpFinal=Math.round(hp*1.7); } // Superficie: embiste como el brute, pero es exclusivo de la Superficie
  else if(type==='thorn'){ r=11; sp=speed*0.75; hpFinal=Math.round(hp*0.72); } // Superficie: a distancia, dispara en abanico
  else if(type==='spiderling'){ r=10; sp=speed*1.32; hpFinal=Math.round(hp*0.85); } // Superficie: cuerpo a cuerpo, muy ágil
  else if(type==='sparrow'){ r=11; sp=speed*1.28; hpFinal=Math.round(hp*1.05); } // Cielo: cuerpo a cuerpo, se lanza en picado
  else if(type==='cloudling'){ r=11; sp=speed*0.78; hpFinal=Math.round(hp*0.75); } // Cielo: a distancia
  else if(type==='stormlet'){ r=13; sp=0; hpFinal=Math.round(hp*0.68); } // Cielo: fijo, dispara en abanico
  enemies.push({
    type, x, y, r,
    hp:hpFinal, maxHp:hpFinal, speed: sp,
    t:0, shootT: rand(40,100), fromBoss:false,
    wob: rand(0,Math.PI*2),
    chargeState:'idle', chargeT:0, chargeDir:{x:0,y:0},
    orbitDir: Math.random()<0.5?1:-1, orbitAng: rand(0,Math.PI*2),
    aiming:false, aimT:0,
    fuseT: 999,
    blinkT: rand(35,75),
  });
}

function startCombatRoom(){
  boss = null; // red de seguridad: una sala de combate normal nunca debe arrastrar un jefe de antes
  enemies = [];
  if(depth===1){
    // sala inicial: tutorial sin enemigos ni trampas, sólo los controles marcados en el suelo
    hazards = [];
  } else {
    hazards = generateHazards(currentKind(), false);
    const stats = enemyStatsForRoom();
    // a partir de la sala 2 (la 1 es la sala tutorial, siempre vacía) puede aparecer cualquier
    // tipo de enemigo; las probabilidades sólo se ajustan un poco con la profundidad para que
    // los tipos más peligrosos se vuelvan algo más frecuentes según se avanza
    // cada reino tiene su propio elenco de enemigos, exclusivo: nada de la Cripta aparece en
    // Superficie o Cielo, y viceversa — sólo tras el Cielo (modo infinito) se mezclan los tres
    const realmId = realmOf(depth).id;
    if(realmId==='superficie'){
      const boarChance = clamp(0.14+depth*0.004, 0.14, 0.22);
      const thornChance = clamp(0.16+depth*0.004, 0.16, 0.24);
      const spiderlingChance = clamp(0.14+depth*0.004, 0.14, 0.22);
      for(let i=0;i<stats.count;i++){
        const r = Math.random();
        let type = 'bramble';
        let acc = boarChance;
        if(r < acc) type = 'boar';
        else if(r < (acc+=thornChance)) type = 'thorn';
        else if(r < (acc+=spiderlingChance)) type = 'spiderling';
        spawnRoomEnemy(type, stats.hp, stats.speed);
      }
    } else if(realmId==='cielo'){
      const sparrowChance = clamp(0.16+depth*0.004, 0.16, 0.24);
      const cloudlingChance = clamp(0.16+depth*0.004, 0.16, 0.24);
      const stormletChance = clamp(0.12+depth*0.004, 0.12, 0.2);
      for(let i=0;i<stats.count;i++){
        const r = Math.random();
        let type = 'gust';
        let acc = sparrowChance;
        if(r < acc) type = 'sparrow';
        else if(r < (acc+=cloudlingChance)) type = 'cloudling';
        else if(r < (acc+=stormletChance)) type = 'stormlet';
        spawnRoomEnemy(type, stats.hp, stats.speed);
      }
    } else if(realmId==='infinito'){
      // más allá del Cielo: se mezclan los tres elencos para dar variedad al modo infinito
      const pool = ['walker','shooter','brute','splitter','sniper','orbiter','bomber','stalker','turret',
                    'bramble','boar','thorn','spiderling','gust','sparrow','cloudling','stormlet'];
      for(let i=0;i<stats.count;i++){
        spawnRoomEnemy(pool[Math.floor(Math.random()*pool.length)], stats.hp, stats.speed);
      }
    } else {
      // Cripta: el elenco original, sin ningún enemigo de los reinos nuevos
      const weights = [
        ['shooter', clamp(0.17 + depth*0.005, 0.17, 0.3)],
        ['brute', clamp(0.06 + depth*0.009, 0.06, 0.16)],
        ['splitter', clamp(0.06 + depth*0.007, 0.06, 0.14)],
        ['sniper', clamp(0.08 + depth*0.006, 0.08, 0.16)],
        ['orbiter', clamp(0.06 + depth*0.007, 0.06, 0.14)],
        ['bomber', clamp(0.06 + depth*0.007, 0.06, 0.14)],
        ['stalker', clamp(0.06 + depth*0.006, 0.06, 0.14)],
        ['turret', clamp(0.05 + depth*0.005, 0.05, 0.12)],
      ];
      // a partir de cierta profundidad estas probabilidades sumaban más del 100%, lo que dejaba
      // a 'stalker' y 'turret' sin poder salir nunca; se normalizan para que eso no pase y
      // 'walker' conserve siempre al menos un 12% de posibilidades.
      const totalW = weights.reduce((s,[,c])=>s+c, 0);
      const cap = 0.88;
      if(totalW > cap){ const f = cap/totalW; for(const w of weights) w[1] *= f; }
      for(let i=0;i<stats.count;i++){
        const r = Math.random();
        let type = 'walker';
        let acc = 0;
        for(const [t,c] of weights){ acc += c; if(r < acc){ type = t; break; } }
        spawnRoomEnemy(type, stats.hp, stats.speed);
      }
    }
  }
  bossbar.style.display='none';
  zonebar.style.display='block';
  player.invuln = Math.max(player.invuln, 45); // ventana de gracia al entrar a la sala
  updateZoneHUD();
}

function startBossEncounter(){
  if(REALM_GUARDIANS[depth]){
    boss = guardianBossTemplate(depth);
  } else if(realmOf(depth).id==='infinito'){
    // en el Más Allá se recorren los 20 jefes propios de este reino en orden, en vez del
    // ciclo de 7 tipos reskinizados que usan Cripta/Superficie/Cielo. Al completar una vuelta
    // entera (20 jefes) aparece un jefe secreto único antes de que el ciclo vuelva a empezar.
    if(infinitoBossCount>0 && infinitoBossCount%INFINITO_KINDS.length===0){
      boss = secretBossTemplate(bossIndex);
    } else {
      const kind = INFINITO_KINDS[infinitoBossCount % INFINITO_KINDS.length];
      boss = infinitoBossTemplate(kind, bossIndex);
    }
    infinitoBossCount++;
  } else {
    boss = bossTemplate(nextBossKind, bossIndex);
  }
  if(!boss.isGuardian) bossKindCounts[boss.kind] = (bossKindCounts[boss.kind]||0)+1; // el guardián no cuenta para el MK.n de los jefes normales
  roomStormT = 0; // reinicia la tormenta ambiental de las salas de jefe del Cielo en cada combate
  hazards = generateHazards(currentKind(), true);
  bossbar.style.display='block';
  zonebar.style.display='none';
  bossname.textContent = boss.name;
  bosshpinner.style.width='100%';
  enemies = [];
  player.invuln = Math.max(player.invuln, 60); // margen de seguridad al iniciar el combate de jefe
  spawnFloatText(W/2,H/2-40, boss.name, '#ff9d9d');
}
