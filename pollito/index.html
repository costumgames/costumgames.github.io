<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Corredor</title>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CF5MVG5PV5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-CF5MVG5PV5');
</script>

<style>
  :root{
    --text: #f3eefa;
    --text-dim: #a596b8;
    --accent: #ff8f5e;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
  }

  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:#100b18;
    color:var(--text);
  }

  .game-wrap{
    position:relative;
    width:100%;
    height:100%;
  }

  .hud{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.95rem;
    padding:14px 20px;
    background:linear-gradient(rgba(5,6,10,0.75),transparent);
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:2;
    pointer-events:none;
  }

  .hud-left b,
  .hud-right b{
    display:block;
    font-size:0.68rem;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-weight:400;
  }

  .hud-left span{
    font-size:1.3rem;
    font-weight:700;
    color:var(--accent);
  }

  .hud-right{
    text-align:right;
  }

  .hud-right span{
    font-size:1.3rem;
    font-weight:700;
  }

  canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
  }

  .overlay-msg{
    position:absolute;
    left:0;
    right:0;
    bottom:26px;
    text-align:center;
    font-weight:700;
    color:var(--accent);
    font-size:1.05rem;
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
    pointer-events:none;
  }
</style>
</head>

<body>

<div class="game-wrap">

  <div class="hud">
    <div class="hud-left">
      <b>Puntos</b>
      <span id="score">0</span>
    </div>

    <div class="hud-right">
      <b>Récord de la sesión</b>
      <span id="best">0</span>
    </div>
  </div>

  <canvas id="game"></canvas>

  <p class="overlay-msg" id="msg">
    Toca para empezar
  </p>

</div>

<script>
(function(){

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('msg');

  let W = 0;
  let H = 0;
  let DPR = window.devicePixelRatio || 1;
  let groundY = 0;

  function resizeCanvas(){

    DPR = window.devicePixelRatio || 1;

    W = canvas.clientWidth;
    H = canvas.clientHeight;

    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);

    ctx.setTransform(DPR,0,0,DPR,0,0);

    groundY = H - Math.max(40,H * 0.14);
  }

  window.addEventListener('resize',function(){
    resizeCanvas();

    if(!running){
      draw();
    }
  });

  let best = 0;
  let player;
  let obstacles;
  let clouds;
  let speed;
  let score;
  let running;
  let gameOver;
  let frame;

  function baseUnit(){
    return Math.min(W,H);
  }

  function resetGame(){

    const u = baseUnit();

    const pw = Math.max(36,u * 0.078);
    const ph = Math.max(52,u * 0.11);

    player = {
      x:Math.max(50,W * 0.08),
      y:groundY - ph,
      w:pw,
      h:ph,
      vy:0,
      jumping:false,
      legPhase:0
    };

    obstacles = [];

    clouds = [
      {x:W * 0.2,y:H * 0.16,s:1},
      {x:W * 0.55,y:H * 0.28,s:0.7},
      {x:W * 0.82,y:H * 0.12,s:0.85}
    ];

    speed = Math.max(5,W * 0.0075);

    score = 0;

    running = false;
    gameOver = false;
    frame = 0;

    scoreEl.textContent = '0';

    msgEl.textContent = 'Toca para empezar';

    draw();
  }

  function jump(){

    if(gameOver){
      resetGame();
      return;
    }

    if(!running){

      running = true;

      msgEl.textContent = '';

      loop();

      return;
    }

    if(!player.jumping){

      player.vy = -Math.max(11,baseUnit() * 0.024);

      player.jumping = true;
    }
  }

  function spawnObstacle(){

    const u = baseUnit();

    const roll = Math.random();

    if(roll < 0.6){

      const arms = 1 + Math.floor(Math.random() * 3);

      const h = u * 0.09 + arms * u * 0.022;

      obstacles.push({
        type:'cactus',
        x:W + 20,
        y:groundY - h,
        w:u * 0.05,
        h:h,
        arms:arms
      });

    }else{

      const h = u * 0.06 + Math.random() * u * 0.03;

      obstacles.push({
        type:'rock',
        x:W + 20,
        y:groundY - h,
        w:u * 0.07,
        h:h
      });

    }
  }

  function update(){

    frame++;

    score++;

    scoreEl.textContent = Math.floor(score / 5);

    player.vy += baseUnit() * 0.0013;

    player.y += player.vy;

    if(player.y >= groundY - player.h){

      player.y = groundY - player.h;

      player.vy = 0;

      player.jumping = false;
    }

    if(!player.jumping){
      player.legPhase += 0.35;
    }

    if(frame % Math.max(45,85 - Math.floor(speed * 2.5)) === 0){
      spawnObstacle();
    }

    for(let i = obstacles.length - 1; i >= 0; i--){

      obstacles[i].x -= speed;

      if(obstacles[i].x + obstacles[i].w < 0){
        obstacles.splice(i,1);
      }
    }

    clouds.forEach(function(c){

      c.x -= speed * 0.25;

      if(c.x < -60){
        c.x = W + 40;
      }

    });

    speed += 0.003;

    for(const ob of obstacles){

      const pad = player.w * 0.16;

      if(
        player.x < ob.x + ob.w - pad &&
        player.x + player.w - pad > ob.x &&
        player.y < ob.y + ob.h - pad * 0.6 &&
        player.y + player.h - pad * 0.6 > ob.y
      ){

        endGame();

        break;
      }
    }
  }

  function endGame(){

    running = false;

    gameOver = true;

    const finalScore = Math.floor(score / 5);

    if(finalScore > best){

      best = finalScore;

      bestEl.textContent = best;
    }

    msgEl.textContent =
      'Has chocado — ' +
      finalScore +
      ' puntos. Toca para reintentar';
  }

  function drawSky(){

    const g = ctx.createLinearGradient(0,0,0,H);

    g.addColorStop(0,'#3a1f5c');
    g.addColorStop(0.55,'#ab4d63');
    g.addColorStop(1,'#f0895a');

    ctx.fillStyle = g;

    ctx.fillRect(0,0,W,H);

    ctx.beginPath();

    ctx.fillStyle = 'rgba(255,224,170,0.85)';

    ctx.arc(
      W - W * 0.14,
      H * 0.28,
      Math.max(28,baseUnit() * 0.05),
      0,
      Math.PI * 2
    );

    ctx.fill();
  }

  function drawClouds(){

    ctx.fillStyle = 'rgba(255,255,255,0.18)';

    clouds.forEach(function(c){

      const r = baseUnit() * 0.04 * c.s;

      ctx.beginPath();

      ctx.ellipse(
        c.x,
        c.y,
        r,
        r * 0.4,
        0,
        0,
        Math.PI * 2
      );

      ctx.ellipse(
        c.x + r * 0.7,
        c.y + r * 0.15,
        r * 0.7,
        r * 0.32,
        0,
        0,
        Math.PI * 2
      );

      ctx.fill();

    });
  }

  function drawGround(){

    ctx.fillStyle = '#241332';

    ctx.fillRect(
      0,
      groundY,
      W,
      H - groundY
    );

    ctx.strokeStyle = 'rgba(255,255,255,0.15)';

    ctx.lineWidth = 2;

    const dash = Math.max(
      30,
      baseUnit() * 0.045
    );

    const offset =
      running ? (frame * speed) % dash : 0;

    for(
      let x = -offset;
      x < W;
      x += dash
    ){

      ctx.beginPath();

      ctx.moveTo(
        x,
        groundY + 8
      );

      ctx.lineTo(
        x + dash * 0.45,
        groundY + 8
      );

      ctx.stroke();
    }
  }

  function roundRect(x,y,w,h,r){

    ctx.beginPath();

    ctx.moveTo(x + r,y);

    ctx.arcTo(
      x + w,
      y,
      x + w,
      y + h,
      r
    );

    ctx.arcTo(
      x + w,
      y + h,
      x,
      y + h,
      r
    );

    ctx.arcTo(
      x,
      y + h,
      x,
      y,
      r
    );

    ctx.arcTo(
      x,
      y,
      x + w,
      y,
      r
    );

    ctx.closePath();
  }

  function drawPlayer(){

    const p = player;

    ctx.save();

    ctx.translate(p.x,p.y);

    const legSwing =
      player.jumping
        ? 0
        : Math.sin(player.legPhase) * p.h * 0.05;

    ctx.strokeStyle = '#e08a1f';

    ctx.lineWidth =
      Math.max(2,p.w * 0.09);

    ctx.lineCap = 'round';

    ctx.beginPath();

    ctx.moveTo(
      p.w * 0.36,
      p.h * 0.82
    );

    ctx.lineTo(
      p.w * 0.3 + legSwing * 0.5,
      p.h * 1.02
    );

    ctx.moveTo(
      p.w * 0.6,
      p.h * 0.82
    );

    ctx.lineTo(
      p.w * 0.68 - legSwing * 0.5,
      p.h * 1.02
    );

    ctx.stroke();

    ctx.fillStyle = '#f2b23c';

    ctx.beginPath();

    ctx.moveTo(
      p.w * 0.06,
      p.h * 0.55
    );

    ctx.lineTo(
      -p.w * 0.28,
      p.h * 0.4
    );

    ctx.lineTo(
      p.w * 0.02,
      p.h * 0.68
    );

    ctx.closePath();

    ctx.fill();

    const bodyGrad =
      ctx.createLinearGradient(
        0,
        p.h * 0.15,
        0,
        p.h * 0.95
      );

    bodyGrad.addColorStop(
      0,
      '#ffdd6b'
    );

    bodyGrad.addColorStop(
      1,
      '#f4a72c'
    );

    ctx.fillStyle = bodyGrad;

    ctx.beginPath();

    ctx.ellipse(
      p.w * 0.42,
      p.h * 0.56,
      p.w * 0.46,
      p.h * 0.4,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = '#e08f1f';

    ctx.beginPath();

    ctx.ellipse(
      p.w * 0.28,
      p.h * 0.6,
      p.w * 0.2,
      p.h * 0.24,
      -0.35,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = '#ffdd6b';

    ctx.beginPath();

    ctx.arc(
      p.w * 0.8,
      p.h * 0.28,
      p.w * 0.4,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = '#e5493f';

    ctx.beginPath();

    ctx.arc(
      p.w * 0.62,
      p.h * 0.02,
      p.w * 0.07,
      0,
      Math.PI * 2
    );

    ctx.arc(
      p.w * 0.74,
      p.h * -0.03,
      p.w * 0.08,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = '#ff9a4d';

    ctx.beginPath();

    ctx.moveTo(
      p.w * 1.1,
      p.h * 0.26
    );

    ctx.quadraticCurveTo(
      p.w * 1.28,
      p.h * 0.29,
      p.w * 1.1,
      p.h * 0.36
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle = '#2b1c0c';

    ctx.beginPath();

    ctx.arc(
      p.w * 0.9,
      p.h * 0.24,
      p.w * 0.09,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = '#fff';

    ctx.beginPath();

    ctx.arc(
      p.w * 0.93,
      p.h * 0.2,
      p.w * 0.035,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
  }

  function drawObstacles(){

    obstacles.forEach(function(ob){

      if(ob.type === 'cactus'){

        const grad =
          ctx.createLinearGradient(
            ob.x,
            ob.y,
            ob.x,
            ob.y + ob.h
          );

        grad.addColorStop(
          0,
          '#5fd68a'
        );

        grad.addColorStop(
          1,
          '#1f8f57'
        );

        ctx.fillStyle = grad;

        roundRect(
          ob.x + ob.w / 2 - ob.w * 0.18,
          ob.y,
          ob.w * 0.36,
          ob.h,
          ob.w * 0.15
        );

        ctx.fill();

        for(
          let i = 0;
          i < ob.arms;
          i++
        ){

          const armY =
            ob.y +
            ob.h * 0.15 +
            i * ob.h * 0.22;

          const dir =
            i % 2 === 0
              ? -1
              : 1;

          roundRect(
            ob.x +
            ob.w / 2 -
            ob.w * 0.18 +
            dir * ob.w * 0.28,
            armY,
            ob.w * 0.28,
            ob.h * 0.1,
            ob.w * 0.1
          );

          ctx.fill();

          roundRect(
            ob.x +
            ob.w / 2 -
            ob.w * 0.18 +
            dir * ob.w * 0.34,
            armY - ob.h * 0.14,
            ob.w * 0.2,
            ob.h * 0.18,
            ob.w * 0.1
          );

          ctx.fill();
        }

      }else{

        const grad =
          ctx.createLinearGradient(
            ob.x,
            ob.y,
            ob.x,
            ob.y + ob.h
          );

        grad.addColorStop(
          0,
          '#8f7a9c'
        );

        grad.addColorStop(
          1,
          '#4f3f63'
        );

        ctx.fillStyle = grad;

        ctx.beginPath();

        ctx.moveTo(
          ob.x,
          ob.y + ob.h
        );

        ctx.lineTo(
          ob.x + ob.w * 0.2,
          ob.y + ob.h * 0.2
        );

        ctx.lineTo(
          ob.x + ob.w * 0.55,
          ob.y
        );

        ctx.lineTo(
          ob.x + ob.w * 0.85,
          ob.y + ob.h * 0.35
        );

        ctx.lineTo(
          ob.x + ob.w,
          ob.y + ob.h
        );

        ctx.closePath();

        ctx.fill();
      }
    });
  }

  function draw(){

    ctx.clearRect(
      0,
      0,
      W,
      H
    );

    drawSky();
    drawClouds();
    drawGround();
    drawPlayer();
    drawObstacles();
  }

  function loop(){

    if(!running){
      return;
    }

    update();

    draw();

    if(running){

      requestAnimationFrame(loop);

    }else{

      draw();
    }
  }

  canvas.addEventListener(
    'click',
    jump
  );

  canvas.addEventListener(
    'touchstart',
    function(e){

      e.preventDefault();

      jump();

    },
    {
      passive:false
    }
  );

  window.addEventListener(
    'keydown',
    function(e){

      if(
        e.code === 'Space' ||
        e.code === 'ArrowUp'
      ){

        e.preventDefault();

        jump();
      }
    }
  );

  resizeCanvas();

  resetGame();

})();
</script>

</body>
</html>
