function aud(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d=.1,t='square',v=.05,sl=0){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}

let S='menu',ph='count',paused=false,mode=1,pick=0,sel=0,picks=[],P=[],sc=[0,0],tl=60,gold=false,cnt=0,goalT=0,shake=0,msg='',msgT=0,now=0;

const un=i=>mode===2||SV.u.includes(i);
function go(m){mode=m;camp=m===1;S='pick';pick=0;sel=0;picks=[];tone(600,.08)}
function chooseChar(i){if(!un(i)){tone(150,.15);return}
 if(NET&&netSt==='ready')return;
 if(NET==='guest'){picks[0]=i;conn.send({t:'pick',ci:i});netSt='ready';tone(750,.1);return}
 if(NET==='host'){picks[0]=hostPick=i;netSt='ready';tone(750,.1);if(gPick!=null){picks[1]=gPick;startMatch()}return}picks[pick]=i;tone(750,.1);
 if(pick===0){if(mode===1){picks[1]=SV.lv<LAD.length?LAD[SV.lv]:Math.floor(Math.random()*CH.length);startMatch()}else{pick=1;sel=0}}
 else startMatch()}
function startMatch(){P=[mkP(0,picks[0],false),mkP(1,picks[1],mode===1)];P[1].dif=.8+.035*Math.min(SV.lv,10);sc=[0,0];tl=60;gold=false;paused=false;box=null;spT=420;unl='';srv=0;S='play';resetRound(1);if(NET==='host'){P[1].net=true;if(conn&&conn.open)conn.send({t:'st',sp:SP,c:picks.slice()})}}
function resetRound(f){P.forEach(p=>{p.x=p.side?W-230:230;p.y=G;p.vx=p.vy=0;p.kickT=0;p.pw=p.mg=p.gi=p.sf=p.fr=p.wl=p.sl=p.fl=p.dash=p.sh=p.rb=p.hj=0;p.s=p.tg=1;p.mood=0});
 ball={x:SP===2?(srv?W-290:290):W/2,y:220,vx:0,vy:0,r:15,rot:0,fz:0,sx:0,sy:0,fire:0,lh:-1,bn:0,nb:0,gr:0,ev:0};ph='count';cnt=f?180:90;box=null;spT=300}
function score(g){sc[g]+=SP===1?2:1;srv=g;ph='goal';goalT=110;P.forEach(p=>p.mood=p.side===g?1:-1);shake=14;msg=SP===0?'¡GOOOL!':SP===1?'¡CANASTA!':'¡PUNTO!';msgT=110;
 burst(ball.x,ball.y,'#fff',30,6);for(let i=0;i<5;i++)burst(W*(i+.5)/5,70,['#ffd23a','#4cc9ff','#ff5a4d','#5be37d','#b46bff'][i],22,5);
 [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,'square',.06),i*110))}
function endMatch(){ph='end';tone(800,.6,'square',.07);
 if(camp&&sc[0]>sc[1]&&SV.lv<LAD.length&&picks[1]===LAD[SV.lv]){SV.u.push(picks[1]);SV.lv++;unl=picks[1];svSave()}}

/* ---------- partículas ---------- */
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.random()*sp+1;pts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,l:30+Math.random()*30,c,r:2+Math.random()*3})}}

/* ---------- física ---------- */
function circ(b,cx,cy,cr,vx,vy,e,add){const dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy),m=b.r+cr;if(d>=m||d===0)return false;
 const nx=dx/d,ny=dy/d;b.x=cx+nx*m;b.y=cy+ny*m;const rv=(b.vx-vx)*nx+(b.vy-vy)*ny;
 if(rv<0){b.vx-=(1+e)*rv*nx;b.vy-=(1+e)*rv*ny}b.vx+=nx*add;b.vy+=ny*add;return true}
const foot=p=>{const ph=p.kickT>0?Math.sin((16-p.kickT)/16*Math.PI):0;return{ph,x:p.x+p.dir*(16*p.s+ph*34*p.s),y:p.y-(12+ph*10)*p.s,r:15*p.s}};

function freezeBall(){if(!ball.fz){ball.sx=ball.vx;ball.sy=ball.vy}ball.fz=96;burst(ball.x,ball.y,'#bdeaff',30,5);tone(1000,.4,'sine',.07,-700)}
function skill(p){p.en=0;const k=p.ci;
 if(k===0)freezeBall();
 else if(k===1){p.pw=300;tone(400,.3,'sawtooth',.06,500)}
 else if(k===2){p.gi=300;tone(110,.4,'sawtooth',.07,100)}
 else if(k===3){p.mg=180;tone(250,.4,'sine',.07,300)}
 else if(k===4){p.vy=-19;tone(200,.4,'sawtooth',.07,600)}
 else if(k===5){if(SP===2)p.gi=300;else p.wl=180;tone(180,.3,'square',.07,200)}
 else if(k===6){p.x=Math.max(30,Math.min(W-30,ball.x-p.dir*48));p.y=Math.min(G,ball.y+25);p.vy=0;tone(700,.25,'sine',.07,-500)}
 else if(k===7){if(Math.abs(ball.x-p.x)<320){ball.vx+=p.dir*9;ball.vy-=4}burst(ball.x,ball.y,'#4ce0c8',20,5);tone(300,.4,'sawtooth',.06,300)}
 else if(k===8){ball.lg=240;tone(500,.4,'sine',.06,-300)}
 else if(k===9){P[1-p.side].sl=240;tone(150,.4,'sawtooth',.07,-60)}
 else if(k===10){p.fl=300;tone(450,.3,'triangle',.06,400)}
 else if(k===11){p.dash=14;tone(500,.2,'sawtooth',.06,400)}
 else if(k===12){const o=P[1-p.side];if(Math.abs(ball.x-p.x)<240){ball.vx+=(ball.x>=p.x?1:-1)*10;ball.vy-=8}if(Math.abs(o.x-p.x)<240)o.vy=-11;burst(p.x,p.y-30,'#ff9a00',40,7);shake=10;tone(80,.5,'sawtooth',.1,-40)}
 else if(k===13){const o=P[1-p.side],t=p.x;p.x=o.x;o.x=t;tone(800,.25,'sine',.06,-400)}
 else if(k===14){P[1-p.side].fr=120;tone(900,.4,'sine',.07,-500)}
 else if(k===15){p.sf=300;tone(300,.3,'sawtooth',.06,500)}
 else if(k===16){p.sh=300;tone(900,.2,'sine',.06,300)}
 else if(k===17){ball.vy=16;ball.vx*=.2;burst(ball.x,ball.y,'#2f6fb3',20,4);tone(100,.3,'square',.08,-30)}
 else if(k===18){p.rb=240;tone(700,.3,'sine',.06,200)}
 else{p.hj=360;tone(350,.3,'triangle',.06,300)}
 burst(p.x,p.y-60*p.s,CH[k].col,26,4)}
const ITEMS=[{ic:'❄️',n:'Congelar balón'},{ic:'⬆️',n:'Gigante'},{ic:'💨',n:'Velocidad'},{ic:'🧊',n:'Congelar rival'}];
function useItem(p){const k=p.it,o=P[1-p.side];p.it=-1;
 if(k===0)freezeBall();else if(k===1)p.gi=300;else if(k===2)p.sf=300;else{o.fr=90;burst(o.x,o.y-50,'#bdeaff',30,5);tone(900,.4,'sine',.07,-500)}
 burst(p.x,p.y-60*p.s,'#fff',20,4);tone(600,.1)}
function fireShot(p){ball.vx=p.dir*21;ball.vy=-3.2;ball.fire=140;p.pw=0;burst(ball.x,ball.y,'#ff9a00',26,6);shake=8;tone(140,.3,'sawtooth',.09,200)}

function ai(p){const b=ball,s=p.s,d=p.dir,hy=p.y-64*s,r={l:0,r:0,j:0,k:0,s:0},ownX=p.side?W:0;
 const mine=p.side?b.x>W/2:b.x<W/2;let tx;
 if(b.y<G-110&&Math.abs(b.x-p.x)<260)tx=b.x+b.vx*8-d*8;
 else if(mine||b.vx*d<-2||(SP!==2&&Math.abs(b.vx)<2.5))tx=b.x+b.vx*4-d*42;
 else tx=p.side?W-190:190;
 tx+=p.err;if(tx>p.x+8)r.r=1;else if(tx<p.x-8)r.l=1;
 const dx=b.x-p.x;
 if(Math.abs(dx)<75&&b.y<hy+50&&b.y>hy-150&&b.vy>-4&&p.y>=G&&Math.random()<.3)r.j=1;
 if(dx*d>0&&Math.abs(dx)<66*s&&Math.abs(b.y-(p.y-14*s))<55*s&&p.kickT<=0&&(SP!==1||Math.abs(p.x-(d>0?W:0))<560)&&Math.random()<.45)r.k=1;
 if(p.en>=100){const near=Math.abs(b.x-p.x)<240,danger=Math.abs(b.x-ownX)<380&&b.vx*d<-5;
  if(((p.ci===0||p.ci===5)&&danger)||((p.ci===6?!near:(p.ci>0&&p.ci!==5&&near))&&Math.random()<.03))r.s=1}
 if(p.it>=0&&Math.random()<.012)r.u=1;
 return r}

function upd(p){let L,R,J,K,Z,U;
 if(p.ai){const a=ai(p);L=a.l;R=a.r;J=a.j;K=a.k;Z=a.s;U=a.u}
 else if(p.net){L=rin.l;R=rin.r;J=rin.j;K=rin.k;Z=rin.s;U=rin.u;rin.k=rin.s=rin.u=0}
 else{const st=!p.side&&(mode===1||NET==='host')?CT:[CT[p.side]];L=st.some(c=>keys[c.l]);R=st.some(c=>keys[c.r]);J=st.some(c=>keys[c.j]);K=st.some(c=>pr[c.k]);Z=st.some(c=>pr[c.s]);U=st.some(c=>pr[c.u])}
 if(p.fr>0){p.fr--;L=R=J=K=Z=U=false}
 const ch=CH[p.ci],sp=ch.spd*(p.ai?p.dif:1)*(p.gi>0?.85:1)*(p.sf>0?1.45:1)*(p.sl>0?.4:1)*(p.sh>0?1.25:1);
 p.vx+=(((R?1:0)-(L?1:0))*sp-p.vx)*.3;if(p.dash>0){p.dash--;p.vx=p.dir*16}p.x=Math.max(p.side&&SP===2?W/2+26:30,Math.min(!p.side&&SP===2?W/2-26:W-30,p.x+p.vx));
 if(J&&p.y>=G){p.vy=-ch.jmp*(p.hj>0?1.4:1);tone(320,.07,'sine',.04,200)}
 if(J&&p.fl>0&&p.y<G)p.vy=Math.max(p.vy-1.4,-7);
 p.vy+=.62;p.y=Math.min(G,p.y+p.vy);if(p.y>=G)p.vy=0;
 if(K&&p.kickT<=0){p.kickT=16;p.hit=0;tone(170,.06,'triangle',.06,-70)}
 if(p.kickT>0)p.kickT--;
 if(Z&&p.en>=100)skill(p);if(U&&p.it>=0)useItem(p);if(p.sf>0)p.sf--;if(p.wl>0)p.wl--;if(p.sl>0)p.sl--;if(p.fl>0)p.fl--;if(p.sh>0)p.sh--;if(p.rb>0)p.rb--;if(p.hj>0)p.hj--;
 if(p.pw>0)p.pw--;if(p.mg>0)p.mg--;if(p.gi>0)p.gi--;
 p.tg=p.gi>0?1.6:p.sh>0?.6:1;p.s+=(p.tg-p.s)*.12;
 p.en=Math.min(100,p.en+.14);p.walk+=Math.abs(p.vx)*.14;
 if(p.ai&&Math.random()<.02)p.err=(Math.random()-.5)*60}

function sep(){const[a,b]=P,dx=b.x-a.x,m=(a.s+b.s)*30;
 if(Math.abs(dx)<m&&Math.abs(a.y-b.y)<60*Math.max(a.s,b.s)){const o=(m-Math.abs(dx))/2*Math.sign(dx||1);a.x=Math.max(30,Math.min(W-30,a.x-o));b.x=Math.max(30,Math.min(W-30,b.x+o))}}

function updBall(){const b=ball;
 if(b.fz>0){if(--b.fz===0){b.vx=b.sx*.6;b.vy=b.sy*.6}return}
 for(const p of P)if(p.mg>0){const dx=p.x-b.x,dy=p.y-70*p.s-b.y,d=Math.hypot(dx,dy)||1;if(d<360){b.vx+=dx/d*.5;b.vy+=dy/d*.4;b.vx*=.97;b.vy*=.985}}
 b.vy+=b.lg>0?.09:.3;if(b.lg>0)b.lg--;b.vx*=.9985;b.x+=b.vx;b.y+=b.vy;b.rot+=b.vx*.035;
 const sp=Math.hypot(b.vx,b.vy);if(sp>24){b.vx*=24/sp;b.vy*=24/sp}
