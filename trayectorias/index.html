<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adivina la trayectoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --pitch-dark: #0B3D2E;
    --pitch-mid: #12492F;
    --chalk: #F5F3EC;
    --gold: #E8B84B;
    --red-card: #C0392B;
    --ink: #08241A;
    --line: rgba(245,243,236,0.35);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background-color: var(--pitch-dark);
    background-image:
      repeating-linear-gradient(
        90deg,
        var(--pitch-dark) 0px,
        var(--pitch-dark) 48px,
        var(--pitch-mid) 48px,
        var(--pitch-mid) 96px
      );
    font-family: 'Inter', -apple-system, Segoe UI, sans-serif;
    color: var(--chalk);
  }

  .app{
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  .scoreboard{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom: 22px;
  }

  .tile{
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 18px;
    text-align:center;
    min-width: 92px;
  }

  .tile .num{
    font-family:'Archivo Black', Impact, sans-serif;
    font-size: 26px;
    line-height: 1;
    color: var(--gold);
    display:block;
  }

  .tile .lbl{
    font-size: 11px;
    letter-spacing: 0.03em;
    color: var(--chalk);
    opacity: 0.75;
    display:block;
    margin-top: 4px;
  }

  h1.title{
    font-family:'Archivo Black', Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(28px, 6vw, 40px);
    text-align:center;
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }

  p.subtitle{
    text-align:center;
    max-width: 440px;
    margin: 0 auto 26px;
    color: var(--chalk);
    opacity: 0.8;
    font-size: 15px;
    line-height: 1.5;
  }

  .search-wrap{
    position: relative;
    margin-bottom: 8px;
    display: flex;
    gap: 8px;
  }

  #guessInput{
    flex: 1;
  }

  .check-btn{
    background: var(--gold);
    border: none;
    color: var(--ink);
    padding: 0 22px;
    border-radius: 8px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }

  .check-btn:hover{
    filter: brightness(1.05);
  }

  #guessInput{
    width:100%;
    padding: 14px 16px;
    font-size: 17px;
    font-family: inherit;
    border-radius: 8px;
    border: 2px solid var(--line);
    background: var(--chalk);
    color: var(--ink);
    outline-offset: 2px;
  }

  #guessInput:focus{
    border-color: var(--gold);
    outline: 3px solid rgba(232,184,75,0.35);
  }

  .suggestions{
    list-style:none;
    margin: 4px 0 0;
    padding: 0;
    position: absolute;
    top: 100%;
    left: 0;
    z-index: 5;
    width: 100%;
    background: var(--chalk);
    border-radius: 8px;
    overflow: hidden;
    max-height: 240px;
    overflow-y: auto;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
  }

  .suggestions li{
    padding: 10px 16px;
    color: var(--ink);
    cursor:pointer;
    font-size: 15px;
    border-bottom: 1px solid rgba(8,36,26,0.08);
  }

  .suggestions li:last-child{ border-bottom:none; }

  .suggestions li:hover,
  .suggestions li.active{
    background: var(--gold);
  }

  .feedback{
    min-height: 22px;
    text-align:center;
    font-weight: 600;
    font-size: 15px;
    margin: 10px 0 8px;
  }

  .feedback.correct{ color: var(--gold); }
  .feedback.wrong{ color: #ff8b7d; }
  .feedback.skip{ color: var(--chalk); opacity:0.85; }

  .path{
    position: relative;
    margin: 34px 0 10px;
    padding: 22px 10px 4px;
  }

  .path::before{
    content:"";
    position:absolute;
    top: 50%;
    left: 6%;
    right: 6%;
    border-top: 2px dashed var(--line);
  }

  .path-track{
    position:relative;
    display:flex;
    flex-wrap: wrap;
    justify-content:center;
    gap: 18px 2px;
  }

  .badge-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 6px;
  }

  .badge{
    width: 62px;
    height: 68px;
    clip-path: polygon(0% 0%, 100% 0%, 100% 62%, 50% 100%, 0% 62%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Archivo Black', Impact, sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
    border: 2px solid rgba(255,255,255,0.15);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .badge:hover{
    transform: translateY(-2px);
  }

  .badge-logo{
    width: 70%;
    height: 70%;
    object-fit: contain;
  }

  .club-name-tag{
    max-width: 92px;
    text-align:center;
    font-size: 11px;
    color: var(--gold);
    opacity: 0;
    height: 0;
    overflow: hidden;
    transition: opacity 0.15s ease;
    line-height: 1.3;
  }

  .club-name-tag.visible{
    opacity: 1;
    height: auto;
    margin-top: 2px;
  }

  .fee-line{
    color: var(--chalk);
    opacity: 0.75;
    font-size: 10px;
    margin-top: 1px;
  }

  .arrow-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top: 18px;
    min-width: 46px;
  }

  .arrow-glyph{
    font-size: 20px;
    line-height: 1;
    color: var(--gold);
  }

  .arrow-fee{
    font-size: 10px;
    font-weight: 700;
    color: var(--gold);
    white-space: nowrap;
    margin-top: 3px;
    text-align:center;
  }

  .arrow-fee.estimate{
    color: var(--chalk);
    opacity: 0.8;
    font-style: italic;
    font-weight: 500;
  }

  .arrow-year{
    font-size: 9px;
    color: var(--chalk);
    opacity: 0.7;
    white-space: nowrap;
    margin-top: 1px;
    text-align:center;
  }

  .step-num{
    width: 18px;
    height:18px;
    border-radius:50%;
    background: var(--chalk);
    color: var(--ink);
    font-size: 11px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .controls{
    display:flex;
    justify-content:center;
    gap: 10px;
    margin-top: 28px;
  }

  .back-btn{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 10px 20px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    cursor:pointer;
  }

  .back-btn:hover:not(:disabled){
    border-color: var(--gold);
    color: var(--gold);
  }

  .back-btn:disabled{
    opacity: 0.35;
    cursor: not-allowed;
  }

  .skip-btn{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 10px 20px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    cursor:pointer;
  }

  .skip-btn:hover{
    border-color: var(--gold);
    color: var(--gold);
  }

  .final-screen{
    text-align:center;
    padding: 40px 10px;
  }

  .final-screen .big-score{
    font-family:'Archivo Black', Impact, sans-serif;
    font-size: 56px;
    color: var(--gold);
    margin-bottom: 6px;
  }

  .final-screen p{
    opacity:0.85;
    margin-bottom: 24px;
  }

  .replay-btn{
    background: var(--gold);
    border: none;
    color: var(--ink);
    padding: 12px 28px;
    border-radius: 6px;
    font-family: inherit;
    font-weight:700;
    font-size: 15px;
    cursor:pointer;
  }

  .hidden{ display:none !important; }

  .tabs{
    display:flex;
    justify-content:center;
    gap: 6px;
    margin-bottom: 24px;
  }

  .tab{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk);
    opacity: 0.7;
    padding: 9px 20px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .tab.active{
    background: var(--gold);
    border-color: var(--gold);
    color: var(--ink);
    opacity: 1;
  }

  .collection-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 16px;
    font-size: 14px;
    opacity: 0.85;
  }

  .reset-btn{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 6px 14px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    cursor:pointer;
    opacity: 0.75;
  }

  .reset-btn:hover{
    color: #ff8b7d;
    border-color: #ff8b7d;
    opacity: 1;
  }

  .collection-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }

  .collection-item{
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13px;
    display:flex;
    align-items:center;
    gap: 8px;
    opacity: 0.5;
  }

  .collection-item.completed{
    opacity: 1;
    border-color: var(--gold);
  }

  .collection-item.locked{
    opacity: 0.4;
  }

  .locked-label{
    font-style: italic;
    opacity: 0.8;
  }

  .collection-check{
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid var(--line);
    flex-shrink: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 11px;
    color: var(--ink);
  }

  .collection-item.completed .collection-check{
    background: var(--gold);
    border-color: var(--gold);
  }

  @media (max-width: 420px){
    .badge{ width: 52px; height: 58px; font-size: 11px; }
  }
</style>
</head>

<div class="app">

  <div class="scoreboard">
    <div class="tile">
      <span class="num" id="scoreVal">0</span>
      <span class="lbl">ACIERTOS · <span id="totalLabel1"></span></span>
    </div>
    <div class="tile">
      <span class="num" id="progressVal">1</span>
      <span class="lbl">JUGADOR · <span id="totalLabel2"></span></span>
    </div>
  </div>

  <h1 class="title">Adivina la trayectoria</h1>
  <p class="subtitle">Estos son los escudos de los clubes por los que ha pasado el futbolista, en orden. Escribe su nombre para acertar.</p>

  <div class="tabs">
    <button class="tab active" id="tabPlay">Jugar</button>
    <button class="tab" id="tabCollection">Colección</button>
  </div>

  <div id="playView">
    <div id="gameArea">
      <div class="search-wrap">
        <input id="guessInput" type="text" placeholder="Escribe el nombre del jugador..." autocomplete="off">
        <button id="checkBtn" class="check-btn">Comprobar</button>
        <ul class="suggestions hidden" id="suggestions"></ul>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="path">
        <div class="path-track" id="pathTrack"></div>
      </div>

      <div class="controls">
        <button class="back-btn" id="backBtn">Volver</button>
        <button class="skip-btn" id="skipBtn">Pasar jugador</button>
      </div>
    </div>

    <div class="final-screen hidden" id="finalScreen">
      <div class="big-score"><span id="finalScore">0</span>/<span id="totalLabel3"></span></div>
      <p>jugadores adivinados correctamente</p>
      <button class="replay-btn" id="replayBtn">Jugar de nuevo</button>
    </div>
  </div>

  <div id="collectionView" class="hidden">
    <div class="collection-header">
      <span id="collectionCount">0/0 completados</span>
      <button class="reset-btn" id="resetCollectionBtn">Restablecer progreso</button>
    </div>
    <div class="collection-grid" id="collectionGrid"></div>
  </div>

</div>

Youssouf Fofana", "William Saliba", "Jules Koundé", "Benjamin Pavard", "Kylian Sané", "Leroy Sané", "Serge Gnabry", "Kai Havertz", "Timo Werner", "Julian Brandt", "Julian Draxler", "André Schürrle", "Mario Gómez", "Lukas Hradecky", "Manuel Akanji", "Antonio Rüdiger", "Niklas Süle", "Robin Gosens", "Joshua Kimmich", "Leon Goretzka", "Kimmich Joshua", "Emre Can", "Julian Weigl", "Sami Khedira", "Sebastian Vettel", "Miroslav Stoch", "Marek Suchý", "Aleksandar Kolarov", "Nemanja Matić", "Dušan Tadić", "Filip Kostić", "Sergej Milinković-Savić", "Aleksandar Mitrović", "Luka Jović", "Dušan Vlahović", "Darko Pančev", "Predrag Mijatović", "Dejan Savićević", "Siniša Mihajlović", "Vladimir Jugović", "Dragan Stojković", "Safet Sušić", "Ivica Osim", "Faruk Hadžibegić", "Enver Marić", "Elvir Baljić", "Edin Džeko", "Miralem Pjanić", "Sead Kolašinac", "Zvjezdan Misimović", "Hasan Salihamidžić", "Vedad Ibišević", "Asmir Begović", "Emir Spahić", "Naohiro Takahara", "Shunsuke Nakamura", "Hidetoshi Nakata", "Keisuke Honda", "Shinji Kagawa", "Shinji Okazaki", "Takumi Minamino", "Kaoru Mitoma", "Wataru Endo", "Takefusa Kubo", "Ritsu Dōan", "Ao Tanaka", "Son Heung-min", "Ki Sung-yueng", "Park Ji-sung", "Cha Bum-kun", "Ali Daei", "Sardar Azmoun", "Mehdi Taremi", "Karim Bagheri", "Yasser Al-Qahtani", "Sami Al-Jaber", "Majed Abdullah", "Salem Al-Dawsari", "Fahad Al-Muwallad", "Younes Belhanda", "Hakim Ziyech", "Sofiane Boufal", "Nayef Aguerd", "Romain Saïss", "Achraf Dari", "Noussair Mazraoui", "Yassine Bounou", "Abdelhamid Sabiri", "Riyad Boudebouz", "Islam Slimani", "Andy Delort", "Baghdad Bounedjah", "Riyad Karim", "Yacine Brahimi", "Sofiane Feghouli", "Rachid Ghezzal", "Adam Ounas", "Ismaël Bennacer", "Youcef Belaïli", "El Hadji Diouf", "Papa Bouba Diop", "Henri Camara", "Khalilou Fadiga", "Salif Diao", "Diomansy Kamara", "Demba Ba", "Mame Biram Diouf", "Papiss Cissé", "Idrissa Gueye", "Cheikhou Kouyaté", "Kalidou Koulibaly", "Ismaïla Sarr", "Boulaye Dia", "Nicolas Jackson", "John Mensah", "Asamoah Gyan", "Stephen Appiah", "Abédi Pelé", "Sulley Muntari", "Kwadwo Asamoah", "André Ayew", "Jordan Ayew", "Thomas Partey", "Mohammed Kudus", "Jay-Jay Okocha", "Nwankwo Kanu", "Rashidi Yekini", "Sunday Oliseh", "Austin Okocha", "Victor Moses", "Ahmed Musa", "Odion Ighalo", "Wilfred Ndidi", "Victor Osimhen", "Alex Iwobi", "Kelechi Iheanacho", "Samuel Kalu", "William Troost-Ekong", "Vincent Enyeama", "Peter Rufai", "Taribo West", "Celestine Babayaro", "Joseph Yobo", "Emmanuel Emenike", "Obafemi Martins", "Yakubu Aiyegbeni", "Roger Milla", "Patrick Mboma", "François Omam-Biyik", "Rigobert Song", "Marc-Vivien Foé", "Geremi Njitap", "Lauren Etame", "Éric Djemba-Djemba", "Vincent Aboubakar", "Karl Toko Ekambi", "André Onana", "Bertrand Traoré"];

  const STORAGE_KEY = 'trayectorias_completados_v1';

  let order = [];       // orden aleatorio de índices sobre "players"
  let currentIndex = 0; // posición dentro de "order"
  let score = 0;
  let completed = loadCompleted();
  let answeredThisRound = new Set(); // posiciones de "order" ya acertadas en esta partida

  const scoreVal = document.getElementById('scoreVal');
  const progressVal = document.getElementById('progressVal');
  const totalLabel1 = document.getElementById('totalLabel1');
  const totalLabel2 = document.getElementById('totalLabel2');
  const totalLabel3 = document.getElementById('totalLabel3');
  const pathTrack = document.getElementById('pathTrack');
  const feedback = document.getElementById('feedback');
  const input = document.getElementById('guessInput');
  const suggestions = document.getElementById('suggestions');
  const skipBtn = document.getElementById('skipBtn');
  const backBtn = document.getElementById('backBtn');
  const checkBtn = document.getElementById('checkBtn');
  const gameArea = document.getElementById('gameArea');
  const finalScreen = document.getElementById('finalScreen');
  const finalScore = document.getElementById('finalScore');
  const replayBtn = document.getElementById('replayBtn');
  const tabPlay = document.getElementById('tabPlay');
  const tabCollection = document.getElementById('tabCollection');
  const playView = document.getElementById('playView');
  const collectionView = document.getElementById('collectionView');
  const collectionGrid = document.getElementById('collectionGrid');
  const collectionCount = document.getElementById('collectionCount');
  const resetCollectionBtn = document.getElementById('resetCollectionBtn');

  function normalize(str){
    return str.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
  }

  // Índice de búsqueda: nombres jugables + nombres "señuelo" (jugadores reales
  // que no están en la base de datos del juego). Así el buscador siempre
  // ofrece muchas coincidencias y no delata cuál es la respuesta correcta.
  const searchIndex = [...new Set([...players.map(p => p.name), ...decoyNames])]
    .sort((a, b) => a.localeCompare(b, 'es'));

  function hideSuggestions(){
    suggestions.innerHTML = '';
    suggestions.classList.add('hidden');
  }

  input.addEventListener('input', () => {
    const val = normalize(input.value);
    if(!val){ hideSuggestions(); return; }
    const matches = searchIndex
      .filter(name => normalize(name).includes(val))
      .slice(0, 8);
    if(matches.length === 0){ hideSuggestions(); return; }
    suggestions.innerHTML = '';
    matches.forEach(name => {
      const li = document.createElement('li');
      li.textContent = name;
      li.addEventListener('click', () => {
        input.value = name;
        hideSuggestions();
        input.focus();
      });
      suggestions.appendChild(li);
    });
    suggestions.classList.remove('hidden');
  });

  document.addEventListener('click', (e) => {
    if(!e.target.closest('.search-wrap')) hideSuggestions();
  });

  function loadCompleted(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? new Set(JSON.parse(raw)) : new Set();
    }catch(e){
      return new Set();
    }
  }

  function saveCompleted(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...completed]));
    }catch(e){
      // si el navegador bloquea el almacenamiento, el progreso solo dura la sesión
    }
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function newOrder(){
    const pending = players
      .map((p, i) => i)
      .filter(i => !completed.has(players[i].name));
    // Si ya se completó la colección entera, se vuelve a barajar con todos
    order = shuffle(pending.length > 0 ? pending : players.map((_, i) => i));
  }

  function currentPlayer(){
    return players[order[currentIndex]];
  }

  function renderPath(){
    const player = currentPlayer();
    pathTrack.innerHTML = '';
    player.stops.forEach((stop, i) => {
      const clubName = stop.club;
      const club = clubData[clubName];
      const col = document.createElement('div');
      col.className = 'badge-col';

      const step = document.createElement('div');
      step.className = 'step-num';
      step.textContent = i + 1;

      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.style.background = club.bg;
      badge.style.color = club.fg;

      if(club.logo){
        const img = document.createElement('img');
        img.src = club.logo;
        img.alt = clubName;
        img.className = 'badge-logo';
        img.onerror = () => {
          img.remove();
          badge.textContent = club.abbr;
        };
        badge.appendChild(img);
      } else {
        badge.textContent = club.abbr;
      }

      const nameTag = document.createElement('div');
      nameTag.className = 'club-name-tag';
      nameTag.textContent = clubName;

      badge.addEventListener('click', () => {
        nameTag.classList.toggle('visible');
      });

      col.appendChild(badge);
      col.appendChild(step);
      col.appendChild(nameTag);
      pathTrack.appendChild(col);

      if(i < player.stops.length - 1){
        const nextStop = player.stops[i + 1];
        const arrowCol = document.createElement('div');
        arrowCol.className = 'arrow-col';

        const arrow = document.createElement('div');
        arrow.className = 'arrow-glyph';
        arrow.textContent = '➜';

        const arrowFee = document.createElement('div');
        const isEstimate = nextStop.fee.includes('(est.)');
        arrowFee.className = 'arrow-fee' + (isEstimate ? ' estimate' : '');
        arrowFee.textContent = nextStop.fee;

        arrowCol.appendChild(arrow);
        arrowCol.appendChild(arrowFee);

        if(nextStop.year){
          const arrowYear = document.createElement('div');
          arrowYear.className = 'arrow-year';
          arrowYear.textContent = nextStop.year;
          arrowCol.appendChild(arrowYear);
        }

        pathTrack.appendChild(arrowCol);
      }
    });
  }

  function updateHeader(){
    scoreVal.textContent = score;
    progressVal.textContent = Math.min(currentIndex + 1, order.length);
    totalLabel1.textContent = order.length;
    totalLabel2.textContent = order.length;
    backBtn.disabled = currentIndex === 0;
  }

  function showFeedback(kind, text){
    feedback.className = 'feedback ' + kind;
    feedback.textContent = text;
  }

  function clearFeedbackSoon(){
    setTimeout(() => { feedback.textContent = ''; feedback.className = 'feedback'; }, 1600);
  }

  function advance(){
    currentIndex++;
    if(currentIndex >= order.length){
      showFinal();
    } else {
      renderPath();
      updateHeader();
    }
  }

  function goBack(){
    if(currentIndex === 0) return;
    currentIndex--;
    feedback.textContent = '';
    feedback.className = 'feedback';
    input.value = '';
    hideSuggestions();
    renderPath();
    updateHeader();
  }

  function showFinal(){
    gameArea.classList.add('hidden');
    finalScreen.classList.remove('hidden');
    finalScore.textContent = score;
    totalLabel3.textContent = order.length;
  }

  function resetGame(){
    newOrder();
    currentIndex = 0;
    score = 0;
    answeredThisRound = new Set();
    gameArea.classList.remove('hidden');
    finalScreen.classList.add('hidden');
    renderPath();
    updateHeader();
    feedback.textContent = '';
    input.value = '';
  }

  function checkGuess(rawValue){
    const norm = normalize(rawValue);
    if(!norm) return;
    const player = currentPlayer();
    const candidates = [player.name, ...player.aliases].map(normalize);
    if(candidates.includes(norm)){
      if(!answeredThisRound.has(currentIndex)){
        answeredThisRound.add(currentIndex);
        score++;
        completed.add(player.name);
        saveCompleted();
      }
      showFeedback('correct', '¡Correcto! Era ' + player.name);
      clearFeedbackSoon();
      advance();
    } else {
      showFeedback('wrong', 'Incorrecto, sigue intentando');
    }
    input.value = '';
    hideSuggestions();
  }

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      checkGuess(input.value);
    }
  });

  checkBtn.addEventListener('click', () => {
    checkGuess(input.value);
  });

  skipBtn.addEventListener('click', () => {
    showFeedback('skip', 'Jugador saltado');
    clearFeedbackSoon();
    advance();
  });

  backBtn.addEventListener('click', goBack);

  replayBtn.addEventListener('click', resetGame);

  // --- Colección ---

  function renderCollection(){
    collectionGrid.innerHTML = '';
    const sorted = players.slice().sort((a, b) => a.name.localeCompare(b.name, 'es'));
    sorted.forEach(player => {
      const isDone = completed.has(player.name);
      const item = document.createElement('div');
      item.className = 'collection-item' + (isDone ? ' completed' : ' locked');

      const check = document.createElement('span');
      check.className = 'collection-check';
      check.textContent = isDone ? '✓' : '?';

      const label = document.createElement('span');
      label.textContent = isDone ? player.name : 'Jugador bloqueado';
      if(!isDone) label.className = 'locked-label';

      item.appendChild(check);
      item.appendChild(label);
      collectionGrid.appendChild(item);
    });
    collectionCount.textContent = completed.size + '/' + players.length + ' completados';
  }

  function showTab(tab){
    if(tab === 'collection'){
      playView.classList.add('hidden');
      collectionView.classList.remove('hidden');
      tabCollection.classList.add('active');
      tabPlay.classList.remove('active');
      renderCollection();
    } else {
      collectionView.classList.add('hidden');
      playView.classList.remove('hidden');
      tabPlay.classList.add('active');
      tabCollection.classList.remove('active');
    }
  }

  tabPlay.addEventListener('click', () => showTab('play'));
  tabCollection.addEventListener('click', () => showTab('collection'));

  resetCollectionBtn.addEventListener('click', () => {
    if(confirm('¿Seguro que quieres borrar tu progreso de la colección?')){
      completed = new Set();
      saveCompleted();
      renderCollection();
    }
  });

  newOrder();
  renderPath();
  updateHeader();
</script>
