<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ahorcado Futbolero</title>
<style>
  :root{
    --cesped-1:#1f5c34;
    --cesped-2:#1a4f2c;
    --tiza:#f4f0e6;
    --marcador-fondo:#0d2a17;
    --amarillo:#f4c542;
    --rojo:#c0392b;
    --linea:rgba(244,240,230,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Trebuchet MS', 'Segoe UI', sans-serif;
    background:
      repeating-linear-gradient(90deg, var(--cesped-1) 0px, var(--cesped-1) 60px, var(--cesped-2) 60px, var(--cesped-2) 120px);
    color:var(--tiza);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .cancha{
    width:100%;
    max-width:640px;
    background:var(--marcador-fondo);
    border:4px solid var(--tiza);
    border-radius:14px;
    padding:24px 22px 28px;
    position:relative;
    box-shadow:0 10px 0 rgba(0,0,0,0.25);
  }
  .cancha::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px dashed var(--linea);
    border-radius:8px;
    pointer-events:none;
  }
  h1{
    text-align:center;
    font-size:1.6rem;
    letter-spacing:1px;
    margin:0 0 4px;
    color:var(--amarillo);
    text-shadow:2px 2px 0 rgba(0,0,0,0.4);
  }
  .subtitulo{
    text-align:center;
    font-size:0.85rem;
    opacity:0.75;
    margin-bottom:18px;
  }
  .pista{
    background:rgba(244,240,230,0.08);
    border-left:4px solid var(--amarillo);
    padding:10px 14px;
    border-radius:6px;
    font-size:0.95rem;
    margin-bottom:18px;
  }
  .pista b{color:var(--amarillo);}
  .campo-palabra{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin:22px 0;
    min-height:44px;
  }
  .fila-nombre{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
  }
  .letra-hueco{
    width:32px;
    height:40px;
    border-bottom:3px solid var(--tiza);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.5rem;
    font-weight:bold;
    text-transform:uppercase;
  }
  .letra-hueco.espacio{
    border-bottom:none;
    width:16px;
  }
  .balon-estado{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:14px;
  }
  .vidas{
    display:flex;
    gap:6px;
    font-size:1.3rem;
  }
  .vidas span.usada{opacity:0.15; filter:grayscale(1);}
  .teclado{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(34px,1fr));
    gap:6px;
    margin-top:18px;
  }
  .tecla{
    background:var(--tiza);
    color:var(--marcador-fondo);
    border:none;
    border-radius:6px;
    padding:8px 0;
    font-weight:bold;
    font-size:0.95rem;
    cursor:pointer;
    transition:transform .08s ease;
  }
  .tecla:hover:not(:disabled){transform:translateY(-2px);}
  .tecla:disabled{opacity:0.25; cursor:default;}
  .tecla.correcta{background:#2e8b46; color:var(--tiza);}
  .tecla.incorrecta{background:var(--rojo); color:var(--tiza);}
  .mensaje{
    text-align:center;
    margin-top:18px;
    font-size:1.1rem;
    min-height:28px;
    font-weight:bold;
  }
  .mensaje.gano{color:#7ed957;}
  .mensaje.perdio{color:#ff7a6b;}
  .controles{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:16px;
  }
  .btn-accion{
    background:var(--amarillo);
    color:var(--marcador-fondo);
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    font-size:0.95rem;
  }
  .btn-accion:hover{filter:brightness(1.08);}
  .marcador{
    display:flex;
    justify-content:space-between;
    font-size:0.85rem;
    opacity:0.8;
    margin-top:10px;
  }
</style>
</head>

let jugadorActual = null;
let letrasUsadas = new Set();
let vidasRestantes = 6;
let juegoTerminado = false;
let score = { ganados: 0, jugados: 0 };

const ABC = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
const CARITAS_VIDA = ["🟢","🟢","🟢","🟢","🟢","🟢"];

function elegirJugador(){
  return JUGADORES[Math.floor(Math.random()*JUGADORES.length)];
}

function iniciarRonda(){
  jugadorActual = elegirJugador();
  letrasUsadas = new Set();
  vidasRestantes = 6;
  juegoTerminado = false;
  document.getElementById("pista").innerHTML = "<b>Pista:</b> " + jugadorActual.pista;
  document.getElementById("mensaje").textContent = "";
  document.getElementById("mensaje").className = "mensaje";
  pintarVidas();
  pintarPalabra();
  pintarTeclado();
  actualizarMarcador();
}

function pintarVidas(){
  const cont = document.getElementById("vidas");
  cont.innerHTML = "";
  for(let i=0;i<6;i++){
    const s = document.createElement("span");
    s.textContent = "⚽";
    if(i >= vidasRestantes) s.classList.add("usada");
    cont.appendChild(s);
  }
}

function pintarPalabra(){
  const cont = document.getElementById("campoPalabra");
  cont.innerHTML = "";

  const palabras = jugadorActual.nombre.split(" ");
  const primeraLinea = palabras[0];
  const segundaLinea = palabras.slice(1).join(" ");
  const filas = segundaLinea ? [primeraLinea, segundaLinea] : [primeraLinea];

  filas.forEach(texto => {
    const fila = document.createElement("div");
    fila.className = "fila-nombre";
    for(const ch of texto){
      if(ch === " "){
        const espacio = document.createElement("div");
        espacio.className = "letra-hueco espacio";
        fila.appendChild(espacio);
        continue;
      }
      const div = document.createElement("div");
      div.className = "letra-hueco";
      div.textContent = letrasUsadas.has(ch) ? ch : "";
      fila.appendChild(div);
    }
    cont.appendChild(fila);
  });
}

function pintarTeclado(){
  const cont = document.getElementById("teclado");
  cont.innerHTML = "";
  ABC.forEach(letra=>{
    const btn = document.createElement("button");
    btn.className = "tecla";
    btn.textContent = letra;
    btn.disabled = letrasUsadas.has(letra) || juegoTerminado;
    if(letrasUsadas.has(letra)){
      btn.classList.add(jugadorActual.nombre.includes(letra) ? "correcta" : "incorrecta");
    }
    btn.onclick = () => intentarLetra(letra);
    cont.appendChild(btn);
  });
}

function intentarLetra(letra){
  if(juegoTerminado || letrasUsadas.has(letra)) return;
  letrasUsadas.add(letra);
  if(!jugadorActual.nombre.includes(letra)){
    vidasRestantes--;
  }
  pintarVidas();
  pintarPalabra();
  pintarTeclado();
  revisarFinal();
}

function revisarFinal(){
  const letrasNombre = new Set(jugadorActual.nombre.replace(/ /g,"").split(""));
  const gano = [...letrasNombre].every(l => letrasUsadas.has(l));
  const perdio = vidasRestantes <= 0;

  if(gano || perdio){
    juegoTerminado = true;
    pintarTeclado();
    score.jugados++;
    const msg = document.getElementById("mensaje");
    if(gano){
      score.ganados++;
      msg.textContent = "¡Gol! Era " + jugadorActual.nombre;
      msg.className = "mensaje gano";
    } else {
      msg.textContent = "Fin del partido. Era " + jugadorActual.nombre;
      msg.className = "mensaje perdio";
    }
    actualizarMarcador();
  }
}

function actualizarMarcador(){
  document.getElementById("scoreTexto").textContent = "Aciertos: " + score.ganados + "/" + score.jugados;
  document.getElementById("rondaTexto").textContent = "⚽ Fútbol Ahorcado";
}

document.getElementById("btnNuevo").onclick = iniciarRonda;

window.addEventListener("keydown", (e)=>{
  const letra = e.key.toUpperCase();
  if(ABC.includes(letra)) intentarLetra(letra);
});

iniciarRonda();
</script>
