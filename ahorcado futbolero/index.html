<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ahorcado Futbolero</title>
<style>
  :root{
    --cesped-1:#1f5c34;
    --cesped-2:#1a4f2c;
    --tiza:#f4f0e6;
    --marcador-fondo:#0d2a17;
    --amarillo:#f4c542;
    --rojo:#c0392b;
    --linea:rgba(244,240,230,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Trebuchet MS', 'Segoe UI', sans-serif;
    background:
      repeating-linear-gradient(90deg, var(--cesped-1) 0px, var(--cesped-1) 60px, var(--cesped-2) 60px, var(--cesped-2) 120px);
    color:var(--tiza);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .cancha{
    width:100%;
    max-width:640px;
    background:var(--marcador-fondo);
    border:4px solid var(--tiza);
    border-radius:14px;
    padding:24px 22px 28px;
    position:relative;
    box-shadow:0 10px 0 rgba(0,0,0,0.25);
  }
  .cancha::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px dashed var(--linea);
    border-radius:8px;
    pointer-events:none;
  }
  h1{
    text-align:center;
    font-size:1.6rem;
    letter-spacing:1px;
    margin:0 0 4px;
    color:var(--amarillo);
    text-shadow:2px 2px 0 rgba(0,0,0,0.4);
  }
  .subtitulo{
    text-align:center;
    font-size:0.85rem;
    opacity:0.75;
    margin-bottom:18px;
  }
  .pista{
    background:rgba(244,240,230,0.08);
    border-left:4px solid var(--amarillo);
    padding:10px 14px;
    border-radius:6px;
    font-size:0.95rem;
    margin-bottom:18px;
  }
  .pista b{color:var(--amarillo);}
  .campo-palabra{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin:22px 0;
    min-height:44px;
  }
  .fila-nombre{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
  }
  .letra-hueco{
    width:32px;
    height:40px;
    border-bottom:3px solid var(--tiza);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.5rem;
    font-weight:bold;
    text-transform:uppercase;
  }
  .letra-hueco.espacio{
    border-bottom:none;
    width:16px;
  }
  .balon-estado{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    margin-bottom:14px;
  }
  .ahorcado-dibujo{
    width:150px;
    height:150px;
  }
  .ahorcado-dibujo .estructura{
    stroke:var(--tiza);
    opacity:0.55;
  }
  .ahorcado-dibujo .cuerpo{
    stroke:var(--amarillo);
  }
  .ahorcado-dibujo line,
  .ahorcado-dibujo circle{
    fill:none;
    stroke-width:4;
    stroke-linecap:round;
  }
  .ahorcado-dibujo .parte{
    opacity:0;
    transition:opacity .25s ease;
  }
  .ahorcado-dibujo .parte.visible{
    opacity:1;
  }
  .fallos-texto{
    font-size:0.85rem;
    opacity:0.8;
    text-align:center;
  }
  .teclado{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(34px,1fr));
    gap:6px;
    margin-top:18px;
  }
  .tecla{
    background:var(--tiza);
    color:var(--marcador-fondo);
    border:none;
    border-radius:6px;
    padding:8px 0;
    font-weight:bold;
    font-size:0.95rem;
    cursor:pointer;
    transition:transform .08s ease;
  }
  .tecla:hover:not(:disabled){transform:translateY(-2px);}
  .tecla:disabled{opacity:0.25; cursor:default;}
  .tecla.correcta{background:#2e8b46; color:var(--tiza);}
  .tecla.incorrecta{background:var(--rojo); color:var(--tiza);}
  .mensaje{
    text-align:center;
    margin-top:18px;
    font-size:1.1rem;
    min-height:28px;
    font-weight:bold;
  }
  .mensaje.gano{color:#7ed957;}
  .mensaje.perdio{color:#ff7a6b;}
  .controles{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:16px;
  }
  .btn-accion{
    background:var(--amarillo);
    color:var(--marcador-fondo);
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    font-size:0.95rem;
  }
  .btn-accion:hover{filter:brightness(1.08);}
  .marcador{
    display:flex;
    justify-content:space-between;
    font-size:0.85rem;
    opacity:0.8;
    margin-top:10px;
  }
</style>
</head>

</div>

  { nombre: "ERIC CANTONA", camiseta: "CANTONA", pista: "Delantero francés, ídolo del Manchester United en los 90, célebre por levantarse el cuello de la camiseta al festejar." },
  { nombre: "JOHN BARNES", camiseta: "BARNES", pista: "Anotó un gol individual inolvidable para Inglaterra ante Brasil, en pleno estadio Maracaná, en 1984." },
  { nombre: "DAVID SEAMAN", camiseta: "SEAMAN", pista: "Arquero inglés que no pudo evitar un famoso tiro libre en forma de globo de Ronaldinho, Mundial 2002." },
  { nombre: "ANDRES ESCOBAR", camiseta: "ESCOBAR", pista: "Defensor colombiano recordado por un autogol decisivo en el Mundial de 1994." },
  { nombre: "LAURENT BLANC", camiseta: "BLANC", pista: "Defensor francés apodado 'el presidente', anotó el primer gol de oro de la historia de los Mundiales, en 1998." },
  { nombre: "LUIS HERNANDEZ", camiseta: "LUIS HERNANDEZ", pista: "Delantero mexicano de pelo teñido de rubio, máximo goleador de su selección en el Mundial de 1998." },
  { nombre: "CUAUHTEMOC BLANCO", camiseta: "CUAUHTEMOC BLANCO", pista: "Inventó una gambeta propia, apodada 'cuauhtemiña', usada ante Bélgica en el Mundial 1998." },
  { nombre: "SINISA MIHAJLOVIC", camiseta: "MIHAJLOVIC", pista: "Defensor serbio, uno de los mejores especialistas del mundo en tiros libres." },
  { nombre: "PAOLO DI CANIO", camiseta: "DI CANIO", pista: "Delantero italiano recordado por atajar el balón con las manos en vez de anotar a un arco vacío, por fair play." },
  { nombre: "ASAMOAH GYAN", camiseta: "GYAN", pista: "Falló un penal decisivo en el último minuto del alargue ante Uruguay, cuartos de final del Mundial 2010." },
  { nombre: "IVAN ZAMORANO", camiseta: "ZAMORANO", pista: "Delantero chileno apodado 'Bam Bam', usó el dorsal '1+8' en el Inter tras cederle la camiseta número 9 a Ronaldo." },
  { nombre: "ENZO FRANCESCOLI", camiseta: "FRANCESCOLI", pista: "Mediocampista uruguayo apodado 'el Príncipe', inspiró el nombre del hijo de Zinedine Zidane." },
  { nombre: "FEDE VALVERDE", camiseta: "VALVERDE", pista: "Mediocampista uruguayo que derribó a Morata cuando se escapaba solo, en la prórroga de la final de la Supercopa de España 2020." },
];

let jugadorActual = null;
let letrasUsadas = new Set();
let vidasRestantes = 6;
let juegoTerminado = false;
let score = { ganados: 0, jugados: 0 };

const ABC = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
const CARITAS_VIDA = ["🟢","🟢","🟢","🟢","🟢","🟢"];

const PROGRESO_KEY = "ahorcado_futbolero_progreso_v1";

let progreso = cargarProgreso();

function cargarProgreso(){
  try{
    const datos = JSON.parse(localStorage.getItem(PROGRESO_KEY) || "{}");
    return {
      acertados: new Set(Array.isArray(datos.acertados) ? datos.acertados : []),
      fallados: new Set(Array.isArray(datos.fallados) ? datos.fallados : [])
    };
  }catch(e){
    return { acertados:new Set(), fallados:new Set() };
  }
}

function guardarProgreso(){
  localStorage.setItem(PROGRESO_KEY, JSON.stringify({
    acertados: [...progreso.acertados],
    fallados: [...progreso.fallados]
  }));
}

function elegirJugador(){
  // Los que has fallado tienen prioridad absoluta.
  let candidatos = JUGADORES.filter(j => progreso.fallados.has(j.nombre));

  // Después salen los que todavía no has acertado.
  if(!candidatos.length){
    candidatos = JUGADORES.filter(j => !progreso.acertados.has(j.nombre));
  }

  // Cuando ya has acertado todos, empieza un nuevo ciclo.
  if(!candidatos.length){
    progreso.acertados.clear();
    progreso.fallados.clear();
    guardarProgreso();
    candidatos = [...JUGADORES];
  }

  return candidatos[Math.floor(Math.random() * candidatos.length)];
}

function iniciarRonda(){
  jugadorActual = elegirJugador();
  letrasUsadas = new Set();
  vidasRestantes = 6;
  juegoTerminado = false;
  document.getElementById("pista").innerHTML = "<b>Pista:</b> " + jugadorActual.pista;
  document.getElementById("mensaje").textContent = "";
  document.getElementById("mensaje").className = "mensaje";
  pintarVidas();
  pintarPalabra();
  pintarTeclado();
  actualizarMarcador();
}

const PARTES_AHORCADO = [
  "parteCabeza",
  "parteTorso",
  "parteBrazoIzq",
  "parteBrazoDer",
  "partePiernaIzq",
  "partePiernaDer"
];

function pintarVidas(){
  const fallos = 6 - vidasRestantes;
  PARTES_AHORCADO.forEach((id, i)=>{
    const el = document.getElementById(id);
    el.classList.toggle("visible", i < fallos);
  });
  document.getElementById("fallosTexto").textContent = "Fallos: " + fallos + "/6";
}

function pintarPalabra(){
  const cont = document.getElementById("campoPalabra");
  cont.innerHTML = "";

  const palabras = jugadorActual.camiseta.split(" ");
  const primeraLinea = palabras[0];
  const segundaLinea = palabras.slice(1).join(" ");
  const filas = segundaLinea ? [primeraLinea, segundaLinea] : [primeraLinea];

  filas.forEach(texto => {
    const fila = document.createElement("div");
    fila.className = "fila-nombre";
    for(const ch of texto){
      if(ch === " "){
        const espacio = document.createElement("div");
        espacio.className = "letra-hueco espacio";
        fila.appendChild(espacio);
        continue;
      }
      if(ch === "-"){
        const guion = document.createElement("div");
        guion.className = "letra-hueco";
        guion.textContent = "-";
        fila.appendChild(guion);
        continue;
      }
      const div = document.createElement("div");
      div.className = "letra-hueco";
      div.textContent = letrasUsadas.has(ch) ? ch : "";
      fila.appendChild(div);
    }
    cont.appendChild(fila);
  });
}

function pintarTeclado(){
  const cont = document.getElementById("teclado");
  cont.innerHTML = "";
  ABC.forEach(letra=>{
    const btn = document.createElement("button");
    btn.className = "tecla";
    btn.textContent = letra;
    btn.disabled = letrasUsadas.has(letra) || juegoTerminado;
    if(letrasUsadas.has(letra)){
      btn.classList.add(jugadorActual.camiseta.includes(letra) ? "correcta" : "incorrecta");
    }
    btn.onclick = () => intentarLetra(letra);
    cont.appendChild(btn);
  });
}

function intentarLetra(letra){
  if(juegoTerminado || letrasUsadas.has(letra)) return;
  letrasUsadas.add(letra);
  if(!jugadorActual.camiseta.includes(letra)){
    vidasRestantes--;
  }
  pintarVidas();
  pintarPalabra();
  pintarTeclado();
  revisarFinal();
}

function revisarFinal(){
  const letrasNombre = new Set(jugadorActual.camiseta.replace(/[ -]/g,"").split(""));
  const gano = [...letrasNombre].every(l => letrasUsadas.has(l));
  const perdio = vidasRestantes <= 0;

  if(gano || perdio){
    juegoTerminado = true;
    pintarTeclado();
    score.jugados++;
    const msg = document.getElementById("mensaje");
    if(gano){
      score.ganados++;

      // Si lo aciertas, queda completado y no vuelve a salir
      // hasta que se haya completado el resto.
      progreso.acertados.add(jugadorActual.nombre);
      progreso.fallados.delete(jugadorActual.nombre);
      guardarProgreso();

      msg.textContent = "¡Gol! Era " + jugadorActual.camiseta;
      msg.className = "mensaje gano";
    } else {
      // Si lo fallas, tendrá prioridad en la siguiente partida.
      progreso.fallados.add(jugadorActual.nombre);
      progreso.acertados.delete(jugadorActual.nombre);
      guardarProgreso();

      msg.textContent = "Fin del partido. Era " + jugadorActual.camiseta;
      msg.className = "mensaje perdio";
    }
    actualizarMarcador();
  }
}

function actualizarMarcador(){
  document.getElementById("scoreTexto").textContent = "Aciertos: " + score.ganados + "/" + score.jugados;
  document.getElementById("rondaTexto").textContent = "⚽ Fútbol Ahorcado";
}

document.getElementById("btnNuevo").onclick = iniciarRonda;

window.addEventListener("keydown", (e)=>{
  const letra = e.key.toUpperCase();
  if(ABC.includes(letra)) intentarLetra(letra);
});

iniciarRonda();
</script>
